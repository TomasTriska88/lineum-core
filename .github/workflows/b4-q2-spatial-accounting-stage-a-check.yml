name: B4 Q2 Spatial Accounting Stage A Checker

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/b4-q2-spatial-accounting-stage-a-check.yml"

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify supported environment
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          print("python", sys.version)
          print("numpy", np.__version__)
          if int(np.__version__.split(".", 1)[0]) >= 2:
              raise SystemExit("NumPy must remain below 2.0 for this retained checker")
          PY

      - name: Run frozen B4 primary and checker tests
        run: |
          pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_spatial_accounting.py \
            tests/research/test_lineum_b4_q2_spatial_accounting_stage_a.py \
            tests/research/test_lineum_b4_q2_spatial_accounting_stage_a_check.py

      - name: Execute repaired independent Q2-SA1-A checker
        run: |
          mkdir -p .scratch
          python research/runners/lineum_b4_q2_spatial_accounting_stage_a_check.py \
            --primary research/lineum-public-tolog-b4/q2-spatial-accounting-stage-a.json \
            --output .scratch/q2-spatial-accounting-stage-a-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(".scratch/q2-spatial-accounting-stage-a-check.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("stage") != "Q2-SA1-A":
              raise SystemExit("Unexpected Stage A checker payload")
          print("B4_STAGE_A_CHECK_PLAIN_JSON_BEGIN")
          print(path.read_text(encoding="utf-8"), end="")
          print("B4_STAGE_A_CHECK_PLAIN_JSON_END")
          PY
