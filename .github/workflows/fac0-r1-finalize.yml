name: FAC0-R1 Finalize Retained Checkpoint

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fac0-r1-finalize.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain verified FAC0-R1 evidence and clean up
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config core.hooksPath .agent/hooks
          test "$(git hash-object research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md)" = "ee84776db0da534e3cbc80050b520d66fabdb66a"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          mkdir -p .scratch/fac0-r1/files
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9035871239/zip" -o .scratch/fac0-r1/receipt.zip
          unzip -q .scratch/fac0-r1/receipt.zip -d .scratch/fac0-r1/files
          awk -F"'" '/base64 -d > \.scratch\/fac0-r1\/capture.py/{print $2}' .github/workflows/fac0-r1-supported-replay.yml | base64 -d > .scratch/fac0-r1/capture.py
          test -s .scratch/fac0-r1/capture.py
          python .scratch/fac0-r1/capture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fac0-r1-supported-replay.yml .github/workflows/fac0-r1-finalize.yml
          git add research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/fac0-r1-finalize.yml .github/workflows/fac0-r1-supported-replay.yml research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json "
          git commit -m "research: retain FAC0-R1 supported replay"
          git pull --rebase origin develop
          git push origin HEAD:develop
