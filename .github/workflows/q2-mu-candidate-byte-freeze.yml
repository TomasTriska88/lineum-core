name: Retain Q2 mu byte-freeze non-result

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/q2-mu-candidate-byte-freeze.yml

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen chronology base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "99dafc744d08172a708010e00ad5ef7e7319b3db"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "4e363df1fec5faaec4356d1e40254724c545946b"
          test ! -e research/runners/lineum_b4_q2_mu_causal_echo.py
          test ! -e tests/research/test_lineum_b4_q2_mu_causal_echo.py
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Record technical non-result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")

          old_version = "**Version:** 0.25.4 \\\\"
          new_version = "**Version:** 0.25.5 \\\\"
          if text.count(old_version) != 1:
              raise SystemExit("unexpected report version")
          text = text.replace(old_version, new_version, 1)

          old_parent = "**Checkpoint parent:** `6437b4cd3cd2b6a1f3957cd42d6eed167507787c` \\\\"
          new_parent = "**Checkpoint parent:** `99dafc744d08172a708010e00ad5ef7e7319b3db` \\\\"
          if text.count(old_parent) != 1:
              raise SystemExit("unexpected checkpoint parent")
          text = text.replace(old_parent, new_parent, 1)

          old_status = (
              "the first Q2-M1 test-before-commit attempt failed at the frozen candidate-byte identity gate "
              "before pytest or scientific execution, so no causal-memory result exists yet; Questions 1 and 3 remain unchanged"
          )
          new_status = (
              "the first Q2-M1 test-before-commit attempt failed at the frozen candidate-byte identity gate before pytest or scientific execution; "
              "a subsequent byte-freeze transport shell also terminated before any candidate payload, pytest, or scientific execution, so no causal-memory result exists yet; "
              "Questions 1 and 3 remain unchanged"
          )
          if text.count(old_status) != 1:
              raise SystemExit("unexpected status phrase")
          text = text.replace(old_status, new_status, 1)

          addition = textwrap.dedent(r'''
          ### Q2-M1 candidate-byte freeze shell — technical transport non-result (`0.25.5`)

          After the failed byte-identity gate recorded in `0.25.4`, a deliberately fail-closed transport shell was committed at `99dafc744d08172a708010e00ad5ef7e7319b3db` to test whether a candidate-byte freeze workflow definition itself could be accepted without risking scientific execution. GitHub Actions run `31344497196`, job `93323801233`, completed with failure exactly at the explicit placeholder materialization step.

          The retained chronology is:

          ```text
          checkout: passed
          frozen base / report / branch checks: passed
          candidate payload materialization: not performed
          explicit placeholder SystemExit: reached
          py_compile: not executed
          pytest: not executed
          run_primary(): not executed
          runner/test repository commit: not created
          scientific JSON result: not created
          ```

          This is classified as `technical_transport_shell_non_result`. It contains no Q2-M1 observation and neither supports nor falsifies causal reuse by `mu`.

          The workflow-content transport approach is abandoned at this checkpoint. The next implementation attempt must reconstruct a new runner/test candidate solely from the already frozen `0.25.0`-`0.25.3` protocol, stage the exact candidate source as ordinary Git objects, read those objects back by hash, and use CI only as a supported-runtime regression checker of that exact candidate. No runner or test byte identity from the failed or placeholder attempts may be treated as retained source evidence.

          Stage A scientific execution remains prohibited until the exact regression-tested runner and test are branch-reachable on `develop`, their identities and supported environment are recorded in this report, and the temporary regression workflow has been removed or otherwise closed according to repository rules.
          ''').strip()

          if "technical_transport_shell_non_result" in text:
              raise SystemExit("transport non-result already recorded")
          text = text.rstrip() + "\n\n" + addition + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq '**Version:** 0.25.5 \\' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq 'technical_transport_shell_non_result' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/q2-mu-candidate-byte-freeze.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/q2-mu-candidate-byte-freeze.yml research/lineum-public-tolog-galactic-shape-b4.md "
          git diff --cached --check
          git commit -m "research: retain Q2 mu byte-freeze non-result"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
