name: FAC0-R1 Evidence Capture and Cleanup

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fac0-r1-supported-replay.yml

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover, verify, and retain FAC0-R1 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config core.hooksPath .agent/hooks
          test "$(git hash-object research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md)" = "ee84776db0da534e3cbc80050b520d66fabdb66a"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          mkdir -p .scratch/fac0-r1
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9035871239/zip" -o .scratch/fac0-r1/receipt.zip
          unzip -q .scratch/fac0-r1/receipt.zip -d .scratch/fac0-r1/files
          echo '' | base64 -d > .scratch/fac0-r1/capture.py
          python .scratch/fac0-r1/capture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fac0-r1-supported-replay.yml
          git add research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json
          git diff --cached --check
          git commit -m "research: retain FAC0-R1 supported replay"
          git pull --rebase origin develop
          git push origin HEAD:develop
