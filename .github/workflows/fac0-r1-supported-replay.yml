### 28.2 Why R1 was necessary

The earlier permanent FAC0 checkpoint preserved the base state, `CoreConfig`, perturbation amplitudes, observables, graph expectations, and causal question, but it did not preserve the exact smooth localized perturbation function used by the manually transcribed checker. An exact historical replay was therefore impossible.

