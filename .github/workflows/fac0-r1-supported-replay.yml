name: FAC0-R1 Supported Runtime Replay

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/fac0-r1-supported-replay.yml"

permissions:
  contents: read

jobs:
  fac0-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out frozen repository state
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install frozen FAC0-R1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==8.3.5"

      - name: Record environment and source receipts
        run: |
          python --version
          python -c "import numpy, pytest; print('numpy', numpy.__version__); print('pytest', pytest.__version__)"
          git rev-parse HEAD
          git hash-object lineum_core/math.py
          git hash-object research/runners/lineum_fac0_directed_coupling_replay.py
          git hash-object tests/research/test_lineum_fac0_directed_coupling_replay.py

      - name: Execute frozen FAC0-R1 runner and regression gate
        shell: bash
        run: |
          set -u
          runner_status=0
          test_status=0
          PYTHONPATH=. python research/runners/lineum_fac0_directed_coupling_replay.py > fac0-r1-output.json || runner_status=$?
          pytest -q tests/research/test_lineum_fac0_directed_coupling_replay.py | tee fac0-r1-test.txt || test_status=${PIPESTATUS[0]}
          cat fac0-r1-output.json
          sha256sum fac0-r1-output.json fac0-r1-test.txt
          if [ "$runner_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Retain temporary FAC0-R1 execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fac0-r1-supported-runtime-receipts
          path: |
            fac0-r1-output.json
            fac0-r1-test.txt
          if-no-files-found: error
          retention-days: 1
