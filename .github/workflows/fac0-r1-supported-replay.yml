name: FAC0-R1 Evidence Capture and Cleanup

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/fac0-r1-supported-replay.yml"

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact capture commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen repository inputs
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath .agent/hooks
          test "$(git hash-object research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md)" = "ee84776db0da534e3cbc80050b520d66fabdb66a"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          test "$(git hash-object research/runners/lineum_fac0_directed_coupling_replay.py)" = "facbd154ba24ff17ce03569da311da82d2ffb113"
          test "$(git hash-object tests/research/test_lineum_fac0_directed_coupling_replay.py)" = "03ca4e052641bdffb4d695cf93f5e6c92b83aa7e"
          test "$(git hash-object research/foundations/lineum-continuous-source-cosmology-validation.md)" = "3fba3925553cd5596e46c02fa35d1db91523537d"
          test "$(git hash-object research/foundations/lineum-root-programme-continuity-and-impact-ledger.md)" = "5304874451caf32313ad0e8e3c59e53958698d79"

      - name: Recover and verify exact successful FAC0-R1 receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .scratch/fac0-r1-receipt
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9035871239/zip" \
            -o .scratch/fac0-r1-receipt/receipt.zip
          unzip -q .scratch/fac0-r1-receipt/receipt.zip -d .scratch/fac0-r1-receipt/files
          test "$(sha256sum .scratch/fac0-r1-receipt/files/fac0-r1-output.json | awk '{print $1}')" = "af3a4fd4a012e9c2f62147fe70a97adce03fb6e149fe17385c7047aff385a99d"
          test "$(sha256sum .scratch/fac0-r1-receipt/files/fac0-r1-test.txt | awk '{print $1}')" = "09229b326b028651d725fa47cd1bae9fd8e0145ff8779bdb84ae2762c00ab737"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.scratch/fac0-r1-receipt/files/fac0-r1-output.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          checks = {
              'schema': data['schema'] == 'lineum-fac0-r1-directed-coupling-replay/1',
              'status': data['status'] == 'supported_runtime_replay',
              'passed': data['passed'] is True,
              'commit': data['repository_commit'] == '6b553b621bc5ea9ec16b649cbea2f931c6737b39',
              'math_blob': data['source']['math_blob_match'] is True and data['source']['observed_math_git_blob'] == 'bb877021810691223a0eb960a45493a2e351112a',
              'numpy': data['environment']['numpy'] == '1.26.4' and data['environment']['repository_numpy_contract_pass'] is True,
              'python': data['environment']['python'] == '3.11.9',
              'graph': data['graph_check']['passed'] is True and not data['graph_check']['required_failures'] and not data['graph_check']['forbidden_failures'],
              'linearity': data['linearity_check']['passed'] is True,
              'stochastic_delta': data['stochastic_delta_matched_rng']['passed'] is True,
              'payload_hash': data['canonical_payload_sha256_without_self'] == '18f40a2acd36c7bd8955191bdfcc00e1235733178bf832742076ac1c8b20d280',
          }
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'FAC0-R1 receipt verification failed: {failed}')
          PY

      - name: Promote receipt and update the single active report
        shell: bash
        run: |
          set -euo pipefail
          cp .scratch/fac0-r1-receipt/files/fac0-r1-output.json \
            research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          text, n = re.subn(
              r'^\*\*Status:\*\* .*$',
              '**Status:** active source-critical conceptual research, current-Core coupling/accounting audit, local-autonomy and epistemic-closure preregistration, and thread-independent missing-piece research checkpoint; FAC0-R1 directed response is reproduced in a repository-supported runtime and FAC1 is authorized; no physical-energy interpretation, new field, Core equation, whitepaper change, numerical physical validation, or ancient-physics claim is authorized  ',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit('status header replacement failed')
          replace_once('**Version:** 0.4.0  ', '**Version:** 0.4.1  ', 'version')
          replace_once('**Evidence cutoff:** 2026-08-07  ', '**Evidence cutoff:** 2026-08-09  ', 'evidence cutoff')
          replace_once('**Core snapshot at this checkpoint:** `b894f1c5a34683c9bbcbc703d47176b2577fbcbc`  ', '**FAC0-R1 execution commit:** `6b553b621bc5ea9ec16b649cbea2f931c6737b39`  ', 'execution commit')
          replace_once('**Previous version of this report:** version 0.3.1, blob `82fa1a86fe1261c9a20723280d7c4c816f93694d`  ', '**Previous version of this report:** version 0.4.0, blob `ee84776db0da534e3cbc80050b520d66fabdb66a`  ', 'previous version')
          replace_once('**Earlier version of this report:** version 0.3.0, blob `f9e5cdf26a749baf9a2de4a735105830578e7a38`  ', '**Earlier version of this report:** version 0.3.1, blob `82fa1a86fe1261c9a20723280d7c4c816f93694d`  ', 'earlier version')
          replace_once('**Older version of this report:** version 0.2.0, blob `1691f44a88afd7414a32afc3625ef3acdb46fcf7`  ', '**Older version of this report:** version 0.3.0, blob `f9e5cdf26a749baf9a2de4a735105830578e7a38`  ', 'older version')
          replace_once('**Initial version of this report:** version 0.1.0, blob `3ec1d893e4309cb2e06b97a2fc09d658f05ab149`  ', '**Legacy version of this report:** version 0.2.0, blob `1691f44a88afd7414a32afc3625ef3acdb46fcf7`  \n**Initial version of this report:** version 0.1.0, blob `3ec1d893e4309cb2e06b97a2fc09d658f05ab149`  ', 'legacy lineage')
          replace_once(
              'The numerical FAC0 corroboration is provisional because the available local Python environment violated the repository NumPy contract.',
              'FAC0-R1 is now reproduced in Python 3.11.9 with NumPy 1.26.4 against the exact current `math.py` blob; this supports the implementation-level directed response graph within the tested one-step domain, while physical energy, ontology, closed resource accounting, and real-world correspondence remain unestablished.',
              'confidence update',
          )

          marker = 'No negative result or source-critical restriction from versions `0.1.0` through `0.3.1` is withdrawn here.'
          insert = '''Version `0.4.1` records the first repository-supported FAC0-R1 execution. The exact current `step_core` NumPy path passed the frozen directed-edge graph, local linearity, and matched-RNG `delta` source-sensitivity gates under Python 3.11.9 and NumPy 1.26.4. The first remote attempt is retained as a technical execution failure because direct script invocation lacked the repository root on `sys.path`; the same attempt's pytest gate passed. The corrected invocation changed only `PYTHONPATH=.` and the second run passed. This supersedes the earlier unsupported-runtime numerical corroboration for FAC0 without promoting any physical-energy, ontology, or new-state claim.\n\n'''
          if marker not in text:
              raise SystemExit('version-history insertion marker missing')
          text = text.replace(marker, insert + marker, 1)

          replace_once(
              '## 25. Next checkpoint gate\n\nBefore modifying a Core equation, adding a Core field, changing whitepaper ontology, naming any quantity physical energy, or starting FAC1:',
              '## 25. Next checkpoint gate\n\nFAC0-R1 satisfied the runtime-replay prerequisites below on 2026-08-09. The list is retained as the frozen preregistration that governed the run; items 1 through 6 are now satisfied for the tested `math.py` blob, so FAC1 is authorized.\n\nBefore modifying a Core equation, adding a Core field, changing whitepaper ontology, naming any quantity physical energy, or starting FAC1:',
              'section 25 gate status',
          )

          new_264 = '''### 26.4 Immediate execution order

FAC0-R1 is complete for the tested current `math.py` blob. The immediate execution order is now:

```text
1. execute FAC1 term-isolated paired-versus-unpaired accounting;
2. execute FAC2 complete software source/sink bookkeeping;
3. execute FAC3 reciprocal closure versus finite source/receiver toy classes;
4. execute FAC4 static versus dynamic scaffold;
5. execute FAC5 held-out new-state necessity ladder;
6. only after an explicit DG0 model exists, compare it against the best same-layer survivor with the same held-out data and complexity discipline;
7. resume IC1, TS1, EC1, DB1, PI1, PH1, and LAEC0 after the more basic accounting/state question is resolved or when dependency logic makes one of them the cheaper discriminator.
```

The local execution environment still cannot resolve `github.com`, but the FAC0-R1 runtime blocker has been closed by the explicitly justified repository-supported GitHub-hosted replay recorded in Section 28. That technical workaround does not authorize weakening future local-first execution rules.
'''
          text, n = re.subn(r'### 26\.4 Immediate execution order\n.*?(?=\n### 26\.5)', new_264, text, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit('section 26.4 replacement failed')

          new_269 = '''### 26.9 Current resume sentence

If this work is opened in a new conversation, the operational instruction is simply:

> Continue the active missing-piece research from this report under current repository rules. FAC0-R1 has passed in a repository-supported runtime against the exact current `math.py` blob; proceed with FAC1, then FAC2-FAC5, keeping DG0 as an explicit but unprivileged later comparison class, preserve LAEC0 as a separately source-audited local-autonomy/epistemic-closure lane, and preserve all results in this report.
'''
          text, n = re.subn(r'### 26\.9 Current resume sentence\n.*?(?=\n## 27\.)', new_269, text, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit('section 26.9 replacement failed')

          if '\n## 28.' in text:
