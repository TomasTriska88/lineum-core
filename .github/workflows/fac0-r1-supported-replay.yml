name: FAC0-R1 Evidence Capture and Cleanup

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/fac0-r1-supported-replay.yml"

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen inputs and recover receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config core.hooksPath .agent/hooks
          test "$(git hash-object research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md)" = "ee84776db0da534e3cbc80050b520d66fabdb66a"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          test "$(git hash-object research/runners/lineum_fac0_directed_coupling_replay.py)" = "facbd154ba24ff17ce03569da311da82d2ffb113"
          test "$(git hash-object tests/research/test_lineum_fac0_directed_coupling_replay.py)" = "03ca4e052641bdffb4d695cf93f5e6c92b83aa7e"
          mkdir -p .scratch/fac0-r1
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9035871239/zip" \
            -o .scratch/fac0-r1/receipt.zip
          unzip -q .scratch/fac0-r1/receipt.zip -d .scratch/fac0-r1/files
          test "$(sha256sum .scratch/fac0-r1/files/fac0-r1-output.json | awk '{print $1}')" = "af3a4fd4a012e9c2f62147fe70a97adce03fb6e149fe17385c7047aff385a99d"
          test "$(sha256sum .scratch/fac0-r1/files/fac0-r1-test.txt | awk '{print $1}')" = "09229b326b028651d725fa47cd1bae9fd8e0145ff8779bdb84ae2762c00ab737"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.scratch/fac0-r1/files/fac0-r1-output.json').read_text(encoding='utf-8'))
          checks = {
              'schema': data['schema'] == 'lineum-fac0-r1-directed-coupling-replay/1',
              'status': data['status'] == 'supported_runtime_replay',
              'passed': data['passed'] is True,
              'commit': data['repository_commit'] == '6b553b621bc5ea9ec16b649cbea2f931c6737b39',
              'python': data['environment']['python'] == '3.11.9',
              'numpy': data['environment']['numpy'] == '1.26.4',
              'numpy_contract': data['environment']['repository_numpy_contract_pass'] is True,
              'math_blob': data['source']['math_blob_match'] is True and data['source']['observed_math_git_blob'] == 'bb877021810691223a0eb960a45493a2e351112a',
              'graph': data['graph_check']['passed'] is True and not data['graph_check']['required_failures'] and not data['graph_check']['forbidden_failures'],
              'linearity': data['linearity_check']['passed'] is True,
              'delta': data['stochastic_delta_matched_rng']['passed'] is True,
              'payload': data['canonical_payload_sha256_without_self'] == '18f40a2acd36c7bd8955191bdfcc00e1235733178bf832742076ac1c8b20d280',
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'FAC0-R1 receipt verification failed: {failed}')
          PY

      - name: Promote evidence and update active report
        shell: bash
        run: |
          set -euo pipefail
          cp .scratch/fac0-r1/files/fac0-r1-output.json \
            research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              text = text.replace(old, new, 1)

          text, n = re.subn(
              r'^\*\*Status:\*\* .*$',
              '**Status:** active source-critical conceptual research, current-Core coupling/accounting audit, local-autonomy and epistemic-closure preregistration, and thread-independent missing-piece research checkpoint; FAC0-R1 directed response is reproduced in a repository-supported runtime and FAC1 is authorized; no physical-energy interpretation, new field, Core equation, whitepaper change, numerical physical validation, or ancient-physics claim is authorized  ',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit('status replacement failed')
          replace_once('**Version:** 0.4.0  ', '**Version:** 0.4.1  ', 'version')
          replace_once('**Evidence cutoff:** 2026-08-07  ', '**Evidence cutoff:** 2026-08-09  ', 'evidence cutoff')
          replace_once(
              '**Core snapshot at this checkpoint:** `b894f1c5a34683c9bbcbc703d47176b2577fbcbc`  ',
              '**Core snapshot at this checkpoint:** `b894f1c5a34683c9bbcbc703d47176b2577fbcbc`  \n**FAC0-R1 execution commit:** `6b553b621bc5ea9ec16b649cbea2f931c6737b39`  ',
              'execution receipt',
          )
          replace_once(
              '**Previous version of this report:** version 0.3.1, blob `82fa1a86fe1261c9a20723280d7c4c816f93694d`  ',
              '**Previous version of this report:** version 0.4.0, blob `ee84776db0da534e3cbc80050b520d66fabdb66a`  ',
              'previous version',
          )
          replace_once(
              'The numerical FAC0 corroboration is provisional because the available local Python environment violated the repository NumPy contract.',
              'FAC0-R1 is reproduced in Python 3.11.9 with NumPy 1.26.4 against the exact current `math.py` blob; this supports the implementation-level directed response graph within the tested one-step domain, while physical energy, ontology, closed resource accounting, and real-world correspondence remain unestablished.',
              'confidence',
          )

          marker = 'No negative result or source-critical restriction from versions `0.1.0` through `0.3.1` is withdrawn here.'
          version_note = '''Version `0.4.1` records the first repository-supported FAC0-R1 execution. The actual current `step_core` NumPy path passed the frozen directed-edge graph, local-linearity, and matched-RNG `delta` source-sensitivity gates under Python 3.11.9 and NumPy 1.26.4. The first remote direct-script attempt failed only because the repository root was absent from Python's import path; the same attempt's pytest gate passed. The corrected invocation changed only `PYTHONPATH=.` and then passed. This supersedes the unsupported-runtime numerical corroboration as the FAC0 decision gate without promoting any physical-energy, ontology, new-state, or ancient-physics claim.\n\n'''
          if marker not in text:
              raise SystemExit('version-history marker missing')
          text = text.replace(marker, version_note + marker, 1)

          if '\n## 28. FAC0-R1 supported-runtime replay checkpoint' in text:
              raise SystemExit('FAC0-R1 section already exists')

          section = r'''

## 28. FAC0-R1 supported-runtime replay checkpoint

### 28.1 Answer first

FAC0-R1 passed against the actual current Core implementation in a repository-supported NumPy environment. The directed one-step response graph predicted by source inspection is therefore no longer supported only by the earlier manually transcribed checker running outside the repository NumPy contract.

The narrow result is:

```text
actual current step_core
    + frozen FAC0-R1 state/configuration/perturbations
    + Python 3.11.9
    + NumPy 1.26.4
    -> predicted directed one-step response graph reproduced
```

This is an implementation-level result only. It does **not** establish physical energy, a conserved physical resource, ontology for `Psi`, `Phi`, `mu`, `kappa`, or `delta`, a need for a new field, correspondence with nature, or any claim that ancient texts encode Lineum or modern physics.

### 28.2 Frozen protocol and provenance

FAC0-R1 repaired one reproducibility defect in the earlier FAC0 checkpoint: the exact localized perturbation function had not been preserved. R1 froze an anisotropic Gaussian with discrete-L2 normalization before the supported-runtime execution:

```text
center_x = 0.23
center_y = -0.17
sigma_x = 0.29
sigma_y = 0.31
Psi perturbation phase = 0.37 rad
primary epsilon = 1e-4
linearity epsilons = 5e-7, 1e-6, 2e-6
stochastic delta amplitudes = 0.01, 0.05, 0.2, 0.5
matched RNG seeds = 0..19
```

The base state, Core configuration, causal question, response observables, expected graph, amplitudes, thresholds, and interpretation class were not retuned after seeing the supported-runtime result.

Immutable execution receipts:

```text
execution commit = 6b553b621bc5ea9ec16b649cbea2f931c6737b39
math.py blob = bb877021810691223a0eb960a45493a2e351112a
FAC0-R1 runner blob = facbd154ba24ff17ce03569da311da82d2ffb113
FAC0-R1 test blob = 03ca4e052641bdffb4d695cf93f5e6c92b83aa7e
Python = 3.11.9
NumPy = 1.26.4
backend = numpy / CPU / deterministic
plain JSON SHA-256 = af3a4fd4a012e9c2f62147fe70a97adce03fb6e149fe17385c7047aff385a99d
canonical payload SHA-256 = 18f40a2acd36c7bd8955191bdfcc00e1235733178bf832742076ac1c8b20d280
temporary pytest-text SHA-256 = 09229b326b028651d725fa47cd1bae9fd8e0145ff8779bdb84ae2762c00ab737
```

The exact machine-readable output is retained beside this report as `lineum-ancient-texts-fac0-r1-supported-runtime.json`. It is a plain evidence companion, not a second narrative report.

### 28.3 Execution chronology and technical failure

The local workspace still could not resolve `github.com`, so the frozen execution could not be performed in a clean local checkout. That is an infrastructure limitation, not a scientific negative result. The already preregistered one-use GitHub-hosted replay was therefore used under the local-execution exception.

The first remote direct-script attempt at commit `6991f9ffb39e9cfc5f6a0dd193d4f84f0cf41512` reached the supported Python/NumPy environment but failed before producing runner JSON with:

```text
ModuleNotFoundError: No module named 'lineum_core'
```

The regression test in that attempt nevertheless imported the runner through its test loader and passed. The only execution correction was to prefix direct invocation with `PYTHONPATH=.`. No Core source, runner, test, perturbation, threshold, seed, metric, expected graph, or interpretation changed. The corrected run was GitHub Actions run `31305696058`, job `93225609854`, at execution commit `6b553b621bc5ea9ec16b649cbea2f931c6737b39`.

Official commands:

```text
PYTHONPATH=. python research/runners/lineum_fac0_directed_coupling_replay.py > fac0-r1-output.json
pytest -q tests/research/test_lineum_fac0_directed_coupling_replay.py
```

The pytest gate reported `1 passed in 0.14s`.

### 28.4 Observed deterministic graph and local linearity

The frozen graph gate passed with no required-edge failures and no forbidden-edge failures. The observed deterministic pattern remains:

```text
Psi perturbation   -> Psi, Phi, mu
Phi perturbation   -> Psi, Phi, mu
mu perturbation    -> Psi, Phi, mu
kappa perturbation -> Psi, Phi, mu, kappa
delta perturbation -> no deterministic response when stochastic source is disabled
```

The `Phi -> mu` and `mu -> Phi` one-step responses are still explained by sequential same-step writes through `Psi`; FAC0 does not convert them into evidence of direct reciprocal physical transfer. `kappa` affects all dynamic outputs while remaining supplied rather than evolved by `step_core`.

Self-edge slope stability across `5e-7`, `1e-6`, and `2e-6` perturbations passed the frozen `1e-4` relative-span criterion:

| edge | relative slope span |
|---|---:|
| `Psi -> Psi` | `1.1807809678013206e-10` |
| `Phi -> Phi` | `2.7925606612131193e-11` |
| `mu -> mu` | `1.632602842596243e-11` |
| `kappa -> kappa` | `3.555666872084596e-11` |

This supports local stability of these one-step responses under the tested perturbation scaling. It does not establish global linearity of Lineum dynamics.

### 28.5 Matched-RNG delta source sensitivity

With stochastic source enabled and matched RNG seeds, the frozen `delta` perturbations produced:

| delta perturbation L2 | changed seeds / 20 | maximum Psi difference | mean Psi difference |
|---:|---:|---:|---:|
| `0.01` | `0/20` | `0.0` | `0.0` |
| `0.05` | `3/20` | `0.003781864275455506` | `0.00046754347003772934` |
| `0.2` | `7/20` | `0.0038642918015632873` | `0.0010749120280950854` |
| `0.5` | `18/20` | `0.004829389915368274` | `0.0029997515655590733` |

The preregistered criterion required the largest perturbation to alter `Psi` for at least one matched seed; it passed. This supports only the implementation statement that `delta` enters the stochastic source-probability path.

### 28.6 Evidence status and programme impact

The independent component is methodological rather than a second complete numerical implementation: source inspection established the expected writes and ordering before the supported replay; FAC0-R1 then exercised the actual current `step_core`; the regression gate independently checked the frozen receipt conditions. The anti-green-test limit remains binding.

```text
current implementation computes directed writes = established by source audit
supported-runtime one-step response = reproduced
local perturbation scaling = reproduced within tested amplitudes
stochastic delta source sensitivity = reproduced within tested amplitudes/seeds
closed physical resource account = not established
physical energy identification = not established
new fundamental state necessity = not established
real-world physical correspondence = none
ancient-physics correspondence = none
```

Programme impact:

| programme branch | FAC0-R1 impact |
|---|---|
| current Core directed-coupling graph | `supports` |
| source-inspection same-step ordering | `supports` |
| FAC1 term-isolated accounting | `unblocks` |
| FAC2 source/sink bookkeeping | `depends_on FAC1` |
| FAC3 reciprocal/source/receiver classes | `unchanged, later gate` |
| FAC4 static versus dynamic scaffold | `unchanged, later gate` |
| FAC5 new-state necessity ladder | `unchanged, later gate` |
| DG0 deeper-generative/effective-equation candidate | `unaffected, remains unprivileged` |
| LAEC0 local-autonomy/epistemic-closure lane | `unaffected` |
| particle, identity, heredity, life, cosmology claims | `unaffected_unproven` |

No earlier negative result is withdrawn by FAC0-R1.

### 28.7 Next gate and thread handoff

FAC1 is now the cheapest useful discriminator. It must isolate terms that are conflated in the aggregate one-step response graph:

```text
explicit paired mode-coupling debit/credit;
Phi -> Psi interaction feedback;
grad(Phi) -> Psi drift;
Psi activity -> mu write;
mu -> modulation of Psi feedback;
kappa-dependent modulation without kappa evolution;
source injection and sink/removal paths.
```

After FAC1, continue FAC2 through FAC5 in order unless a frozen result makes another already registered discriminator strictly cheaper. Keep DG0 as an explicit later comparison class, not a rescue assumption. Preserve LAEC0 as the separately source-audited Gnostic local-autonomy/epistemic-closure lane. Do not add a new fundamental state before the existing-state, reciprocal-accounting, source/receiver, dynamic-scaffold, and history alternatives have had their preregistered tests.

**Resume instruction for a new conversation:** read the current repository rules and this report from `develop`, verify its current SHA, then continue from FAC1. Treat FAC0-R1 as `reproduced` at the implementation level only; retain every historical negative, contradiction, source-critical restriction, and the zero-evidence boundary on ancient-physics claims.
'''

          text = text.rstrip() + section + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit retained checkpoint and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fac0-r1-supported-replay.yml
          git add \
            research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md \
            research/foundations/lineum-ancient-texts-fac0-r1-supported-runtime.json
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "research: retain FAC0-R1 supported replay"
          git pull --rebase origin develop
          git push origin HEAD:develop
