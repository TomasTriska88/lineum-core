```

That failure was caused by Python's import path when executing a script located under `research/runners/`; it occurred before the runner could produce its JSON. In the same job, however, the regression test imported the runner through its test loader, called `run()`, and passed `1/1`. The failed direct invocation is retained as a technical execution failure and is not counted as a scientific FAC0 failure.

The only correction was to prefix the direct command with `PYTHONPATH=.`. No Core source, runner source, test, perturbation, threshold, seed, metric, expected graph, or interpretation was changed. The second run, GitHub Actions run `31305696058`, job `93225609854`, executed at commit `6b553b621bc5ea9ec16b649cbea2f931c6737b39` and completed successfully.

