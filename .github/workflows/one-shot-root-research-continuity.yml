name: One-shot root research continuity patch

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-root-continuity:
    if: github.event.pull_request.head.ref == 'codex/root-research-continuity'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch report hierarchy and inherited evidence
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          protocol = ".agent/continuous-research-reporting.md"
          replace_once(
              protocol,
              "## Whitepaper handoff\n",
              """## Root programme and report hierarchy

A child research lane never becomes an isolated source of truth merely because it is the currently active report.

For every decision-relevant child report:

- declare the exact root or master report path, its version, and its evidence cutoff;
- declare the full report lineage from the root programme through every immediate predecessor;
- before selecting, replacing, ranking, or rejecting a mechanism, re-read the root report and recover all inherited positive results, negative results, contradictions, open variants, stop conditions, and deferred gates that can affect the decision;
- restate every decision-relevant inherited premise inside the child report so that the child remains standalone without pretending that recent work reset the programme;
- maintain both a local verdict and a root-programme impact matrix using `supports`, `contradicts`, `constrains`, `depends_on`, `reopens`, `observationally_equivalent`, `unaffected`, or `not_yet_compared`;
- choose the next discriminator by its value across the complete programme, not merely by proximity to the newest experiment, metaphor, or report;
- preserve older and incompatible equation families as separate variants rather than silently narrowing the programme to the latest candidate.

When the root report is too large to re-read as one tool response, retrieve it by immutable blob or bounded sections, identify the sections relevant to the current decision, and explicitly register every material family that remains `not_yet_compared`. A ClickUp task, chat summary, child report, or whitepaper is not a substitute for the root scientific record.

A child lane is not ready for a consequential experiment while its report cannot explain how the proposed action follows from the complete inherited programme rather than only from recent work.

## Whitepaper handoff
""",
          )

          parent = "research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md"
          replace_once(parent, "**Version:** 0.8.0  ", "**Version:** 0.9.0  ")
          replace_once(
              parent,
              "**Predecessor:** `research/foundations/lineum-core-static-baseline-live-state-transplant-matrix.md`.\n",
              """**Root programme:** `research/foundations/lineum-continuous-source-cosmology-validation.md`, version `0.4.14`, evidence cutoff `2026-07-29`.

**Immediate predecessor:** `research/foundations/lineum-core-static-baseline-live-state-transplant-matrix.md`.

**Report lineage:** continuous-source/cosmology programme -> deterministic state transplant -> static baseline versus live state -> active growth and scaffold repair.
""",
          )
          replace_once(
              parent,
              "## 1. Answer first\n",
              """## 0. Root-programme continuity and inherited evidence

This report is a narrow discriminator inside the long-running continuous-source, cosmology, localization, copying, boundary, and abiogenesis programme. It does not restart Lineum research at the latest `mu x kappa` matrix, and the mechanism ranking in Section 9 is only a ranking inside this repair subprogramme.

The following inherited results and open gates constrain every interpretation and next-step choice here:

| Root-programme evidence | Inherited status | Consequence for this lane |
|---|---|---|
| Current `F0` source accounting separates a coherent software pump from centered stochastic innovations; the pump adds `0.015` amplitude per unit model time at exact vacuum and `kappa=1`, while the centered variance rate scales with the numerical step and vanishes under refinement. No physical fuel reservoir is debited. | `implementation_fact_with_open_physical_account` | No active-growth candidate may be called physical fuel merely because it raises field norm. A resource debit, return path, and closed ledger remain separate gates. |
| Pump-only evolution raised norm but stayed spatially uniform; centered randomness nucleated dense winding activity; adding the current pump suppressed the tested defect population. Source-off centered-only schedules left a late multi-defect remnant, not an identified localized object. | `bounded_formation_and_schedule_results` | Growth, symmetry breaking, population persistence, localization, object identity, and repair must remain separate observables. |
| The frozen v3 transport observer also accepts smooth transported disorder and therefore is not a particle or identity observer. | `observer_nonidentification` | A repair success requires topology, localization, far-field, and lineage controls rather than transport alone. |
| ST1B showed that a source-free periodic LAP4 wave subset can be decomposed with a reversible numerical seam. | `supported_numerical_decomposition_only` | This does not supply a physical membrane, scaffold, particle boundary, or independent universe. |
| ST1C tested ten current-field seam candidates and none supplied passive elastic storage with reversible return without an undeclared projector or pump. | `unsupported_under_tested_conditions` | Static or passive current `kappa`, `phi`, and `mu` roles cannot be assumed to be a complete living mould. Delayed, active, state-responsive, born/deleted, and new-boundary variants remain open. |
| AB1-C ran frozen and active parent-to-descendant prerequisites with zero candidate descendant frames; the largest receiver match was `0.54597` against the preregistered `0.80` threshold. | `copying_unsupported_under_tested_conditions` | Activity amplification and morphological resemblance are not content copying, inheritance, or reproduction. |
| AB1-E closed engineered mass/resource ledgers only because copying, fission, selection, specialization, and interaction laws were inserted by design. | `engineered_accounting_prerequisite_only` | A coherent synthetic-life toy cannot be cited as emergence from the current Core. |
| Full live fields, configuration, and RNG state reproduced exact continuation; changing future RNG broke byte identity. | `software_replay_supported` | Exact replay is not autonomous reconstruction, identity, or heredity. |
| A static recipe under independent stochastic history retained broad family resemblance but not exact donor state, and retaining the recipe beside a live state had no runtime effect. | `static_recipe_runtime_causality_falsified` | Any successful “mould” must be causally active after initialization or be explicitly classified as an external controller. |

Whole-programme decision rule:

1. Eq-11.1 is only one provenance candidate inside this child lane, not the default answer to the master programme.
2. The historical `epsilon` cycle, active foam, dynamic scaffold, generative controller, P3 same-state replay, P4 slow-medium ablations, explicit reservoir accounting, robustness, and substrate/noise gates remain distinct and reopenable.
3. Every local result must be propagated back to the root programme as a constraint, contradiction, dependency, or reopen trigger before the next mechanism is selected.
4. No latest-lane success can promote particles, identity, heredity, life, cosmology, or nature without passing the corresponding root-programme gates.

## 1. Answer first
""",
          )
          replace_once(
              parent,
              "- `verifier embedding and ranking`: embedded the exact verifier payload below; selected Eq-11.1 only for provenance reconstruction.\n",
              """- `verifier embedding and ranking`: embedded the exact verifier payload below; selected Eq-11.1 only for provenance reconstruction.
- `root-programme continuity correction`: reattached this lane to `lineum-continuous-source-cosmology-validation.md` v0.4.14 and inherited its source-accounting, observer, boundary, copying, engineered-accounting, transport, and open P3-P7 constraints before further mechanism selection.
""",
          )

          child = "research/foundations/lineum-core-eq11-growth-scaffold-provenance-gate.md"
          replace_once(child, "**Version:** 0.9.0  ", "**Version:** 0.10.0  ")
          replace_once(
              child,
              "**Parent programme:** `research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md`\n",
              """**Root programme:** `research/foundations/lineum-continuous-source-cosmology-validation.md`, version `0.4.14`, evidence cutoff `2026-07-29`.

**Parent programme:** `research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md`.

**Report lineage:** continuous-source/cosmology programme -> deterministic state transplant -> static baseline versus live state -> active growth and scaffold repair -> Eq-11.1 provenance gate.
""",
          )
          replace_once(
              child,
              "## 1. Answer first\n",
              """## 0. Whole-programme inheritance and anti-tunnel-vision gate

This Eq-11.1 lane is a provenance subproblem inside the complete long-running Core research programme. It must not treat the latest repair matrix, the latest equation-history prose, or Eq-11.1 itself as the whole research universe.

Inherited constraints that remain binding:

- current `F0` contains a coherent software pump but no demonstrated physical fuel reservoir or closed resource debit;
- centered randomness can nucleate dense winding activity, while the present pump can raise norm and suppress that activity;
- the surviving centered-only source-off signal is a multi-defect population remnant, not a persistent localized object or particle identity;
- the v3 transport observer is non-identifying because smooth transported disorder can also pass;
- ST1C found no passive elastic reversible membrane among ten tested current-field `kappa`, `phi`, `mu`, projection, mode-coupling, and diffusion candidates;
- ST1B supports only a reversible numerical seam for a source-free linear subset, not a physical boundary;
- AB1-C found zero candidate descendants and a best receiver match of `0.54597` against `0.80`, so amplification is not copying;
- AB1-E verifies engineered accounting logic only, because copying, fission, selection, and specialization were inserted;
- exact state-plus-RNG transplant supports software replay only;
- the static recipe has no runtime causal role and does not reconstruct an exact donor under independent stochastic history;
- P3-P7, `epsilon`, active foam, dynamic boundaries, explicit reservoirs, robustness, and substrate/noise hypotheses remain open programme branches.

Therefore Eq-11.1 may advance only as one traceable active-growth candidate. A recovered stable baseline would not by itself establish repair, a closed fuel cycle, a membrane, object identity, copying, heredity, life, a Standard Model particle, cosmology, or correspondence with nature.

## 1. Answer first
""",
          )
          replace_once(
              child,
              "Eq-11.1 remains the highest-priority distinct “active growth” candidate for the owner’s yeast-plus-mould hypothesis because an explicit growth/leakage equation survives in the repository. It is **not yet reproducible enough to run a repair experiment**.\n",
              "Within the active-growth-and-scaffold subprogramme, Eq-11.1 is the first provenance candidate because an explicit growth/leakage equation survives in the repository. This is not a whole-programme priority claim. Eq-11.1 is **not yet reproducible enough to run a repair experiment**.\n",
          )
          replace_once(
              child,
              "## 7. Hard preregistered gate\n",
              """### 6.2 Root-programme impact matrix

| Inherited programme branch | Relationship to Eq-11.1 provenance | Required handling before or after a baseline |
|---|---|---|
| exact source accounting and P1/P2 schedules | `constrains` | distinguish active growth from unbudgeted pumping, numerical noise, symmetry breaking, and population renewal |
| particle/transport observer audit | `constrains` | require topology, localization, far-field quietness, and object-level controls; transport metrics alone cannot qualify survival |
| ST1B reversible seam | `unaffected` for Eq-11.1 provenance; `depends_on` only for later boundary decomposition | do not import a numerical seam as a physical scaffold |
| ST1C passive current-field membrane audit | `contradicts` any assumption that existing passive fields already provide a complete reversible mould | keep active, delayed, dynamic, and new-boundary variants separate and open |
| AB1-C parent-to-descendant audit | `constrains` | do not interpret stable amplitude or reconstruction as copying without content-dependent descendant controls |
| AB1-E engineered life/accounting prerequisite | `constrains` | keep inserted copying/fission/selection laws separate from current-Core emergence |
| deterministic transplant | `observationally_equivalent` only to exact software continuation | do not use replay as evidence of autonomous repair or heredity |
| static recipe/live-state matrix | `supports` the need for a causally active mechanism; `contradicts` a passive provenance-only mould | require runtime interventions and source-off persistence |
| `epsilon`, active foam, dynamic scaffold, generative controller, P3-P7 | `not_yet_compared` | preserve as separate variants; rank again at the root-programme level after this provenance gate closes |

A local Eq-11.1 verdict is not decision-complete until its effect on every row above is recorded in the root programme or an explicit successor synthesis.

## 7. Hard preregistered gate
""",
          )
          replace_once(
              child,
              "- `artifact-matrix correction`: updated the permanent matrix to distinguish repository absence, unversioned local references, and invalid scratch queries without hiding the earlier methodological error.\n",
              """- `artifact-matrix correction`: updated the permanent matrix to distinguish repository absence, unversioned local references, and invalid scratch queries without hiding the earlier methodological error.
- `owner whole-report correction`: the owner required explicit continuation from the complete Codex research programme rather than concentration on recent lanes; the report now inherits the root v0.4.14 source, observer, boundary, copying, engineered-accounting, replay, and open P3-P7 constraints and limits Eq-11.1 priority to this subprogramme.
""",
          )

          Path(".github/workflows/one-shot-root-research-continuity.yml").unlink()
          trigger = Path(".agent/trigger-root-research-continuity.txt")
          if trigger.exists():
              trigger.unlink()

      - name: Verify narrow scope and required markers
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .agent/continuous-research-reporting.md \
            .github/workflows/one-shot-root-research-continuity.yml \
            research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md \
            research/foundations/lineum-core-eq11-growth-scaffold-provenance-gate.md | sort)"
          test "$changed" = "$expected"
          grep -Fq 'Root programme and report hierarchy' .agent/continuous-research-reporting.md
          grep -Fq 'lineum-continuous-source-cosmology-validation.md`, version `0.4.14`' research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md
          grep -Fq 'Whole-programme inheritance and anti-tunnel-vision gate' research/foundations/lineum-core-eq11-growth-scaffold-provenance-gate.md
          grep -Fq '**Version:** 0.10.0' research/foundations/lineum-core-eq11-growth-scaffold-provenance-gate.md

      - name: Commit continuity correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/continuous-research-reporting.md \
            .github/workflows/one-shot-root-research-continuity.yml \
            research/foundations/lineum-core-active-growth-scaffold-repair-matrix.md \
            research/foundations/lineum-core-eq11-growth-scaffold-provenance-gate.md
          git commit -m "research: restore root programme continuity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
