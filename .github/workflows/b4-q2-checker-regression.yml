name: B4 Q2 Checker Regression Gate

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/b4-q2-checker-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify supported environment
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          print("python", sys.version)
          print("numpy", np.__version__)
          if int(np.__version__.split(".", 1)[0]) >= 2:
              raise SystemExit("NumPy must remain below 2.0 for this retained checker")
          PY

      - name: Run B4 checker regression gate
        run: |
          pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_spatial_accounting.py \
            tests/research/test_lineum_b4_q2_spatial_accounting_stage_a.py \
            tests/research/test_lineum_b4_q2_spatial_accounting_stage_a_check.py
