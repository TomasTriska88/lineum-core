name: Q2-M1 supported-runtime regression gate

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/q2-m1-regression-one-use.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt 'numpy==1.26.4' 'pytest==9.1.1'

      - name: Verify runtime and exact frozen identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import platform
          from pathlib import Path
          import numpy as np
          import pytest

          expected = {
              'research/runners/lineum_b4_q2_mu_causal_reuse.py': (
                  'e2de0adf272a5e2c48eff60019ef9343eefa6bf6',
                  'd8fe1ae5c0e16820a5d2a7ac2ae5259f5d8cd2480b8f25cf7d4d67f61f6a45b3',
              ),
              'tests/research/test_lineum_b4_q2_mu_causal_reuse.py': (
                  'e7aafa2ce9e87ecd4962ee459a98878eee7c4d7d',
                  '8ff5df8439c35e6f2740a56d4c126848809c3b6bef56b093689128f2b978cd42',
              ),
          }

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode('ascii')
              return hashlib.sha1(header + data).hexdigest()

          assert platform.python_version().startswith('3.11.')
          assert np.__version__ == '1.26.4'
          assert pytest.__version__ == '9.1.1'
          for path, (expected_blob, expected_sha256) in expected.items():
              data = Path(path).read_bytes()
              assert git_blob_sha(data) == expected_blob, path
              assert hashlib.sha256(data).hexdigest() == expected_sha256, path
          assert git_blob_sha(Path('lineum_core/math.py').read_bytes()) == 'bb877021810691223a0eb960a45493a2e351112a'
          assert git_blob_sha(Path('requirements.txt').read_bytes()) == '942f2b94b3d3f8c767451ae2d847a7b17c86d81e'
          assert git_blob_sha(Path('requirements-dev.txt').read_bytes()) == '7a0907e3e6c2d15400d19b536227a509910ae7e9'
          assert git_blob_sha(Path('research/lineum-public-tolog-galactic-shape-b4.md').read_bytes()) == '7119da7d1cc078142353dd28e98232ff7dfcd8f8'
          print(f'Python={platform.python_version()} NumPy={np.__version__} pytest={pytest.__version__}')
          PY

      - name: Compile exact candidate sources
        run: |
          python -m py_compile research/runners/lineum_b4_q2_mu_causal_reuse.py tests/research/test_lineum_b4_q2_mu_causal_reuse.py

      - name: Run permanent Q2-M1 regression suite only
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/research/test_lineum_b4_q2_mu_causal_reuse.py | tee /tmp/q2m1-pytest.txt
          grep -Eq '18 passed' /tmp/q2m1-pytest.txt

      - name: Assert scientific primary was not executed
        run: |
          echo 'Regression-only gate complete. run_primary() and runner CLI were not invoked.'
