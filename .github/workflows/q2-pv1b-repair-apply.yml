name: Q2 PV1-B Repair Transport Checkpoint

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-repair-apply.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record transport failures and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "0d519db5ed05d971d46e1c9867b5d22203f51484"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          python - <<'PY'
          from pathlib import Path
          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          version_line = "**Version:** 0.24.3  \n"
          if lines.count(version_line) != 1:
              raise SystemExit("report version marker mismatch")
          lines[lines.index(version_line)] = "**Version:** 0.24.4  \n"
          marker = "## 9. Preserved failure and publication chronology\n"
          if lines.count(marker) != 1:
              raise SystemExit("section-9 marker mismatch")
          section = [
              "#### 8.23.3 Repair-application transport failures — no checker science\n",
              "\n",
              "The first workflow intended to apply the already-frozen Section 8.23.1 repair ran as workflow run `31327667729`, job `93280534559`, from source commit `f6550bbfe2d5595dffb86f9667184764e9412b83`. Checkout, every frozen report/checker/test/protocol/primary Git identity, repository dependency installation, and the exact Python `3.11.15` / NumPy `1.26.4` / pytest `9.1.1` runtime checks passed. The workflow then stopped inside its fail-closed source patcher because one overlong byte-for-byte text replacement matched zero times (`frozen replacement matched 0 times`). The regression-test step was skipped, the checker source was not committed, and no 28-case scientific checker command ran.\n",
              "\n",
              "A second transport attempt was published from commit `1f8b44646f11519e8916857e521ec2a89bb1c0cc` as workflow run `31328022593`, but GitHub created no job for the run. Inspection of the workflow source shows that unindented lines embedded inside YAML block-scalar Python string literals broke workflow parsing before job creation. Therefore no checkout, report mutation, test, source patch, or scientific command ran in that attempt.\n",
              "\n",
              "**Classification:** both events are technical transport non-results. They supply no Q2 evidence and do not alter the frozen repair semantics. The branch-reachable checker remains the unchanged pre-repair blob `50a26bcfc7ef16af33f192b97eb99690e8a13fea`. The next permitted action is a fresh minimal repair gate whose source-edit logic is constrained to exact line/function boundaries, contains no YAML-unsafe multiline literals, runs the unchanged old tests plus the two already-frozen residual regressions before any checker-source commit, and invokes no 28-case scientific checker. No scientific threshold, equation, case, observer, primary datum, or repair rule may change.\n",
              "\n",
          ]
          insert_at = lines.index(marker)
          lines[insert_at:insert_at] = section
          history_hit = False
          for i, line in enumerate(lines):
              if "`0.24.3` records the supported-runtime test-first gate" in line:
                  lines[i] = line.rstrip("\n") + " `0.24.4` records two subsequent repair-application transport failures: one fail-closed source-pattern mismatch before tests and one YAML rejection before job creation; neither changed the checker or ran science, and only a minimal transport retry of the already-frozen repair is authorized.\n"
                  history_hit = True
                  break
          if not history_hit:
              raise SystemExit("version-history marker mismatch")
          path.write_text("".join(lines), encoding="utf-8")
          PY
          rm .github/workflows/q2-pv1b-repair-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lineum-public-tolog-galactic-shape-b4.md .github/workflows/q2-pv1b-repair-apply.yml
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: record Q2 PV1-B repair transport failures"
          git push origin HEAD:develop
