name: B4 Q2 mu causal prereg checkpoint

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml

permissions:
  contents: write

jobs:
  checkpoint:
    if: "${{ github.event.head_commit.message == 'chore: add one-use B4 mu prereg workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen base and report identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b940373f8356f9d7b24a53de47b0ab7938ac924c"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "b9140c49f8130ec3e04af217fc575905a740ec46"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          test "$(git hash-object requirements.txt)" = "942f2b94b3d3f8c767451ae2d847a7b17c86d81e"
          test "$(git hash-object requirements-dev.txt)" = "7a0907e3e6c2d15400d19b536227a509910ae7e9"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Update authoritative B4 preregistration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")

          old_status = (
              "Question 2 remains negative within the previously tested domain; the owner-intuition gate "
              "has been answered and a coordinate-safe existing-mechanism audit identifies retained `mu` "
              "history as the cheapest next Q2 discriminator, but no new causal-return execution has yet "
              "been performed; Questions 1 and 3 remain unchanged"
          )
          new_status = (
              "Question 2 remains negative within the previously tested domain; the owner-intuition gate "
              "has been answered, the coordinate-safe existing-`mu` audit is complete, and `Q2-M1` now "
              "preregisters a fail-closed causal-reuse gate before any direct Q2 rescue attempt; no new "
              "causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          if text.count(old_status) != 1:
              raise SystemExit(f"expected one old status phrase, found {text.count(old_status)}")
          text = text.replace(old_status, new_status, 1)

          replacements = {
              "**Version:** 0.24.9 \\": "**Version:** 0.25.0 \\",
              "**Checkpoint parent:** `f597cba4c9ac88924b2b50aebeb1f8b3a0f9a375` \\":
                  "**Checkpoint parent:** `b940373f8356f9d7b24a53de47b0ab7938ac924c` \\",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one metadata token: {old!r}")
              text = text.replace(old, new, 1)

          authority_anchor = (
              "Version `0.24.9` records the owner's independent post-negative intuition that the missing "
              "ingredient may be a description, instruction, or guide for returning toward a prior state"
          )
          idx = text.find(authority_anchor)
          if idx < 0:
              raise SystemExit("0.24.9 authority anchor not found")
          paragraph_end = text.find("\n\n", idx)
          if paragraph_end < 0:
              raise SystemExit("0.24.9 authority paragraph end not found")
          authority_insert = (
              "\n\nVersion `0.25.0` freezes `Q2-M1` before any new causal-memory outcome is inspected. "
              "The protocol reuses the already registered current-engine structural-memory parameter family "
              "instead of selecting new values after the Q2 failure, fixes `drift_strength = 0` so the "
              "coordinate-sensitive directional `phi` gradient is absent, and separates a necessary "
              "history-reuse gate from the stronger Question 2 return criterion. A positive history-dependent "
              "echo is explicitly insufficient to rescue Q2; direct Q2 return remains gated behind a later "
              "report checkpoint using the unchanged previously frozen return observers and thresholds. No "
              "production equation, whitepaper, Q1 result, or Q3 conclusion changes in this preregistration."
          )
          text = text[:paragraph_end] + authority_insert + text[paragraph_end:]

          section = r'''## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue

### Question and role in the three-question programme

`Q2-M1` asks the cheapest necessary question implied by the owner's independent "description / guide / instruction" intuition:

> Can an already implemented Lineum history field make two systems with the same present `psi` evolve differently because their retained spatial histories differ, under a coordinate-safe deterministic current-engine configuration?

This is **not yet the Question 2 success test**. A causal echo would establish only that retained history is reused by the implemented dynamics. Question 2 still requires a bounded, admissible return after perturbation. Therefore the protocol is fail-closed and staged:

```text
Stage A: causal-reuse gate
    if retained history does not cause a valid echo -> stop; do not run direct Q2 rescue
    if retained history does cause a valid echo -> retain and independently verify the result

Stage B: direct Q2 rescue
    may be frozen and executed only in a later report checkpoint after Stage A verification
    must retain the already-frozen Q2 return observers and thresholds unchanged
```

The purpose of this ordering is to avoid treating passive storage, hysteresis, or simple future divergence as an attractor.

### Frozen implementation identity and supported environment

Primary current-engine identity:

```text
repository: TomasTriska88/lineum-core
branch: develop
preregistration parent: b940373f8356f9d7b24a53de47b0ab7938ac924c
lineum_core/math.py Git blob: bb877021810691223a0eb960a45493a2e351112a
requirements.txt Git blob: 942f2b94b3d3f8c767451ae2d847a7b17c86d81e
requirements-dev.txt Git blob: 7a0907e3e6c2d15400d19b536227a509910ae7e9
```

Supported scientific runtime must satisfy the repository declaration, in particular NumPy `>= 1.24, < 2.0.0`. The preferred frozen execution target is Python 3.11.x with NumPy 1.26.4, matching the already supported B4 verification environment. Any result produced under NumPy 2.x is diagnostic only and cannot become the official Stage A result.

The primary runner must call the active NumPy Core update rather than silently replacing it with a new memory equation. No production source is modified by this experiment.

### Coordinate convention and hard safety constraint

The current NumPy implementation obtains two `phi` derivatives in array-axis order and forms the directional complex term as:

```text
phi_flow proportional to gradient_axis0(phi) + i * gradient_axis1(phi)
```

Production variable names call those components `x` and `y`, although the ordinary matrix convention associates axis 0 with rows and axis 1 with columns. The PyTorch implementation preserves the same numerical ordering. This is a naming/convention hazard for directional interpretation, not a demonstrated backend disagreement.

For every Stage A lane:

```text
drift_strength = 0
```

Therefore the coordinate-sensitive directional `phi`-gradient contribution is exactly zero. `mu` deposition and decay contain no directional derivative. The Stage A causal conclusion may therefore not depend on assigning physical `x/y` names to the two array axes.

A global 90-degree transform plus label swap remains a required grid-orientation control. A positive result that materially prefers one square-grid axis is classified as grid-confounded rather than causal memory.

### Frozen current-engine parameter family

The Stage A primary deliberately reuses the earlier preregistered deterministic structural-memory settings rather than tuning new values after seeing the B4 Q2 negative:

```text
backend = NumPy CPU
seed = 20260804
grid N = 64
dt = 0.1
stencil = LAP4 periodic four-neighbour
psi_diffusion = 0.05
phi_diffusion = 0.05
reaction_strength = 0.0007
implemented psi dissipation = 0.005
drift_strength = 0
disable_quantum_noise = true
use_mode_coupling = false
phi_diffusion_scales_with_dt = true
use_mu = true
mu_eta = 0.005 during imprint and causal echo
mu_rho = 0.0001 primary
mu_cap = 10 primary
mu_peak_cutoff_ratio = 0.1
psi_amp_cap = 1e6
phi_cap = 1e6
kappa = 1 everywhere
```

The runner must record the active `CoreConfig`, source blob, environment, and exact execution command in its JSON output. A mismatch in any frozen scientific setting is a pre-execution failure.

### Frozen labelled initial-state family

The necessary-history test uses an equal-energy orientation pair because the ordinary centered radial Q2 Gaussian is too symmetric to tell a correctly placed spatial memory from a rotated copy.

On coordinates centered on `(N - 1) / 2`, define two real nonnegative two-lobe amplitudes:

```text
label A: two Gaussians separated horizontally
label B: the exact transpose-equivalent pair separated vertically
G(dx, dy) = exp(-(dx^2 + dy^2) / (2 width^2))
```

Each field is independently normalized to:

```text
sum(abs(psi)^2) = 1
```

Frozen nuisance family:

```text
separations = 10, 12, 14 cells
widths = 2.5, 3.5 cells
integer shifts = (-3,-2), (-2,3), (0,0), (2,-3), (3,2)
30 paired nuisance variants = 60 labelled trajectories
training split: variant_index mod 3 in {0, 1}
held-out split: variant_index mod 3 == 2
both labels from one nuisance tuple remain in the same split
```

Required construction checks before engine evolution:

```text
relative label-energy difference <= 1e-14
unshifted transpose-pair sorted amplitude values agree <= 1e-14
initial phi = 0 exactly
initial mu = 0 exactly
no numerical cap is approached
```

### Frozen phases

**Imprint:** evolve each labelled state for 120 updates (`T = 12`) with normal `mu` accumulation and decay.

**Passive source-off:** set `psi = 0` exactly once, set `mu_eta = 0`, retain `mu_rho = 0.0001`, and evolve to checkpoints `0`, `100`, `500`, `1000`, and `2000` updates (`T_off = 200`). `psi` must remain `<= 1e-15` in absolute magnitude or the passive lane is invalid.

**Common-state causal echo:** after the source-off horizon, replace both labels' current `psi` with the same circular Gaussian

```text
psi_common = exp(-(x^2 + y^2) / (2 * 5^2))
```

normalized to unit total energy. Then evolve 200 updates (`T_echo = 20`) with normal `mu_eta = 0.005` and `mu_rho = 0.0001` restored.

The equality of the two `psi_common` arrays before the first echo update is a hard gate.

### Frozen passive and causal lanes

Passive lanes:

```text
P0: pristine known-answer observer audit before engine evolution
P1: retain both phi and mu through source-off and score them separately
P2: phi-only passive readout
P3: mu-only passive readout
P4: repeat P1 with mu_cap = 100
P5: repeat source-off with mu_rho = 0.01
```

Causal lanes after the identical `psi_common` reset:

```text
C0: erase phi = 0 and mu = 0 before echo
C1: retain both imprinted phi and mu
C2: retain phi, erase mu = 0
C3: retain mu, erase phi = 0
C4: full-history causal control with mu_cap = 100
C5: repeat representative histories after a global 90-degree transformation and label swap
```

No lane may change the source equation, thresholds, or parameters after outcome inspection.

### Frozen observers

For every nonnegative channel `F`, use its weighted centroid and quadrupole:

```text
Q(F) = sum(F * ((x-xc)^2 - (y-yc)^2)) /
       (sum(F * ((x-xc)^2 + (y-yc)^2)) + 1e-30)
```

`Q > 0` predicts A, `Q < 0` predicts B, and `abs(Q) < 1e-6` is unclassified.

An independent pooled-field observer must recenter each field to its nearest integer weighted centroid, normalize by L2 norm, pool into an `8 x 8` feature array, build class centroids from training variants only, and score only held-out variants. It must not call the quadrupole calculation.

For causal echo, record pairwise divergence:

```text
D_X(t) = ||X_A(t) - X_B(t)||_2 /
         (0.5 * (||X_A(t)||_2 + ||X_B(t)||_2) + 1e-30)
```

for `psi`, `phi`, and `mu`. The erased-history C0 lane establishes the numerical floor `D_null`.

### Frozen validity and causal decision gates

All retained lanes require finite `psi`, `phi`, and `mu`, no fail-safe reset, `max(abs(psi)) < 0.1 * psi_amp_cap`, `max(phi) < 0.1 * phi_cap`, and primary `max(mu) < 0.25 * mu_cap`.

C0 must satisfy at its final echo state:

```text
D_psi <= 1e-12
D_phi <= 1e-12
D_mu <= 1e-12
```

P0 observer validity requires both fixed observers on pristine held-out arrays to have balanced accuracy `>= 0.95`, permutation p-value `<= 0.01`, quadrupole transpose antisymmetry error `<= 1e-12`, and class imbalance `<= 0.05`. If P0 fails, no engine-memory conclusion is allowed.

A passive channel is `retained_within_tested_domain` at a checkpoint only when both fixed observers have held-out balanced accuracy `>= 0.90`, both permutation p-values are `<= 0.01`, relative signal amplitude is `>= 1e-6`, low readout-noise accuracy loss is `<= 0.05`, high-noise balanced accuracy remains `>= 0.80`, class imbalance is `<= 0.10`, and numerical validity gates pass.

The causal-echo criterion remains frozen as:

```text
C1 final median D_psi >= max(1e-4, 10 * D_null)
at least one of C2 or C3 final median D_psi >= max(5e-5, 5 * D_null)
zeroing the identified retained channel reduces final median D_psi by >= 50% relative to C1
effect survives cap, timestep, and representative-grid controls
common-state equality passes at echo start
```

For the specific owner-inspired `mu` candidate to open direct Q2 rescue, **C3 must independently satisfy the single-channel causal threshold** and the result must not be cap-sensitive or grid-orientation-sensitive. A C1-only result does not establish `mu` as the guide; it leaves a joint-history explanation open.

### Sensitivity controls

After the primary lane passes numerical validity, representative median nuisance tuples must be repeated with:

```text
dt = 0.05
all update counts doubled to preserve dimensionless horizons
N = 96 with geometrical lengths scaled by 96 / 64
mu_cap = 100
```

Qualitative channel classification must remain unchanged. When both compared causal divergences exceed the numerical floor, the median divergence ratio must remain within `[0.5, 2.0]`. Cap-raised primary and ordinary-cap primary must not differ materially when neither approaches its cap.

### Outcome map and hard stop

```text
C3 mu-only causal echo passes all gates:
    retain result; require independent checker;
    after independent verification, open a new report checkpoint for direct Q2 rescue

mu is passively readable but C3 causal echo fails:
    classify current mu as passive archive without demonstrated causal reuse;
    this is a verified candidate negative and reopens the owner-intuition gate

C1 passes but C3 fails and C2 passes:
    phi-only history is the supported single-channel candidate;
    mu-only guide is unsupported under tested conditions

C1 passes while both C2 and C3 fail:
    joint/distributed history remains a candidate;
    do not attribute the effect to mu alone

all valid causal lanes fail:
    current deterministic phi/mu history reuse is unsupported under tested conditions;
    reopen the owner-intuition gate before selecting a replacement mechanism

cap, grid, null, observer, timestep, resolution, or finite-state gate fails:
    classify the corresponding result as inconclusive/confounded rather than negative
```

No blind parameter sweep follows a negative or inconclusive outcome.

### Direct Question 2 thresholds frozen but not yet executable

A later direct Q2 rescue test may not redefine the already established return observer. Its existing thresholds remain:

```text
finite state required
reset-free required
relative total psi-energy error <= 0.05
psi radial-energy-profile relative L2 error <= 0.10
half-energy-radius error <= 1.0 cell
center displacement <= 0.5 cell
phi radial-profile relative L2 error <= 0.10
no psi or phi cap hits in primary or recovery
phi one-sided stationary criterion unchanged from Q2-PV1-B
```

These conditions define the existing `full_recovery` / admissible-Q2 gate. A Stage A causal echo does **not** satisfy any of them by itself. Stage B remains non-executable until Stage A is retained, independently checked, and the exact Q2 history-imprint intervention is frozen in this same report.

### Independent verification preregistration

If Stage A produces a retained primary, a second checker must be implemented after the primary artifact is durable but before any Stage B mechanism selection. The checker must not import the primary runner or call `lineum_core.math` for the disputed causal calculation. It must independently encode the frozen NumPy equations and independently implement at least the C0 null, C1 full-history, C2 phi-only, and C3 mu-only causal lanes plus the two observer paths.

Frozen cross-implementation comparison rule for ordinary finite diagnostics:

```text
abs_difference <= 1e-8 + 1e-10 * max(1, abs(primary), abs(checker))
```

Categorical lane validity, passive-retention classifications, causal-echo classifications, and the Stage-A outcome map must match exactly. Any disagreement is retained and investigated; it is not averaged away.

Analytic independent checks remain mandatory for the source-off `mu` law when `psi = 0`, `mu_eta = 0`, drift is zero, and no cap is reached:

```text
mu_(n+1) = (1 - mu_rho * dt) * mu_n
mu_n = (1 - mu_rho * dt)^n * mu_0
```

### Real-world physics and empirical boundary

`Q2-M1` is an internal dynamical-systems discriminator. It introduces no mapping from `mu`, `phi`, or `psi` to a measured physical field and uses no external physical dataset. Therefore its real-world evidence status remains:

```text
empirically_connected = false
```

A positive causal echo would establish implemented history dependence within the tested finite-grid model only. It would not establish a new physical memory field, gravity, quantum memory, consciousness, cosmology, or any correspondence in nature. A negative result would falsify only this frozen current-engine history-reuse candidate, not physical memory mechanisms in general.

### Repository and publication boundary

This preregistration changes only the active B4 research record. It does not modify `lineum_core/`, any whitepaper, Q1, Q3, or a public API. Retained executable support may later live only under the research-scoped runner/test paths required by repository rules.

The project owner explicitly authorized GitHub Actions as an emergency Git/checkpoint transport mode for this session because the active environment lacks a usable authenticated local Git publication path. This authorization does not convert Actions output into scientific evidence and does not relax any scientific execution, test, retention, or independent-verification gate.

### Next executable step

After this preregistration is branch-reachable, implement the Stage A research runner and permanent tests without changing production code. The first official Stage A execution may occur only from committed runner/test identities, after the supported-runtime regression gate passes. Its retained output must be plain JSON and must be recorded back into this same B4 report before any Stage B action.
'''

          heading = "## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue"
          if heading in text:
              raise SystemExit("Q2-M1 section already exists")
          text = text.rstrip() + "\n\n" + section.strip() + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq '**Version:** 0.25.0 \' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq '## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only | sort)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit report and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          mapfile -t files < <(git diff --cached --name-only | sort)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = ".github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml"
          test "${files[1]}" = "research/lineum-public-tolog-galactic-shape-b4.md"
          git diff --cached --check
          git commit -m "research: preregister Q2 mu causal reuse"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
