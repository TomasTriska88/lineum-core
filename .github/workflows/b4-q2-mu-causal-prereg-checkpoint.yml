name: B4 Q2 mu causal prereg checkpoint

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen transport base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "340fb36bebb1d1d028769d6a04bee758b2c961d8"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "b9140c49f8130ec3e04af217fc575905a740ec46"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Update authoritative B4 preregistration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")

          old_status = (
              "Question 2 remains negative within the previously tested domain; the owner-intuition gate "
              "has been answered and a coordinate-safe existing-mechanism audit identifies retained `mu` "
              "history as the cheapest next Q2 discriminator, but no new causal-return execution has yet "
              "been performed; Questions 1 and 3 remain unchanged"
          )
          new_status = (
              "Question 2 remains negative within the previously tested domain; the owner-intuition gate "
              "has been answered, the coordinate-safe existing-`mu` audit is complete, and `Q2-M1` now "
              "preregisters a fail-closed causal-reuse gate before any direct Q2 rescue attempt; no new "
              "causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          if text.count(old_status) != 1:
              raise SystemExit("unexpected B4 status identity")
          text = text.replace(old_status, new_status, 1)

          if text.count("**Version:** 0.24.9 \\") != 1:
              raise SystemExit("unexpected B4 version identity")
          text = text.replace("**Version:** 0.24.9 \\", "**Version:** 0.25.0 \\", 1)

          if text.count("**Checkpoint parent:** `f597cba4c9ac88924b2b50aebeb1f8b3a0f9a375` \\") != 1:
              raise SystemExit("unexpected B4 checkpoint-parent identity")
          text = text.replace(
              "**Checkpoint parent:** `f597cba4c9ac88924b2b50aebeb1f8b3a0f9a375` \\",
              "**Checkpoint parent:** `b940373f8356f9d7b24a53de47b0ab7938ac924c` \\",
              1,
          )

          anchor = (
              "Version `0.24.9` records the owner's independent post-negative intuition that the missing "
              "ingredient may be a description, instruction, or guide for returning toward a prior state"
          )
          start = text.find(anchor)
          if start < 0:
              raise SystemExit("0.24.9 authority anchor missing")
          end = text.find("\n\n", start)
          if end < 0:
              raise SystemExit("0.24.9 authority paragraph end missing")

          chronology = (
              "\n\nVersion `0.25.0` freezes `Q2-M1` before any new causal-memory outcome is inspected. "
              "The first report-only transport attempt was committed as "
              "`2658cb35aee767f8e7f7d788f7e99e4d9ebbf3e2` and GitHub Actions run "
              "`31342548699` was rejected before job creation because the workflow definition was invalid "
              "YAML; it produced no scientific execution and no report modification. The retry changes only "
              "the transport syntax. The scientific protocol reuses the previously registered current-engine "
              "structural-memory parameter family, fixes `drift_strength = 0`, and separates a necessary "
              "history-reuse gate from the stronger Question 2 return criterion. A history-dependent echo is "
              "explicitly insufficient to rescue Q2. No production equation, whitepaper, Q1 result, or Q3 "
              "conclusion changes in this preregistration."
          )
          text = text[:end] + chronology + text[end:]

          heading = "## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue"
          if heading in text:
              raise SystemExit("Q2-M1 section already exists")

          section = """## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue

          ### Purpose and staged decision

          The owner independently proposed that return may require a retained description, guide, or instruction. `Q2-M1` tests the cheapest necessary implication using only already implemented state:

          > Can two Lineum systems with exactly the same present `psi` evolve differently because their retained spatial histories differ?

          Stage A tests causal reuse only. If retained history does not create a valid echo, stop and do not run a direct Q2 rescue. If it does, retain the primary and require an independent checker. Stage B may be frozen only after Stage A verification and must reuse the existing Q2 return observer and thresholds unchanged. A causal echo is not itself an attractor or a Q2 success.

          ### Frozen implementation and environment

          Scientific source identity:

          ```text
          repository = TomasTriska88/lineum-core
          branch = develop
          audited scientific parent = b940373f8356f9d7b24a53de47b0ab7938ac924c
          lineum_core/math.py Git blob = bb877021810691223a0eb960a45493a2e351112a
          requirements.txt Git blob = 942f2b94b3d3f8c767451ae2d847a7b17c86d81e
          requirements-dev.txt Git blob = 7a0907e3e6c2d15400d19b536227a509910ae7e9
          ```

          The official run must satisfy repository NumPy `>=1.24,<2.0.0`; the preferred B4 environment is Python 3.11.x with NumPy 1.26.4. NumPy 2.x output is diagnostic only. The primary runner must call the active NumPy Core update; it may not introduce a replacement memory equation or modify production code.

          ### Coordinate-safety gate

          Production obtains `phi` derivatives in array-axis order and uses the first derivative as the real component and the second as the imaginary component of directional flow. Variable names call these components `x/y`, although ordinary matrix convention calls axis 0 rows and axis 1 columns. NumPy and PyTorch preserve the same numerical ordering.

          Every Stage A lane therefore fixes:

          ```text
          drift_strength = 0
          ```

          so the coordinate-sensitive directional `phi`-gradient contribution is exactly zero. `mu` deposition and decay use no directional derivative. A representative global 90-degree transform plus label swap remains mandatory; an axis-preferential result is grid-confounded, not causal memory.

          ### Frozen parameter family

          These values are reused from the earlier preregistered current-engine structural-memory protocol rather than tuned after the B4 Q2 negative:

          ```text
          backend = NumPy CPU
          seed = 20260804
          N = 64
          dt = 0.1
          stencil = periodic LAP4
          psi_diffusion = 0.05
          phi_diffusion = 0.05
          reaction_strength = 0.0007
          implemented psi dissipation = 0.005
          drift_strength = 0
          disable_quantum_noise = true
          use_mode_coupling = false
          phi_diffusion_scales_with_dt = true
          use_mu = true
          mu_eta = 0.005 during imprint and echo
          mu_rho = 0.0001
          mu_cap = 10
          mu_peak_cutoff_ratio = 0.1
          psi_amp_cap = 1e6
          phi_cap = 1e6
          kappa = 1 everywhere
          ```

          ### Frozen labelled states and phases

          Use equal-energy two-lobe labels so correctly placed history can be distinguished from a rotated copy. With centered coordinates and

          ```text
          G(dx,dy) = exp(-(dx^2 + dy^2)/(2 width^2))
          ```

          label A has two horizontally separated Gaussians and label B the transpose-equivalent vertical pair. Normalize each to `sum(abs(psi)^2)=1`.

          Frozen nuisance family:

          ```text
          separations = {10,12,14}
          widths = {2.5,3.5}
          shifts = {(-3,-2),(-2,3),(0,0),(2,-3),(3,2)}
          30 paired variants = 60 trajectories
          train: variant index mod 3 in {0,1}
          held-out: variant index mod 3 = 2
          ```

          Before evolution require relative label-energy difference `<=1e-14`, unshifted transpose-pair sorted amplitudes equal within `1e-14`, exact initial `phi=0` and `mu=0`, and no cap proximity.

          Phases are frozen:

          ```text
          imprint: 120 updates, T=12, normal mu accumulation/decay
          source-off: set psi=0 once, mu_eta=0, checkpoints 0/100/500/1000/2000, T=200
          echo: replace both labels by the exact same normalized circular Gaussian sigma=5,
                restore mu_eta=0.005 and evolve 200 updates, T=20
          ```

          Exact equality of the two `psi_common` arrays before echo is a hard gate. During passive source-off, `max(abs(psi)) <= 1e-15` is required.

          ### Frozen lanes and observers

          Passive lanes are `P0` pristine observer audit, `P1` full passive record, `P2` `phi`-only readout, `P3` `mu`-only readout, `P4` `mu_cap=100`, and `P5` high decay `mu_rho=0.01`.

          Causal lanes after the identical current-state reset are:

          ```text
          C0: erase phi and mu
          C1: retain phi and mu
          C2: retain phi, erase mu
          C3: retain mu, erase phi
          C4: full history with mu_cap=100
          C5: representative 90-degree transform plus label swap
          ```

          The fixed orientation observer is the centroid-corrected quadrupole

          ```text
          Q(F)=sum(F*((x-xc)^2-(y-yc)^2)) /
               (sum(F*((x-xc)^2+(y-yc)^2))+1e-30)
          ```

          with `Q>0` predicting A, `Q<0` B, and `abs(Q)<1e-6` unclassified. An independent pooled-field observer recenters, L2-normalizes, pools to `8x8`, learns class centroids from training variants only, and scores held-out variants only; it must not call the quadrupole function.

          Pairwise causal divergence is

          ```text
          D_X = ||X_A-X_B||_2 /
                (0.5*(||X_A||_2+||X_B||_2)+1e-30)
          ```

          for `psi`, `phi`, and `mu`; C0 defines `D_null`.

          ### Frozen validity and decision thresholds

          Every retained lane requires finite fields, no fail-safe reset, `max(abs(psi)) < 0.1*psi_amp_cap`, `max(phi) < 0.1*phi_cap`, and primary `max(mu) < 0.25*mu_cap`. C0 final `D_psi`, `D_phi`, and `D_mu` must each be `<=1e-12`.

          P0 requires both fixed observers on pristine held-out arrays to reach balanced accuracy `>=0.95`, permutation `p<=0.01`, quadrupole transpose antisymmetry error `<=1e-12`, and class imbalance `<=0.05`.

          A passive channel counts as retained only if both held-out observers reach balanced accuracy `>=0.90`, both permutation values are `p<=0.01`, relative signal amplitude is `>=1e-6`, low-noise accuracy loss is `<=0.05`, high-noise balanced accuracy remains `>=0.80`, class imbalance is `<=0.10`, and numerical gates pass.

          Causal echo remains frozen as:

          ```text
          C1 final median D_psi >= max(1e-4, 10*D_null)
          at least one of C2/C3 final median D_psi >= max(5e-5, 5*D_null)
          zeroing the identified channel reduces final median D_psi by >=50% versus C1
          common-state equality passes
          cap, timestep, resolution, and grid-orientation controls pass
          ```

          To open the owner-inspired `mu` path specifically, C3 itself must satisfy the single-channel threshold and must not be cap- or grid-sensitive. C1 alone cannot identify `mu`.

          Sensitivity confirmation uses `dt=0.05` with doubled step counts, `N=96` with geometry scaled by `96/64`, and `mu_cap=100`. Qualitative classification must be unchanged; where both causal divergences exceed the floor, their median ratio must remain in `[0.5,2.0]`.

          ### Outcome map

          ```text
          C3 passes all gates -> retain primary, require independent checker, no Stage B yet
          passive mu passes but C3 fails -> mu is a passive archive without demonstrated causal reuse
          C1 and C2 pass but C3 fails -> phi-only candidate; mu-only guide unsupported
          C1 passes while C2 and C3 fail -> joint/distributed history remains open
          all valid causal lanes fail -> current deterministic phi/mu reuse unsupported in this domain
          any null/cap/grid/observer/timestep/resolution validity failure -> inconclusive/confounded
          ```

          No blind parameter sweep follows a negative or inconclusive result.

          ### Direct Q2 gate remains unchanged and non-executable

          A later Stage B must preserve the existing admissible-Q2 requirements:

          ```text
          finite and reset-free
          relative total psi-energy error <= 0.05
          psi radial-energy-profile relative L2 error <= 0.10
          half-energy-radius error <= 1.0 cell
          center displacement <= 0.5 cell
          phi radial-profile relative L2 error <= 0.10
          no psi or phi cap hits during primary or recovery
          existing one-sided phi-stationarity rule unchanged
          ```

          Stage A divergence satisfies none of these by itself. Stage B cannot run until Stage A is retained, independently checked, and its exact history-imprint intervention is separately frozen in this report.

          ### Independent verification and evidence boundary

          If Stage A retains a primary, the checker is written afterward but before Stage B. It may not import the primary runner or call `lineum_core.math` for the disputed causal calculation. It must independently encode the frozen NumPy equations, C0-C3, and both observer paths.

          Ordinary finite numeric comparison is frozen as:

          ```text
          abs_difference <= 1e-8 + 1e-10*max(1,abs(primary),abs(checker))
          ```

          categorical validity and causal classifications must match exactly. The source-off analytic check remains

          ```text
          mu_(n+1) = (1-mu_rho*dt)*mu_n
          mu_n = (1-mu_rho*dt)^n*mu_0
          ```

          when `psi=0`, `mu_eta=0`, drift is zero, and no cap is reached.

          `Q2-M1` has no calibrated mapping to a measured physical field and uses no real-world dataset; `empirically_connected=false`. A positive result would establish implemented history dependence in this finite-grid model only, not a physical memory field, gravity, quantum memory, consciousness, or cosmology. A negative result would constrain only this frozen current-engine candidate.

          ### Next executable step

          After this preregistration is branch-reachable, implement a research-scoped Stage A runner and permanent tests without changing `lineum_core/`. The first official Stage A execution may occur only from committed runner/test identities after the supported-runtime regression gate passes. Retain its output as plain JSON and update this same report before any further consequential step.
          """

          import textwrap
          section = textwrap.dedent(section).strip()
          text = text.rstrip() + "\n\n" + section + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq '**Version:** 0.25.0 \' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq '## Q2-M1 — Existing `mu` causal-reuse gate before direct Q2 rescue' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq '31342548699' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit report and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/b4-q2-mu-causal-prereg-checkpoint.yml research/lineum-public-tolog-galactic-shape-b4.md "
          git diff --cached --check
          git commit -m "research: preregister Q2 mu causal reuse"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
