name: FAC1 term-accounting one-use

on:
  push:
    branches: [develop]
    paths:
      - "research/runners/lineum_fac1_term_accounting.py"
      - "tests/research/test_lineum_fac1_term_accounting.py"
      - ".github/workflows/fac1-term-accounting-one-use.yml"

permissions:
  contents: read

jobs:
  fac1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen supported runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest>=8,<9"
      - name: Verify current Core source identity
        run: |
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
      - name: Run FAC1 regression gate
        env:
          PYTHONPATH: .
          LINEUM_DEVICE: numpy
        run: pytest -q tests/research/test_lineum_fac1_term_accounting.py
      - name: Execute frozen FAC1 primary
        env:
          PYTHONPATH: .
          LINEUM_DEVICE: numpy
        run: |
          python research/runners/lineum_fac1_term_accounting.py > /tmp/lineum-fac1.json
          echo "FAC1_JSON_BEGIN"
          cat /tmp/lineum-fac1.json
          echo "FAC1_JSON_END"
          sha256sum /tmp/lineum-fac1.json
