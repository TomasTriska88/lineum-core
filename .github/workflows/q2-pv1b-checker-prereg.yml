name: Q2 PV1-B Checker Preregistration

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-checker-prereg.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .github/scripts/q2_pv1b_checker_report_checkpoint.py)" = "b3f3bd5589ea7a823062356736d17cdab5e1be7b"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "bab3f46f7dffa6f1242bcb27da1c6585fcb379b3"
          test "$(git hash-object research/lineum-public-tolog-b4/artifact-manifest.json)" = "42a645fd8ceead9f615b58dd448acfe8d0f7190c"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-protocol.json)" = "54e381428d49ba8e8aa944f8072fa281bf15d43a"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"

      - name: Apply fail-closed checker preregistration checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/q2_pv1b_checker_report_checkpoint.py
          grep -q '\*\*Version:\*\* 0.24.1' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q '50a26bcfc7ef16af33f192b97eb99690e8a13fea' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q '1e-8 + 1e-12' research/lineum-public-tolog-galactic-shape-b4.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("research/lineum-public-tolog-b4/artifact-manifest.json").read_text())
          chk = data["q2_ledger_neutral_control_checker"]
          assert chk["scientific_status"] == "frozen_before_official_execution"
          assert chk["checker_git_blob"] == "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          assert chk["test_git_blob"] == "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          assert chk["protocol_git_blob"] == "54e381428d49ba8e8aa944f8072fa281bf15d43a"
          assert chk["official_result"] is None
          PY

      - name: Publish checkpoint and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/q2-pv1b-checker-prereg.yml
          rm .github/scripts/q2_pv1b_checker_report_checkpoint.py
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/scripts/q2_pv1b_checker_report_checkpoint.py' '.github/workflows/q2-pv1b-checker-prereg.yml' 'research/lineum-public-tolog-b4/artifact-manifest.json' 'research/lineum-public-tolog-galactic-shape-b4.md' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/q2_pv1b_checker_report_checkpoint.py .github/workflows/q2-pv1b-checker-prereg.yml research/lineum-public-tolog-b4/artifact-manifest.json research/lineum-public-tolog-galactic-shape-b4.md
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: preregister independent Q2 PV1-B checker"
          git push origin HEAD:develop
