name: Lineum Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dco-check:
    name: DCO Check (Warn Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify DCO Signatures
        run: |
          if ! git log -1 --pretty=%B | grep -q "Signed-off-by:"; then
            echo "::warning title=Missing DCO::We currently require a Developer Certificate of Origin (DCO) for external contributions. Please use 'git commit -s' in the future."
          fi

  ai-audit-check:
    name: Mandatory AI Visual UI Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce AI Visual Audit Log
        run: python .github/scripts/enforce_ai_audit.py

  test-core:
    name: Core (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt pytest-asyncio pip-licenses
      - name: Check License Compliance
        run: pip-licenses --fail-on="GPL;AGPL;LGPL" --format=markdown
      - name: Run fast unit tests
        run: pytest -m "not integration" -v

  test-lab:
    name: Lab (Simulacrum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab/package-lock.json
      - name: Install dependencies
        working-directory: lab
        run: npm install
      - name: Run Vitest
        working-directory: lab
        run: npm run test
      - name: Install Playwright Browsers
        working-directory: lab
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        working-directory: lab
        run: npm run test:e2e
