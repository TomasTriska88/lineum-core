name: B4 Localized L1 Primary

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-localized-l1-primary.yml

permissions:
  contents: read

concurrency:
  group: b4-localized-l1-primary-68f9fa1a507d829ab184b303ee13df433ce0b67b
  cancel-in-progress: true

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen execution dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==9.0.2

      - name: Fetch committed standalone report only
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/TomasTriska88/lineum-core/${GITHUB_SHA}/research/lineum-public-tolog-galactic-shape-b4.md" \
            --output lineum-public-tolog-galactic-shape-b4.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          report = Path("lineum-public-tolog-galactic-shape-b4.md")
          data = report.read_bytes()
          Path("b4-l1-source-receipt.json").write_text(
              json.dumps(
                  {
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "report_bytes": len(data),
                      "report_sha256": hashlib.sha256(data).hexdigest(),
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Extract and verify standalone harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import json
          import lzma
          import tarfile

          BASE = 0x3400
          EXPECTED_ARCHIVE_BYTES = 34756
          EXPECTED_ARCHIVE_SHA256 = "171f2862469b19cc0aa003f173fb87d093c1c960c6651bfb493f72a09140f36f"

          def decode_unicode15(payload: str, expected_bytes: int) -> bytes:
              acc = bits = 0
              out = bytearray()
              for char in "".join(payload.split()):
                  value = ord(char) - BASE
                  if not 0 <= value < (1 << 15):
                      raise ValueError(f"Invalid Unicode15 code point: U+{ord(char):04X}")
                  acc = (acc << 15) | value
                  bits += 15
                  while bits >= 8 and len(out) < expected_bytes:
                      bits -= 8
                      out.append((acc >> bits) & 0xFF)
                      acc &= (1 << bits) - 1 if bits else 0
              if len(out) != expected_bytes:
                  raise ValueError(f"Decoded {len(out)} bytes, expected {expected_bytes}")
              return bytes(out)

          capsule = Path("lineum-public-tolog-galactic-shape-b4.md")
          text = capsule.read_text(encoding="utf-8")
          heading = "#### Normalized complete-history archive — XZ plus Unicode15"
          start = text.rindex(heading)
          block = text.index("```text", start) + len("```text")
          end = text.index("```", block)
          compressed = decode_unicode15(text[block:end], EXPECTED_ARCHIVE_BYTES)
          actual_archive_sha = hashlib.sha256(compressed).hexdigest()
          if actual_archive_sha != EXPECTED_ARCHIVE_SHA256:
              raise ValueError(f"Archive SHA mismatch: {actual_archive_sha}")
          archive = lzma.decompress(compressed)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tf:
              tf.extractall("lineum-b4-standalone")
          manifest_path = Path("lineum-b4-standalone/MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for path, expected in manifest["members"].items():
              data = Path("lineum-b4-standalone", path).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise ValueError(f"Member SHA mismatch for {path}: {actual}")
          Path("b4-l1-archive-receipt.json").write_text(
              json.dumps(
                  {
                      "archive_sha256": actual_archive_sha,
                      "archive_bytes": len(compressed),
                      "manifest_members": manifest["members"],
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify frozen harness tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest lineum-b4-standalone/tests/research/test_lineum_b4_saturation_localized_l1.py -q | tee b4-l1-pytest.log

      - name: Execute exactly one primary localized-L1 run
        shell: bash
        run: |
          set -o pipefail
          python lineum-b4-standalone/research/runners/lineum_b4_saturation_localized_l1.py \
            --output b4-l1-primary.json | tee b4-l1-primary-summary.log
          sha256sum b4-l1-primary.json > b4-l1-primary.sha256
          python - <<'PY'
          import json
          import platform
          import sys
          import numpy
          from pathlib import Path
          Path("b4-l1-execution-environment.json").write_text(
              json.dumps(
                  {
                      "python": platform.python_version(),
                      "python_implementation": platform.python_implementation(),
                      "numpy": numpy.__version__,
                      "platform": platform.platform(),
                      "sys_version": sys.version,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload primary evidence only
        uses: actions/upload-artifact@v4
        with:
          name: b4-localized-l1-primary-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            b4-l1-primary.json
            b4-l1-primary.sha256
            b4-l1-primary-summary.log
            b4-l1-pytest.log
            b4-l1-execution-environment.json
            b4-l1-archive-receipt.json
            b4-l1-source-receipt.json
