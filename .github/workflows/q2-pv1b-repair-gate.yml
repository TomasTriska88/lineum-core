name: Q2 PV1-B Frozen Repair Gate

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-repair-gate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "672e4ce7acd5fac365ab1343d9b540610c968e2f"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py)" = "f6b384c895d9022e4619d2e51eeea824d1185d54"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json)" = "716d93ea040b415fda6fd30ff55ba0733bcde9cb"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-test-first.json)" = "0228faedaa26b2e9a69355fcceeef35a963ebbab"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"

      - name: Set up supported runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==9.1.1"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -c "import numpy,pytest; assert numpy.__version__=='1.26.4'; assert pytest.__version__=='9.1.1'; print(numpy.__version__, pytest.__version__)"

      - name: Apply bounded linewise repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-repair
          python - <<'PY'
          from pathlib import Path
          path = Path("research/runners/lineum_b4_q2_ledger_neutral_control_check.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          def one(exact, start=0, end=None):
              stop = len(lines) if end is None else end
              hits = [i for i in range(start, stop) if lines[i] == exact]
              if len(hits) != 1:
                  raise SystemExit(f"boundary mismatch for {exact!r}: {len(hits)}")
              return hits[0]
          ledger_start = one("NUMERIC_LEDGER_FIELDS = (\n")
          categorical_start = one("CATEGORICAL_BRANCH_FIELDS = (\n", ledger_start + 1)
          delta_index = one('    "delta_ledger",\n', ledger_start + 1, categorical_start)
          del lines[delta_index]
          compare_start = one("def compare_case(\n")
          summarize_start = one("def summarize(rows: list[dict[str, Any]]) -> dict[str, Any]:\n", compare_start + 1)
          return_index = one("    return numeric, categorical\n", compare_start, summarize_start)
          residual_lines = [
              "    if c_ledger is not None and p_ledger is not None:\n",
              "        for side, ledger in ((\"checker\", c_ledger), (\"primary\", p_ledger)):\n",
              "            delta, tolerance, within = ledger_residual_values(ledger)\n",
              "            if not within:\n",
              "                residual_failures.append(\n",
              "                    {\n",
              "                        \"case_key\": key,\n",
              "                        \"side\": side,\n",
              "                        \"delta_ledger\": delta,\n",
              "                        \"ledger_tolerance\": tolerance,\n",
              "                    }\n",
              "                )\n",
              "    return numeric, categorical, residual_failures\n",
          ]
          lines[return_index:return_index + 1] = residual_lines
          compare_start = one("def compare_case(\n")
          summarize_start = one("def summarize(rows: list[dict[str, Any]]) -> dict[str, Any]:\n", compare_start + 1)
          init_index = one("    categorical: list[dict[str, Any]] = []\n", compare_start, summarize_start)
          lines.insert(init_index + 1, "    residual_failures: list[dict[str, Any]] = []\n")
          compare_start = one("def compare_case(\n")
          summarize_start = one("def summarize(rows: list[dict[str, Any]]) -> dict[str, Any]:\n", compare_start + 1)
          signature_index = one(") -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:\n", compare_start, summarize_start)
          lines[signature_index:signature_index + 1] = [
              ") -> tuple[\n",
              "    list[dict[str, Any]],\n",
              "    list[dict[str, Any]],\n",
              "    list[dict[str, Any]],\n",
              "]:\n",
          ]
          compare_start = one("def compare_case(\n")
          helper_lines = [
              "def ledger_residual_values(\n",
              "    ledger: dict[str, Any],\n",
              ") -> tuple[float | None, float | None, bool]:\n",
              "    try:\n",
              "        delta = float(ledger[\"delta_ledger\"])\n",
              "        tolerance = float(ledger[\"ledger_tolerance\"])\n",
              "    except (KeyError, TypeError, ValueError):\n",
              "        return None, None, False\n",
              "    within = bool(\n",
              "        math.isfinite(delta)\n",
              "        and math.isfinite(tolerance)\n",
              "        and tolerance >= 0.0\n",
              "        and abs(delta) <= tolerance\n",
              "    )\n",
              "    return delta, tolerance, within\n",
              "\n",
              "\n",
          ]
          lines[compare_start:compare_start] = helper_lines
          run_start = one("def run(primary_path: Path) -> dict[str, Any]:\n")
          main_start = one("def main() -> int:\n", run_start + 1)
          run_cat = one("    categorical: list[dict[str, Any]] = []\n", run_start, main_start)
          lines[run_cat + 1:run_cat + 1] = [
              "    residual_failures: list[dict[str, Any]] = []\n",
              "    residual_diagnostics: list[dict[str, Any]] = []\n",
          ]
          run_start = one("def run(primary_path: Path) -> dict[str, Any]:\n")
          main_start = one("def main() -> int:\n", run_start + 1)
          call_index = one("            n, c = compare_case(checker_map[key], primary_map[key])\n", run_start, main_start)
          lines[call_index] = "            n, c, r = compare_case(checker_map[key], primary_map[key])\n"
          cat_extend = one("            categorical.extend(c)\n", call_index, main_start)
          diagnostic_lines = [
              "            residual_failures.extend(r)\n",
              "            c_ledger = checker_map[key][\"perturbation_ledger\"]\n",
              "            p_ledger = primary_map[key][\"perturbation_ledger\"]\n",
              "            if c_ledger is not None and p_ledger is not None:\n",
              "                c_delta, c_tolerance, c_within = ledger_residual_values(c_ledger)\n",
              "                p_delta, p_tolerance, p_within = ledger_residual_values(p_ledger)\n",
              "                residual_diagnostics.append(\n",
              "                    {\n",
              "                        \"case_key\": key,\n",
              "                        \"checker_delta_ledger\": c_delta,\n",
              "                        \"checker_ledger_tolerance\": c_tolerance,\n",
              "                        \"checker_within_tolerance\": c_within,\n",
              "                        \"primary_delta_ledger\": p_delta,\n",
              "                        \"primary_ledger_tolerance\": p_tolerance,\n",
              "                        \"primary_within_tolerance\": p_within,\n",
              "                    }\n",
              "                )\n",
          ]
          lines[cat_extend + 1:cat_extend + 1] = diagnostic_lines
          run_start = one("def run(primary_path: Path) -> dict[str, Any]:\n")
          main_start = one("def main() -> int:\n", run_start + 1)
          pass_cat = one("        and not categorical\n", run_start, main_start)
          lines.insert(pass_cat + 1, "        and not residual_failures\n")
          run_start = one("def run(primary_path: Path) -> dict[str, Any]:\n")
          main_start = one("def main() -> int:\n", run_start + 1)
          payload_cat = one('        "categorical_mismatches": categorical,\n', run_start, main_start)
          lines[payload_cat + 1:payload_cat + 1] = [
              '        "ledger_residual_failure_count": len(residual_failures),\n',
              '        "ledger_residual_failures": residual_failures,\n',
              '        "ledger_residual_diagnostics": residual_diagnostics,\n',
          ]
          main_start = one("def main() -> int:\n")
          main_cat = one('                "categorical_mismatch_count": payload["categorical_mismatch_count"],\n', main_start)
          lines.insert(main_cat + 1, '                "ledger_residual_failure_count": payload["ledger_residual_failure_count"],\n')
          path.write_text("".join(lines), encoding="utf-8")
          PY
          python -m py_compile research/runners/lineum_b4_q2_ledger_neutral_control_check.py
          git diff -- research/runners/lineum_b4_q2_ledger_neutral_control_check.py > .scratch/q2-pv1b-repair/source.diff
          test -s .scratch/q2-pv1b-repair/source.diff

      - name: Run complete frozen regression gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_json_safe.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py \
            | tee .scratch/q2-pv1b-repair/test-output.txt
          grep -Eq '40 passed' .scratch/q2-pv1b-repair/test-output.txt

      - name: Retain tested repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path
          import numpy
          import pytest
          source = Path("research/runners/lineum_b4_q2_ledger_neutral_control_check.py")
          test_output = Path(".scratch/q2-pv1b-repair/test-output.txt")
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          source_blob = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
          payload = {
              "schema": "lineum-b4-q2-ledger-neutral-control-check-repair-pass/1",
              "stage": "Q2-PV1-B-CHECK-REPAIR",
              "classification": "supported_runtime_regression_pass",
              "scientific_command_invoked": False,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_source_commit": os.environ["GITHUB_SHA"],
              "environment": {"python": platform.python_version(), "numpy": numpy.__version__, "pytest": pytest.__version__, "runner_os": os.environ.get("RUNNER_OS")},
              "source_blob_before": "50a26bcfc7ef16af33f192b97eb99690e8a13fea",
              "source_blob_after": source_blob,
              "source_sha256_after": sha256(source),
              "report_blob_before_repair": "672e4ce7acd5fac365ab1343d9b540610c968e2f",
              "old_checker_test_blob": "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5",
              "residual_repair_test_blob": "f6b384c895d9022e4619d2e51eeea824d1185d54",
              "repair_protocol_blob": "716d93ea040b415fda6fd30ff55ba0733bcde9cb",
              "test_first_receipt_blob": "0228faedaa26b2e9a69355fcceeef35a963ebbab",
              "pytest_passed": 40,
              "pytest_failed": 0,
              "test_output_sha256": sha256(test_output),
              "repair_scope": "Only raw delta_ledger leaves strict cross-implementation equality; each raw residual must independently satisfy its unchanged ledger_tolerance; all other comparisons and scientific rules remain unchanged.",
              "workflow_artifact_uploaded": False,
          }
          Path("research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-pass.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rm .github/workflows/q2-pv1b-repair-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/runners/lineum_b4_q2_ledger_neutral_control_check.py research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-pass.json .github/workflows/q2-pv1b-repair-gate.yml
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git diff --cached --check
          git commit -m "research: apply tested Q2 PV1-B checker residual repair"
          git push origin HEAD:develop
