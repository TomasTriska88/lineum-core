name: Q2 PV1-B Repair Fixture Checkpoint

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-repair-gate.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record fixture defect and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "672e4ce7acd5fac365ab1343d9b540610c968e2f"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py)" = "f6b384c895d9022e4619d2e51eeea824d1185d54"
          python - <<'PY'
          from pathlib import Path
          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          version = "**Version:** 0.24.4  \n"
          if lines.count(version) != 1:
              raise SystemExit("report version marker mismatch")
          lines[lines.index(version)] = "**Version:** 0.24.5  \n"
          marker = "## 9. Preserved failure and publication chronology\n"
          if lines.count(marker) != 1:
              raise SystemExit("section marker mismatch")
          section = [
              "#### 8.23.4 First bounded repair regression run — fixture defect, no retained checker repair\n",
              "\n",
              "A fresh linewise repair gate ran as workflow run `31328245464`, job `93282084068`, from source commit `e0092d2c188ce8a1c7d575d36f5bd3635bb4576c`. All frozen input identities and the supported Python `3.11.15` / NumPy `1.26.4` / pytest `9.1.1` environment passed. The bounded source patch applied successfully in the workflow workspace and Python compilation succeeded. The complete regression gate then returned `2 failed / 38 passed`, so the fail-closed retention step was skipped: no repaired checker source was committed and no 28-case scientific checker command ran.\n",
              "\n",
              "Both failures were confined to the two new residual-repair fixtures. Their helper encoded `ledger_after = 1000 + delta_ledger`, so changing the intentionally free raw cancellation residual also changed `ledger_after`. That contradicts the already-frozen Section 8.23.1 contract, which removes only raw `delta_ledger` from strict cross-implementation equality while keeping `ledger_after`, `ledger_before`, `epsi_before`, `epsi_after`, `ledger_tolerance`, and all other fields strict. The repaired checker therefore correctly reported numeric `ledger_after` mismatches before the fixtures could exercise only the intended residual rule.\n",
              "\n",
              "**Classification:** test-fixture methodological defect, not checker-repair failure and not Q2 evidence. The real first checker attempt had already shown that the disputed cases agree on the underlying ledger fields and differ only in the derived floating cancellation residual. The only permitted fixture correction is therefore to hold the strict underlying ledger fields identical between checker and primary while varying only raw `delta_ledger`; the excessive-residual fixture must likewise keep the strict fields identical and fail solely through the already-frozen residual-tolerance gate. The checker repair semantics, equations, cases, observers, primary data, `COMPARE_ATOL`, `COMPARE_RTOL`, and scientific ledger tolerance remain unchanged. The corrected fixture and the same bounded checker repair must pass all `40 / 40` tests in the supported runtime before either source file is committed.\n",
              "\n",
          ]
          lines[lines.index(marker):lines.index(marker)] = section
          for i, line in enumerate(lines):
              if "`0.24.4` records two subsequent repair-application transport failures" in line:
                  lines[i] = line.rstrip("\n") + " `0.24.5` records the first successfully applied in-workspace checker repair reaching the regression gate, where `38 / 40` passed and the two remaining failures exposed an internally inconsistent residual-test fixture that altered strict `ledger_after`; no repaired checker was committed and no science ran. Only a fixture-only correction preserving all strict ledger fields is authorized before rerunning the same repair gate.\n"
                  break
          else:
              raise SystemExit("version history marker mismatch")
          path.write_text("".join(lines), encoding="utf-8")
          PY
          rm .github/workflows/q2-pv1b-repair-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lineum-public-tolog-galactic-shape-b4.md .github/workflows/q2-pv1b-repair-gate.yml
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: record Q2 PV1-B repair fixture defect"
          git push origin HEAD:develop
