name: Q2 PV1-B Fresh Repaired Checker

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-checker-fresh.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "963fea5d93ae43ff5a59202b4b28177a30c79c38"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "0b9ecc9f56aa943cf37f2c84409446608888b4a6"
          test "$(git hash-object tests/research/test_lineum_b4_saturation_localized_l1.py)" = "e4a4b450e52ad3f8fa15d69dfbdb00505be67dab"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger.py)" = "403c1cb8747cebf3280009b3b2ffcd814c72e060"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control.py)" = "240867abf29db6c248ff9515fa1770482fe8d9ac"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_json_safe.py)" = "c15d0678d05bdb3ee20812709339a2258764fc0c"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py)" = "06ed2da5f7d3173111a1dfab51c4f4766dc2224d"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json)" = "716d93ea040b415fda6fd30ff55ba0733bcde9cb"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-test-first.json)" = "0228faedaa26b2e9a69355fcceeef35a963ebbab"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-pass.json)" = "c850d9a440fdecbb0ca9b7b734273434666cb04f"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"
          test "$(git hash-object requirements.txt)" = "942f2b94b3d3f8c767451ae2d847a7b17c86d81e"
          test "$(git hash-object requirements-dev.txt)" = "7a0907e3e6c2d15400d19b536227a509910ae7e9"

      - name: Set up supported runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install frozen test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==9.1.1"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python - <<'PY'
          import numpy
          from importlib.metadata import version
          assert numpy.__version__ == "1.26.4", numpy.__version__
          assert version("pytest") == "9.1.1", version("pytest")
          print(numpy.__version__, version("pytest"))
          PY

      - name: Run complete branch-reachable regression gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-fresh
          PYTHONPATH=. pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_json_safe.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py \
            | tee .scratch/q2-pv1b-fresh/test-output.txt
          grep -Eq '40 passed' .scratch/q2-pv1b-fresh/test-output.txt

      - name: Run fresh independent 28-case checker once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-fresh
          rm -f research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json
          set +e
          python research/runners/lineum_b4_q2_ledger_neutral_control_check.py \
            --primary research/lineum-public-tolog-b4/q2-ledger-neutral-control.json \
            --output research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json \
            > .scratch/q2-pv1b-fresh/checker-stdout.txt \
            2> .scratch/q2-pv1b-fresh/checker-stderr.txt
          checker_code=$?
          set -e
          printf '%s\n' "$checker_code" > .scratch/q2-pv1b-fresh/checker-exit-code.txt
          cat .scratch/q2-pv1b-fresh/checker-stdout.txt
          if test -s .scratch/q2-pv1b-fresh/checker-stderr.txt; then
            cat .scratch/q2-pv1b-fresh/checker-stderr.txt >&2
          fi
          if test -f research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json; then
            python -m json.tool research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json >/dev/null
          fi

      - name: Retain result, receipt, and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from importlib.metadata import version
          from pathlib import Path
          import numpy

          result_path = Path("research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json")
          receipt_path = Path("research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired-execution.json")
          test_output = Path(".scratch/q2-pv1b-fresh/test-output.txt")
          checker_code = int(Path(".scratch/q2-pv1b-fresh/checker-exit-code.txt").read_text(encoding="utf-8").strip())

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob(path: Path) -> str:
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()

          result = None
          if result_path.is_file():
              result = json.loads(result_path.read_text(encoding="utf-8"))

          if result is None:
              classification = "technical_execution_failure_no_result"
          elif checker_code == 0 and result.get("passed") is True:
              classification = "independent_checker_pass"
          else:
              classification = "independent_checker_retained_nonpass"

          receipt = {
              "schema": "lineum-b4-q2-ledger-neutral-control-check-repaired-execution/1",
              "stage": "Q2-PV1-B-CHECK-REPAIRED",
              "classification": classification,
              "scientific_command_invoked": True,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_source_commit": os.environ["GITHUB_SHA"],
              "environment": {
                  "python": platform.python_version(),
                  "numpy": numpy.__version__,
                  "pytest": version("pytest"),
                  "runner_os": os.environ.get("RUNNER_OS"),
              },
              "frozen_git_blobs": {
                  "report": "963fea5d93ae43ff5a59202b4b28177a30c79c38",
                  "checker": "0b9ecc9f56aa943cf37f2c84409446608888b4a6",
                  "canonical_test": "e4a4b450e52ad3f8fa15d69dfbdb00505be67dab",
                  "pv1_test": "403c1cb8747cebf3280009b3b2ffcd814c72e060",
                  "pv1b_test": "240867abf29db6c248ff9515fa1770482fe8d9ac",
                  "pv1b_json_safe_test": "c15d0678d05bdb3ee20812709339a2258764fc0c",
                  "checker_test": "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5",
                  "residual_repair_test": "06ed2da5f7d3173111a1dfab51c4f4766dc2224d",
                  "repair_protocol": "716d93ea040b415fda6fd30ff55ba0733bcde9cb",
                  "test_first_receipt": "0228faedaa26b2e9a69355fcceeef35a963ebbab",
                  "repair_reconstruction_receipt": "c850d9a440fdecbb0ca9b7b734273434666cb04f",
                  "primary": "50d3f15d881e0665a450982053a9216f9cf5739c"
              },
              "regression_gate": {
                  "pytest_passed": 40,
                  "pytest_failed": 0,
                  "test_output_sha256": sha256(test_output)
              },
              "checker_exit_code": checker_code,
              "result_present": result is not None,
              "result_git_blob": None if result is None else blob(result_path),
              "result_sha256": None if result is None else sha256(result_path),
              "result_summary": None if result is None else {
                  "passed": result.get("passed"),
                  "protocol_pass": result.get("protocol_pass"),
                  "key_set_pass": result.get("key_set_pass"),
                  "numeric_mismatch_count": result.get("numeric_mismatch_count"),
                  "categorical_mismatch_count": result.get("categorical_mismatch_count"),
                  "ledger_residual_failure_count": result.get("ledger_residual_failure_count"),
                  "independent_summary": result.get("independent_summary"),
                  "primary_summary": result.get("primary_summary"),
                  "canonical_payload_sha256_without_self": result.get("canonical_payload_sha256_without_self")
              },
              "workflow_artifact_uploaded": False
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/q2-pv1b-checker-fresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired-execution.json .github/workflows/q2-pv1b-checker-fresh.yml
          if test -f research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json; then
            git add research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json
          fi
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git diff --cached --check
          git commit -m "research: retain fresh Q2 PV1-B independent checker"
          git push origin HEAD:develop
          checker_code="$(cat .scratch/q2-pv1b-fresh/checker-exit-code.txt)"
          exit "$checker_code"
