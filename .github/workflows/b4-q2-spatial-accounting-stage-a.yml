name: B4 Q2 Spatial Accounting Stage A

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/b4-q2-spatial-accounting-stage-a.yml"

permissions:
  contents: read

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify supported environment
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          major = int(np.__version__.split('.', 1)[0])
          print('python', sys.version)
          print('numpy', np.__version__)
          if major >= 2:
              raise SystemExit('NumPy must remain below 2.0 for this retained execution')
          PY

      - name: Run frozen B4 regression and equivalence tests
        run: |
          pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_spatial_accounting.py \
            tests/research/test_lineum_b4_q2_spatial_accounting_stage_a.py

      - name: Execute preregistered Q2-SA1-A
        run: |
          mkdir -p .scratch
          python research/runners/lineum_b4_q2_spatial_accounting_stage_a.py \
            --output .scratch/q2-spatial-accounting-stage-a.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.scratch/q2-spatial-accounting-stage-a.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('stage') != 'Q2-SA1-A':
              raise SystemExit('Unexpected Stage A payload')
          print('B4_STAGE_A_PLAIN_JSON_BEGIN')
          print(path.read_text(encoding='utf-8'), end='')
          print('B4_STAGE_A_PLAIN_JSON_END')
          PY
