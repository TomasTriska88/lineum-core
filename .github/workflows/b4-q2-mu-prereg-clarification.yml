name: B4 Q2 mu prereg clarification

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-mu-prereg-clarification.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1fee3399f78c8ca5064843571c68eb70e2929bbb"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "8a4f343feb94aab8c1350643a6f9a97c0edeedb1"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Add preregistration completeness clarification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")

          if text.count("**Version:** 0.25.0 \\") != 1:
              raise SystemExit("unexpected report version")
          text = text.replace("**Version:** 0.25.0 \\", "**Version:** 0.25.1 \\", 1)

          if text.count("**Checkpoint parent:** `b940373f8356f9d7b24a53de47b0ab7938ac924c` \\") != 1:
              raise SystemExit("unexpected checkpoint parent")
          text = text.replace(
              "**Checkpoint parent:** `b940373f8356f9d7b24a53de47b0ab7938ac924c` \\",
              "**Checkpoint parent:** `1fee3399f78c8ca5064843571c68eb70e2929bbb` \\",
              1,
          )

          status_old = (
              "and `Q2-M1` now preregisters a fail-closed causal-reuse gate before any direct Q2 rescue "
              "attempt; no new causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          status_new = (
              "and `Q2-M1` now preregisters a fail-closed causal-reuse gate before any direct Q2 rescue "
              "attempt; version `0.25.1` completes the observer/noise/cap definitions before runner "
              "implementation; no new causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          if text.count(status_old) != 1:
              raise SystemExit("unexpected status phrase")
          text = text.replace(status_old, status_new, 1)

          heading = "### Q2-M1 preregistration completeness clarification — version `0.25.1`"
          if heading in text:
              raise SystemExit("clarification already present")

          addition = textwrap.dedent(r'''
          ### Q2-M1 preregistration completeness clarification — version `0.25.1`

          This clarification is frozen before any Stage A runner is implemented or any new causal-memory outcome is inspected. It changes no state equation, parameter, label family, horizon, causal threshold, Q2 return threshold, or outcome map. It restores observer details that were already part of the historical structural-memory protocol but were not fully restated in the `0.25.0` Q2-M1 section.

          The deterministic permutation null uses exactly `2000` label permutations with seed `20260804`. For an observed held-out balanced accuracy `a_obs`, the one-sided p-value is:

          ```text
          p = (1 + count(a_null >= a_obs)) / 2001
          ```

          Unclassified samples count as incorrect. An all-zero field has no orientation and is unclassified.

          Readout-noise robustness is observer-only; noise never enters the dynamics. For each scored passive channel, define `R_imprint` as the median RMS amplitude across that channel at the end of imprint. Score exact fields plus two deterministic Gaussian readout copies:

          ```text
          low noise sigma  = 1e-4 * R_imprint
          high noise sigma = 1e-3 * R_imprint
          seed              = 20260804
          ```

          Negative values created in `phi` or `mu` readout copies are clipped to zero only for the orientation observers. The underlying retained state is not clipped or modified by this readout operation.

          Relative passive signal amplitude is frozen as:

          ```text
          S(t) = median(RMS(F(t))) / median(RMS(F_at_end_of_imprint))
          ```

          with the already frozen `S >= 1e-6` retained-record gate.

          Passive cap independence between the primary `mu_cap = 10` lane and `mu_cap = 100` control requires all of:

          ```text
          primary max(mu) < 0.25 * primary mu_cap
          held-out balanced-accuracy difference <= 0.05
          median normalized matched-field difference <= 1e-6
          ```

          where the normalized matched-field comparison is evaluated only when neither lane approaches its cap. For causal C4, the existing sensitivity rule remains unchanged: the qualitative causal classification must match the primary, and where both compared causal divergences exceed the numerical floor their median ratio must lie in `[0.5, 2.0]`.

          No post-result threshold selection is permitted. The next executable step remains implementation and regression testing of the research-scoped Stage A runner only; no official Stage A science may be inspected until that runner and its tests are branch-reachable at frozen identities.
          ''').strip()

          text = text.rstrip() + "\n\n" + addition + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq '**Version:** 0.25.1 \' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq 'exactly `2000` label permutations' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq 'low noise sigma  = 1e-4 * R_imprint' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit clarification and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b4-q2-mu-prereg-clarification.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/b4-q2-mu-prereg-clarification.yml research/lineum-public-tolog-galactic-shape-b4.md "
          git diff --cached --check
          git commit -m "research: complete Q2 mu prereg details"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
