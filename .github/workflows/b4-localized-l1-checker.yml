          report = replace_once(original, "**Status:** active; primary localized-L1 result retained; independent verification pending  ", status_line)
          report = replace_once(report, "**Version:** 0.10.1  ", "**Version:** 0.11.0  ")
          report = replace_once(report, "**Evidence cutoff:** 2026-08-05  ", "**Evidence cutoff:** 2026-08-06  ")
          report = replace_once(report, "**Question 2:** `primary_localized_screen_reproduced_no_full_state_recovery_checker_pending`  ", question_line)
          report = replace_once(report, architecture_old, architecture_new)
          report = replace_once(report, current_answer_old, bounded_answer)
          report = replace_once(report, pending_old, pending_sentence)
          report = replace_once(report, "## Primary localized-L1 result — independent verification pending", primary_heading_new)
          report = replace_once(report, boundary_old, evidence_boundary)
          report = replace_once(report, "\n## Preserved operational failures\n", "\n" + provenance + "\n## Preserved operational failures\n")
          report = replace_once(report, next_old, exact_next)
          report = replace_once(report, environment_old, environment_new + "\n\n" + capsule_heading + "\n\n" + capsule_metadata)
          version_old = (
              "- `0.10.1`: corrected only the primary-capsule heading and fence locators after five fail-closed preflight "
              "revisions; recorded all technical failures; preserved the historical and primary embedded payloads bit-for-bit; "
              "no equation, parameter, threshold, primary result, or scientific interpretation changed."
          )
          version_new = version_old + (
              "\n- `0.11.0`: completed a successful read-only checker-interface preflight, invoked the frozen independent "
              "checker exactly once, retained its exact machine-readable receipt in a third lossless capsule, updated the bounded "
              "Question 2 verdict, and removed the one-use workflow; no equation, physical parameter, primary threshold, or "
              "whitepaper changed."
          )
          report = replace_once(report, version_old, version_new)

          new_history_start = heading_start(report, history_heading)
          new_history_end = report.index("\n" + primary_heading + "\n", new_history_start)
          new_primary_start = heading_start(report, primary_heading)
          new_primary_end = report.index("\n## Environment limitation", new_primary_start)
          if text_blocks(report[new_history_start:new_history_end]) != history_blocks:
              raise AssertionError("historical payload text changed")
          if text_blocks(report[new_primary_start:new_primary_end])[-1] != primary_blocks[-1]:
              raise AssertionError("primary payload text changed")
          checker_start = heading_start(report, capsule_heading)
          checker_end = report.index("\n## Prohibited conclusions", checker_start)
          checker_blocks = text_blocks(report[checker_start:checker_end])
          decoded_checker_xz = decode_unicode15(checker_blocks[-1], len(checker_xz))
          if digest(decoded_checker_xz) != digest(checker_xz):
              raise AssertionError("checker capsule XZ mismatch")
          if digest(lzma.decompress(decoded_checker_xz)) != digest(checker_raw):
              raise AssertionError("checker capsule raw mismatch")

          output = report.encode("utf-8")
          report_blob = api("POST", f"/repos/{REPO}/git/blobs", {
              "content": base64.b64encode(output).decode("ascii"),
              "encoding": "base64",
          })["sha"]
          tree = api("POST", f"/repos/{REPO}/git/trees", {
              "base_tree": base_tree,
              "tree": [
                  {"path": REPORT_PATH, "mode": "100644", "type": "blob", "sha": report_blob},
                  {"path": WORKFLOW_PATH, "mode": "100644", "type": "blob", "sha": None},
              ],
          })["sha"]
          candidate = api("POST", f"/repos/{REPO}/git/commits", {
              "message": "research: verify B4 localized L1 primary result",
              "tree": tree,
              "parents": [HEAD],
          })["sha"]
          comparison = api("GET", f"/repos/{REPO}/compare/{HEAD}...{candidate}")
          changed = {entry["filename"]: entry["status"] for entry in comparison["files"]}
          expected = {REPORT_PATH: "modified", WORKFLOW_PATH: "removed"}
          if changed != expected or comparison["ahead_by"] != 1:
              raise AssertionError((changed, comparison["ahead_by"]))
          if api("GET", f"/repos/{REPO}/git/ref/heads/develop")["object"]["sha"] != HEAD:
              raise AssertionError("develop moved before publication")
          api("PATCH", f"/repos/{REPO}/git/refs/heads/develop", {"sha": candidate, "force": False})
          if api("GET", f"/repos/{REPO}/git/ref/heads/develop")["object"]["sha"] != candidate:
              raise AssertionError("publication failed")
          print(json.dumps({
              "commit": candidate,
              "changed": changed,
              "checker_passed": passed,
              "checker_run_id": RUN_ID,
              "checker_job_id": job_id,
              "checker_json_bytes": len(checker_raw),
              "checker_json_sha256": digest(checker_raw),
              "checker_xz_bytes": len(checker_xz),
              "checker_xz_sha256": digest(checker_xz),
              "numeric_mismatch_count": mismatch_numbers,
              "categorical_mismatch_count": mismatch_categories,
              "maximum_absolute_difference": max_absolute,
              "maximum_relative_difference": max_relative,
              "report_blob": report_blob,
              "report_bytes": len(output),
              "report_sha256": digest(output),
          }, indent=2, sort_keys=True))
          PY
