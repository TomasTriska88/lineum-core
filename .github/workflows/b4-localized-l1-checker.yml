name: B4 Independent Localized L1 Checker

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-localized-l1-checker.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: b4-localized-l1-checker
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5

      - name: Recompute once, retain receipt, and remove workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          import platform
          import subprocess
          import sys
          import tarfile
          import time
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          HEAD = os.environ["GITHUB_SHA"]
          RUN_ID = int(os.environ["GITHUB_RUN_ID"])
          REPORT_PATH = "research/lineum-public-tolog-galactic-shape-b4.md"
          WORKFLOW_PATH = ".github/workflows/b4-localized-l1-checker.yml"
          EXPECTED_REPORT_BLOB = "8f08fe0da08751781e13f90496a928f89eae9d56"
          BASE = 0x3400
          HISTORY_BYTES = 34756
          HISTORY_SHA = "171f2862469b19cc0aa003f173fb87d093c1c960c6651bfb493f72a09140f36f"
          CHECKER_SHA = "3dfe7f6aa9f4da81c523f1c207c08bc0def175f827658d73aaa83e21df035031"
          PRIMARY_XZ_BYTES = 19268
          PRIMARY_XZ_SHA = "bb00b4fcc311e19512f953d33e7d748b6dcd7f56664565157d8e19b2c004ebd5"
          PRIMARY_RAW_BYTES = 228809
          PRIMARY_RAW_SHA = "499dabf444bf442eb9c36927d67a51505166ce422f1e428794aa20def560f11d"

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + TOKEN,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lineum-b4-independent-checker",
                  },
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  body = response.read()
              return json.loads(body) if body else None

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def replace_once(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise AssertionError((old[:140], count))
              return text.replace(old, new, 1)

          def heading_start(text, heading):
              marker = "\n" + heading + "\n"
              position = text.rfind(marker)
              if position < 0:
                  raise ValueError(f"heading line not found: {heading}")
              return position + 1

          def text_blocks(segment):
              lines = segment.splitlines()
              blocks = []
              index = 0
              while index < len(lines):
                  if lines[index] != "```text":
                      index += 1
                      continue
                  block_end = index + 1
                  while block_end < len(lines) and lines[block_end] != "```":
                      block_end += 1
                  if block_end == len(lines):
                      raise ValueError("unterminated text block")
                  blocks.append("\n".join(lines[index + 1:block_end]))
                  index = block_end + 1
              return blocks

          def decode_unicode15(payload, expected_bytes):
              acc = bits = 0
              output = bytearray()
              for char in "".join(payload.split()):
                  value = ord(char) - BASE
                  if not 0 <= value < (1 << 15):
                      raise ValueError(f"invalid Unicode15 code point U+{ord(char):04X}")
                  acc = (acc << 15) | value
                  bits += 15
                  while bits >= 8 and len(output) < expected_bytes:
                      bits -= 8
                      output.append((acc >> bits) & 0xFF)
                      acc &= (1 << bits) - 1 if bits else 0
              if len(output) != expected_bytes:
                  raise ValueError(f"decoded {len(output)} bytes, expected {expected_bytes}")
              return bytes(output)

          def encode_unicode15(data):
              acc = bits = 0
              chars = []
              for byte in data:
                  acc = (acc << 8) | byte
                  bits += 8
                  while bits >= 15:
                      bits -= 15
                      chars.append(chr(BASE + ((acc >> bits) & 0x7FFF)))
                      acc &= (1 << bits) - 1 if bits else 0
              if bits:
                  chars.append(chr(BASE + (acc << (15 - bits))))
              return "".join(chars)

          def wrapped(payload, width=120):
              return "\n".join(payload[index:index + width] for index in range(0, len(payload), width))

          current = api("GET", f"/repos/{REPO}/git/ref/heads/develop")["object"]["sha"]
          if current != HEAD:
              raise AssertionError(("develop moved before execution", current, HEAD))
          commit = api("GET", f"/repos/{REPO}/git/commits/{HEAD}")
          base_tree = commit["tree"]["sha"]
          item = api("GET", f"/repos/{REPO}/contents/{REPORT_PATH}?ref={HEAD}")
          if item["sha"] != EXPECTED_REPORT_BLOB:
              raise AssertionError(("unexpected report blob", item["sha"]))
          original_bytes = base64.b64decode(item["content"])
          original = original_bytes.decode("utf-8")
          if "**Version:** 0.10.1  " not in original:
              raise AssertionError("unexpected report version")

          history_heading = "#### Normalized complete-history archive — XZ plus Unicode15"
          primary_heading = "#### Primary localized-L1 machine-readable result — XZ plus Unicode15"
          history_start = heading_start(original, history_heading)
          history_end = original.index("\n" + primary_heading + "\n", history_start)
          history_blocks = text_blocks(original[history_start:history_end])
          if len(history_blocks) != 1:
              raise AssertionError(("history text blocks", len(history_blocks)))
          history_xz = decode_unicode15(history_blocks[0], HISTORY_BYTES)
          if digest(history_xz) != HISTORY_SHA:
              raise AssertionError("historical archive hash mismatch")
          history_tar = lzma.decompress(history_xz)
          root = Path("/tmp/lineum-b4-standalone")
          root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(history_tar), mode="r:") as archive:
              archive.extractall(root, filter="data")
          manifest = json.loads((root / "MANIFEST.json").read_text(encoding="utf-8"))
          checker_matches = []
          for relative, expected in manifest["members"].items():
              member = root / relative
              actual = digest(member.read_bytes())
              if actual != expected:
                  raise AssertionError((relative, actual, expected))
              if actual == CHECKER_SHA:
                  checker_matches.append(member)
          if len(checker_matches) != 1:
              raise AssertionError(("checker matches", checker_matches))
          checker = checker_matches[0]

          primary_start = heading_start(original, primary_heading)
          primary_end = original.index("\n## Environment limitation", primary_start)
          primary_blocks = text_blocks(original[primary_start:primary_end])
          if len(primary_blocks) != 2:
              raise AssertionError(("primary text blocks", len(primary_blocks)))
          primary_xz = decode_unicode15(primary_blocks[-1], PRIMARY_XZ_BYTES)
          if digest(primary_xz) != PRIMARY_XZ_SHA:
              raise AssertionError("primary XZ hash mismatch")
          primary_raw = lzma.decompress(primary_xz)
          if len(primary_raw) != PRIMARY_RAW_BYTES or digest(primary_raw) != PRIMARY_RAW_SHA:
              raise AssertionError("primary JSON receipt mismatch")
          json.loads(primary_raw)
          primary_file = Path("/tmp/b4-l1-primary.json")
          checker_file = Path("/tmp/b4-l1-checker.json")
          primary_file.write_bytes(primary_raw)

          command = [
              sys.executable,
              str(checker),
              "--result",
              str(primary_file),
              "--output",
              str(checker_file),
          ]
          started = time.monotonic()
          completed = subprocess.run(command, capture_output=True, text=True, check=False)
          elapsed = time.monotonic() - started
          if not checker_file.is_file():
              raise AssertionError({
                  "checker_returncode": completed.returncode,
                  "stdout": completed.stdout[-4000:],
                  "stderr": completed.stderr[-4000:],
              })
          checker_raw = checker_file.read_bytes()
          checker_receipt = json.loads(checker_raw)
          passed = bool(checker_receipt.get("passed"))
          expected_returncode = 0 if passed else 1
          if completed.returncode != expected_returncode:
              raise AssertionError(("checker return code", completed.returncode, expected_returncode))
          checker_xz = lzma.compress(checker_raw, format=lzma.FORMAT_XZ, preset=9 | lzma.PRESET_EXTREME)
          checker_payload = wrapped(encode_unicode15(checker_xz))
          stdout_sha = digest(completed.stdout.encode("utf-8"))
          stderr_sha = digest(completed.stderr.encode("utf-8"))

          jobs = api("GET", f"/repos/{REPO}/actions/runs/{RUN_ID}/jobs?per_page=100").get("jobs", [])
          job_id = next((job["id"] for job in jobs if job.get("name") == "verify"), None)
          mismatch_numbers = int(checker_receipt["numeric_mismatch_count"])
          mismatch_categories = int(checker_receipt["categorical_mismatch_count"])
          max_absolute = checker_receipt["maximum_absolute_difference"]
          max_relative = checker_receipt["maximum_relative_difference"]

          if passed:
              status_line = "**Status:** active; localized-L1 negative independently verified; owner-intuition gate open  "
              question_line = "**Question 2:** `localized_l1_negative_independently_verified_no_full_state_recovery`  "
              bounded_answer = (
                  "Current bounded answer: the galactic target is characterized but blind emergence is not demonstrated; "
                  "the independently reimplemented localized-L1 checker reproduced all 28 retained cases without a numerical "
                  "or categorical mismatch, confirming two cap-dependent partial `psi` recoveries and zero full-state recoveries "
                  "within the frozen domain; scalar-valued auxiliary fields exist but a fixed-potential information-preserving "
                  "scalar state is not demonstrated. The complete affirmative gates and all prior calculations are inside the "
                  "embedded archive."
              )
              pending_sentence = (
                  "The checker independently reimplements the spatial update and observables and does not import the runner. "
                  "Its one official recomputation matched all 28 retained cases within the frozen numerical tolerances. "
                  "Earlier uncommitted executions remain exploratory and non-evidentiary."
              )
              primary_heading_new = "## Primary localized-L1 result — independently verified"
              evidence_boundary = (
                  "This checkpoint reaches `robust_within_tested_domain` for the frozen numerical observation, not "
                  "`mechanistically_supported`. The independent checker matched all 28 cases, but the experiment still does not "
                  "establish a natural attractor, a complete `psi`-`phi` energy cycle, an emergent replacement for `tanh`, a "
                  "uniquely stabilizing LAP8 stencil, a physical interpretation of the cap or denominator, or a terminal "
                  "limitation of the wider Lineum programme."
              )
              exact_next = (
                  "Hard stop at the verified negative-result gate. Present the result to the project owner through one neutral, "
                  "vivid everyday scene and ask one fully open-ended intuition question without answer choices, candidate "
                  "mechanisms, or examples. Perform no mechanism selection, parameter tuning, new simulation, or side research "
                  "until the owner responds."
              )
              independent_title = "## Independent checker result — verified negative within frozen localized-L1 domain"
              interpretation = (
                  "Because an independently written update and metric path reproduced every retained row, the observational "
                  "negative is verified within this exact grid, timestep, horizon, lane set, initial states, thresholds, and "
                  "environment: neighbour transport and the tested LAP4/LAP8 stencils did not yield a cap-free localized "
                  "full-state recovery. This does not yet identify the missing mechanism and does not generalize to Lineum as a "
                  "whole or to real physics."
              )
          else:
              status_line = "**Status:** active; localized-L1 independent checker discrepancy retained; resolution pending  "
              question_line = "**Question 2:** `localized_l1_primary_checker_discrepancy_unresolved`  "
              bounded_answer = (
                  "Current bounded answer: the galactic target is characterized but blind emergence is not demonstrated; "
                  "the retained localized-L1 primary result and independently reimplemented checker disagree under the frozen "
                  "comparison, so Question 2 is unresolved until the first concrete mismatch is explained; scalar-valued "
                  "auxiliary fields exist but a fixed-potential information-preserving scalar state is not demonstrated. The "
                  "complete affirmative gates and all prior calculations are inside the embedded archive."
              )
              pending_sentence = (
                  "The checker independently reimplements the spatial update and observables and does not import the runner. "
                  "Its one official recomputation produced a retained discrepancy, so the primary result is not independently "
                  "verified. Earlier uncommitted executions remain exploratory and non-evidentiary."
              )
              primary_heading_new = "## Primary localized-L1 result — checker discrepancy retained"
              evidence_boundary = (
                  "This checkpoint remains `reproduced` and is now `unresolved` under independent comparison. The checker "
                  "discrepancy must be traced to the first equation, numerical convention, observable, or serialization "
                  "difference before any mechanism interpretation, parameter tuning, or owner-intuition gate."
              )
              exact_next = (
                  "Locate and record the first independent-checker mismatch without rerunning the full scientific recomputation. "
                  "Use the retained primary and checker receipts to identify whether the divergence belongs to an equation, "
                  "numerical convention, metric, or serialization boundary before selecting any mechanism."
              )
              independent_title = "## Independent checker result — discrepancy retained"
              interpretation = (
                  "The independent implementation did not fully reproduce the retained primary rows. This is a methodological "
                  "discrepancy, not evidence for or against a physical mechanism, and the owner-intuition gate remains closed."
              )

          provenance = f"""{independent_title}

### Independent implementation

The frozen checker was selected solely by its committed SHA-256, does not import the primary runner, independently implements the update and observables, and recomputed all 28 cases exactly once from the committed primary JSON.

```text
checker source SHA-256 = {CHECKER_SHA}
primary JSON SHA-256 = {PRIMARY_RAW_SHA}
preflight run / job / artifact = 31052916708 / 92464010929 / 8949110219
checker run / job = {RUN_ID} / {job_id}
command = python <checker> --result <primary-json> --output <checker-json>
checker return code = {completed.returncode}
elapsed seconds = {elapsed:.6f}
Python / NumPy = {checker_receipt['environment']['python']} / {checker_receipt['environment']['numpy']}
platform = {checker_receipt['environment']['platform']}
checker stdout SHA-256 = {stdout_sha}
checker stderr SHA-256 = {stderr_sha}
checker JSON bytes / SHA-256 = {len(checker_raw)} / {digest(checker_raw)}
```

### Recomputed comparison

```json
{{
  "passed": {str(passed).lower()},
  "protocol_pass": {str(bool(checker_receipt['protocol_pass'])).lower()},
  "fidelity_receipt_pass": {str(bool(checker_receipt['fidelity_receipt_pass'])).lower()},
  "key_set_pass": {str(bool(checker_receipt['key_set_pass'])).lower()},
  "numeric_mismatch_count": {mismatch_numbers},
  "categorical_mismatch_count": {mismatch_categories},
  "maximum_absolute_difference": {json.dumps(max_absolute)},
  "maximum_relative_difference": {json.dumps(max_relative)},
  "imports_primary_runner": false,
  "recomputes_all_28_runs": true,
  "separate_update_and_metric_implementation": true
}}
```

### Scope-safe interpretation

{interpretation}
"""

          architecture_old = (
              "This one Markdown file is the complete portable research diary. The readable layer states the current questions, "
              "verdicts, localized-L1 protocol, retained primary result, failure boundary, reproduction procedure, prohibited "
              "conclusions, and exact next action. The embedded normalized XZ+Unicode15 archive contains every historical "
              "paragraph, equation, result, failure, and heading from version `0.9.7`, plus the complete canonical runner, "
              "independent checker, permanent tests, and a cryptographic manifest. A second lossless XZ+Unicode15 capsule embeds "
              "the exact machine-readable primary JSON produced by the official localized-L1 execution."
          )
          architecture_new = (
              "This one Markdown file is the complete portable research diary. The readable layer states the current questions, "
              "verdicts, localized-L1 protocol, retained primary result, independent checker result, failure boundary, "
              "reproduction procedure, prohibited conclusions, and exact next action. The embedded normalized XZ+Unicode15 "
              "archive contains every historical paragraph, equation, result, failure, and heading from version `0.9.7`, plus "
              "the complete canonical runner, independent checker, permanent tests, and a cryptographic manifest. A second "
              "lossless XZ+Unicode15 capsule embeds the exact machine-readable primary JSON, and a third embeds the exact "
              "machine-readable output from the one official independent recomputation."
          )
          current_answer_old = (
              "Current bounded answer: the galactic target is characterized but blind emergence is not demonstrated; the "
              "official primary localized screen reproduced two cap-dependent partial `psi` recoveries and zero full-state "
              "recoveries, with independent verification still pending; scalar-valued auxiliary fields exist but a fixed-"
              "potential information-preserving scalar state is not demonstrated. The complete affirmative gates and all prior "
              "calculations are inside the embedded archive."
          )
          pending_old = (
              "The checker independently reimplements the spatial update and observables and does not import the runner. The "
              "official primary localized-L1 result is retained below, but the independent checker has not yet run. Earlier "
              "uncommitted executions remain exploratory and non-evidentiary."
          )
          boundary_old = (
              "This checkpoint reaches `reproduced`, not `robust_within_tested_domain`. The independent checker has not yet "
              "recomputed the result. The run does not establish a natural attractor, a complete `psi`-`phi` energy cycle, an "
              "emergent replacement for `tanh`, a uniquely stabilizing LAP8 stencil, a physical interpretation of the cap or "
              "denominator, or a terminal limitation of the wider Lineum programme."
          )
          next_old = (
              "Verify the corrected report-only primary-capsule extraction and inspect the frozen checker interface without "
              "executing the scientific recomputation. Then run the checker exactly once against the committed primary JSON and "
              "commit its output before any mechanism selection, parameter tuning, replacement-law proposal, or owner-intuition "
              "gate."
          )
          environment_old = (
              "Earlier retained calculations used Python `3.13.5` and NumPy `2.3.5`. The official localized-L1 primary used "
              "Python `3.13.14` and NumPy `2.3.5`, while the repository declares NumPy below `2.0`. The exact environment is "
              "retained, but the dependency mismatch remains a limitation until a repository-supported rerun is performed; the "
              "independent checker is the immediate next gate."
          )
          environment_new = (
              "Earlier retained calculations used Python `3.13.5` and NumPy `2.3.5`. The official localized-L1 primary and its "
              "independent checker used Python `3.13.14` and NumPy `2.3.5`, while the repository declares NumPy below `2.0`. "
              "The exact environment is retained and the independent comparison is internally controlled, but the dependency "
              "mismatch remains a limitation until a separately preregistered repository-supported environment comparison is "
              "performed."
          )

          capsule_heading = "#### Independent localized-L1 checker receipt — XZ plus Unicode15"
          capsule_metadata = f"""```text
format = lineum-b4-localized-l1-check-v1
source commit = {HEAD}
checker source SHA-256 = {CHECKER_SHA}
primary JSON SHA-256 = {PRIMARY_RAW_SHA}
raw checker JSON bytes = {len(checker_raw)}
raw checker JSON SHA-256 = {digest(checker_raw)}
XZ bytes = {len(checker_xz)}
XZ SHA-256 = {digest(checker_xz)}
encoding = Unicode15 (U+3400..U+B3FF; 15 payload bits per code point)
encoded characters = {len(''.join(checker_payload.split()))}
```

Extraction using only the Python standard library:

```python
from pathlib import Path
import hashlib, json, lzma
BASE = 0x3400
EXPECTED_XZ_BYTES = {len(checker_xz)}
EXPECTED_RAW_BYTES = {len(checker_raw)}
EXPECTED_XZ_SHA256 = "{digest(checker_xz)}"
EXPECTED_RAW_SHA256 = "{digest(checker_raw)}"
