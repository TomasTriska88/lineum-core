name: B4 Correct Primary Capsule Loader

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-localized-l1-checker.yml

permissions:
  contents: write

concurrency:
  group: b4-correct-primary-capsule-loader
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Correct report loader and remove one-use workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          head = os.environ["GITHUB_SHA"]
          report_path = "research/lineum-public-tolog-galactic-shape-b4.md"
          workflow_path = ".github/workflows/b4-localized-l1-checker.yml"
          BASE = 0x3400

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lineum-b4-loader-correction",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  body = response.read()
              return json.loads(body) if body else None

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def replace_once(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise AssertionError((old[:100], count))
              return text.replace(old, new, 1)

          def decode_unicode15(payload, expected_bytes):
              acc = bits = 0
              out = bytearray()
              for char in "".join(payload.split()):
                  value = ord(char) - BASE
                  if not 0 <= value < (1 << 15):
                      raise ValueError("invalid Unicode15 payload")
                  acc = (acc << 15) | value
                  bits += 15
                  while bits >= 8 and len(out) < expected_bytes:
                      bits -= 8
                      out.append((acc >> bits) & 0xFF)
                      acc &= (1 << bits) - 1 if bits else 0
              if len(out) != expected_bytes:
                  raise ValueError("payload length mismatch")
              return bytes(out)

          def text_blocks(segment):
              lines = segment.splitlines()
              blocks = []
              index = 0
              while index < len(lines):
                  if lines[index] != "```text":
                      index += 1
                      continue
                  end = index + 1
                  while end < len(lines) and lines[end] != "```":
                      end += 1
                  if end == len(lines):
                      raise ValueError("unterminated text block")
                  blocks.append("\n".join(lines[index + 1:end]))
                  index = end + 1
              return blocks

          current = api("GET", f"/repos/{repo}/git/ref/heads/develop")["object"]["sha"]
          if current != head:
              raise AssertionError((current, head))
          commit = api("GET", f"/repos/{repo}/git/commits/{head}")
          base_tree = commit["tree"]["sha"]
          item = api("GET", f"/repos/{repo}/contents/{report_path}?ref={head}")
          if item["sha"] != "3b27629dcd9d7dbc4163926ad9af2b67c1a0c719":
              raise AssertionError(item["sha"])
          original_bytes = base64.b64decode(item["content"])
          if len(original_bytes) != 102586 or digest(original_bytes) != "21fb8cb698f3ad29b224e4399973501c0a784c25f5ca552e3246d16554b9f3a7":
              raise AssertionError("unexpected report source")
          original = original_bytes.decode("utf-8")

          history_heading = "#### Normalized complete-history archive — XZ plus Unicode15"
          primary_heading = "#### Primary localized-L1 machine-readable result — XZ plus Unicode15"
          history_start = original.rindex(history_heading)
          history_end = original.index("\n" + primary_heading, history_start)
          history_blocks = text_blocks(original[history_start:history_end])
          if len(history_blocks) != 1:
              raise AssertionError(("history blocks", len(history_blocks)))
          history_xz = decode_unicode15(history_blocks[0], 34756)
          if digest(history_xz) != "171f2862469b19cc0aa003f173fb87d093c1c960c6651bfb493f72a09140f36f":
              raise AssertionError("history archive changed")
          lzma.decompress(history_xz)

          primary_start = original.rindex(primary_heading)
          primary_end = original.index("\n## Environment limitation", primary_start)
          primary_blocks = text_blocks(original[primary_start:primary_end])
          if len(primary_blocks) != 2:
              raise AssertionError(("primary blocks", len(primary_blocks)))
          primary_xz = decode_unicode15(primary_blocks[-1], 19268)
          if digest(primary_xz) != "bb00b4fcc311e19512f953d33e7d748b6dcd7f56664565157d8e19b2c004ebd5":
              raise AssertionError("primary XZ changed")
          primary_raw = lzma.decompress(primary_xz)
          if len(primary_raw) != 228809 or digest(primary_raw) != "499dabf444bf442eb9c36927d67a51505166ce422f1e428794aa20def560f11d":
              raise AssertionError("primary JSON changed")
          json.loads(primary_raw)

          old_loader = "\n".join([
              'start = text.rindex(heading)',
              'first = text.index("```text", start)',
              'block = text.index("```text", first + len("```text")) + len("```text")',
              'end = text.index("```", block)',
              'compressed = decode_unicode15(text[block:end], EXPECTED_XZ_BYTES)',
          ])
          new_loader = "\n".join([
              'start = text.rindex(heading)',
              'section_end = text.index("\\n## Environment limitation", start)',
              'lines = text[start:section_end].splitlines()',
              'blocks = []',
              'index = 0',
              'while index < len(lines):',
              '    if lines[index] != "```text":',
              '        index += 1',
              '        continue',
              '    block_end = index + 1',
              '    while block_end < len(lines) and lines[block_end] != "```":',
              '        block_end += 1',
              '    if block_end == len(lines): raise ValueError("unterminated text block")',
              '    blocks.append("\\n".join(lines[index + 1:block_end]))',
              '    index = block_end + 1',
              'if len(blocks) != 2: raise ValueError(f"expected two text blocks, found {len(blocks)}")',
              'compressed = decode_unicode15(blocks[-1], EXPECTED_XZ_BYTES)',
          ])

          report = replace_once(original, "**Version:** 0.10.0  ", "**Version:** 0.10.1  ")
          report = replace_once(report, old_loader, new_loader)

          failure = "One initial full-repository checkout stalled before archive extraction, harness tests, or scientific execution and is classified solely as a technical non-result. Detailed connector and packaging chronology remains losslessly preserved in the embedded historical archive and Git history, but is not repeated in the active scientific narrative because it produced no admissible scientific evidence."
          failure_note = failure + "\n\nA read-only checker-interface preflight (`31051766659`, job `92460317601`) verified the historical archive and checker-member hashes, then stopped before invoking the checker because the primary-capsule example selected a quoted fence token inside its own code instead of the payload block. The first correction run (`31052012351`, job `92461095095`) stopped before any write because its replacement assumed the wrong Markdown block order. A subsequent workflow revision (`31052264959`) was rejected by YAML validation before any job existed. The next fail-closed run (`31052349446`, job `92462178617`) showed that regex block matching was still ambiguous and stopped before a write. Both embedded payloads and every scientific value remained unchanged; these were technical reproduction defects and produced no scientific result."
          report = replace_once(report, failure, failure_note)

          old_next = "Run the already frozen independent checker exactly once against the committed primary JSON embedded in this report. Commit the checker output and updated report before any mechanism selection, parameter tuning, replacement-law proposal, or owner-intuition gate."
          new_next = "Verify the corrected report-only primary-capsule extraction and inspect the frozen checker interface without executing the scientific recomputation. Then run the checker exactly once against the committed primary JSON and commit its output before any mechanism selection, parameter tuning, replacement-law proposal, or owner-intuition gate."
          report = replace_once(report, old_next, new_next)

          previous_version = "- `0.10.0`: retained the exact official 28-case localized-L1 primary output as a second lossless in-report capsule; recorded provenance, environment, observations, bounded interpretation, and prohibited claims; classified the initial full-checkout attempt as a technical non-result; removed the one-use primary workflow; independent verification remains pending."
          new_version = previous_version + "\n- `0.10.1`: corrected only the primary-capsule Markdown fence locator after four fail-closed preflight revisions; recorded all technical failures; preserved the historical and primary embedded payloads bit-for-bit; no equation, parameter, threshold, primary result, or scientific interpretation changed."
          report = replace_once(report, previous_version, new_version)

          corrected_history_start = report.rindex(history_heading)
          corrected_history_end = report.index("\n" + primary_heading, corrected_history_start)
          corrected_history_blocks = text_blocks(report[corrected_history_start:corrected_history_end])
          corrected_primary_start = report.rindex(primary_heading)
          corrected_primary_end = report.index("\n## Environment limitation", corrected_primary_start)
          corrected_primary_blocks = text_blocks(report[corrected_primary_start:corrected_primary_end])
          if corrected_history_blocks != history_blocks or corrected_primary_blocks[-1] != primary_blocks[-1]:
              raise AssertionError("embedded payload text changed")
          corrected_primary_xz = decode_unicode15(corrected_primary_blocks[-1], 19268)
          corrected_primary_raw = lzma.decompress(corrected_primary_xz)
          if digest(corrected_primary_xz) != digest(primary_xz) or digest(corrected_primary_raw) != digest(primary_raw):
              raise AssertionError("embedded primary data changed")
          if old_loader in report or new_loader not in report:
              raise AssertionError("loader correction missing")

          output = report.encode("utf-8")
          blob = api("POST", f"/repos/{repo}/git/blobs", {
              "content": base64.b64encode(output).decode("ascii"),
              "encoding": "base64",
          })["sha"]
          tree = api("POST", f"/repos/{repo}/git/trees", {
              "base_tree": base_tree,
              "tree": [
                  {"path": report_path, "mode": "100644", "type": "blob", "sha": blob},
                  {"path": workflow_path, "mode": "100644", "type": "blob", "sha": None},
              ],
          })["sha"]
          candidate = api("POST", f"/repos/{repo}/git/commits", {
              "message": "research: correct B4 primary capsule loader",
              "tree": tree,
              "parents": [head],
          })["sha"]
          comparison = api("GET", f"/repos/{repo}/compare/{head}...{candidate}")
          changed = {entry["filename"]: entry["status"] for entry in comparison["files"]}
          expected = {report_path: "modified", workflow_path: "removed"}
          if changed != expected or comparison["ahead_by"] != 1:
              raise AssertionError((changed, comparison["ahead_by"]))
          if api("GET", f"/repos/{repo}/git/ref/heads/develop")["object"]["sha"] != head:
              raise AssertionError("develop moved")
          api("PATCH", f"/repos/{repo}/git/refs/heads/develop", {"sha": candidate, "force": False})
          if api("GET", f"/repos/{repo}/git/ref/heads/develop")["object"]["sha"] != candidate:
              raise AssertionError("publication failed")
          print(json.dumps({
              "commit": candidate,
              "report_blob": blob,
              "report_bytes": len(output),
              "report_sha256": digest(output),
              "changed": changed,
          }, indent=2, sort_keys=True))
          PY
