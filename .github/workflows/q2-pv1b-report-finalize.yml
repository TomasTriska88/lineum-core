          result Git blob = 07d46581f8cd9973ed82c40bbfea6af372a31dd5
          result SHA-256 = d84f4baf652da10eca457d6e144f15679072c789b8973673c534fc48db6dd21f
          canonical payload SHA-256 = 197937fdf1a5d9100349f8197b038f8c5282f4d13cc912bf365e32b736234fa7

          execution receipt path = research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired-execution.json
          execution receipt Git blob = e7cddd8010b1543cc3101c59220c4dd2de5d240f
