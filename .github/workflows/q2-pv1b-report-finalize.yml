          old_q2_tail = """The preregistered `Q2-PV1-B` ledger-neutral control now has a retained supported-runtime primary: `26 / 28` controls were available and ledger-neutral, two reset-degenerate rows were unavailable, and the balanced control produced `0 / 26` Q2 rescues and `0 / 26` classification changes. That last control remains `primary_pending_independent_check`."""
          new_q2_tail = """The preregistered `Q2-PV1-B` ledger-neutral control is now independently reproduced: `26 / 28` controls were available and ledger-neutral, two reset-degenerate rows were unavailable, and the balanced control produced `0 / 26` Q2 rescues and `0 / 26` classification changes. The fresh checker passed after the frozen `40 / 40` gate with zero ordinary numeric, categorical, or ledger-residual failures, so this no-rescue result is `robust_within_tested_domain` for the exact frozen control domain."""
