              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          if result.get("passed") is not True:
              raise RuntimeError("fresh checker result is not passing")
          if result.get("protocol_pass") is not True or result.get("key_set_pass") is not True:
              raise RuntimeError("fresh checker protocol/key-set gate is not passing")
