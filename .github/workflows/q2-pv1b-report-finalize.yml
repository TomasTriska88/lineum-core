          new_section10_pv1b = """The independently reproduced Stage A result establishes only that, under the frozen Stage A implementation/accounting definitions, observed positive `psi` gain is dominated by unpaired gain rather than reciprocal incoming neighbour transport and does not produce full-state return. Independently reproduced `Q2-PV1-A` establishes only that the canonical radial perturbation is not universally neutral under the declared implementation ledger. Independently reproduced `Q2-PV1-B` establishes only that, in this exact frozen 28-case screen, 26 mathematically available balanced perturbations were ledger-neutral and none rescued or changed a Q2 classification; the two degenerate rows were unavailable. It supports the bounded conclusion that correcting this perturbation-ledger imbalance does not explain the Q2 failure in the eligible tested domain. It does not establish the missing mechanism, a universal Q2 impossibility, or a physical interpretation of the ledger."""
