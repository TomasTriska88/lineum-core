          old_hyp = """4. **Hypothesis only:** a genuinely reciprocal existing-state repair, a phase/conjugate extension, a different equation family, an additional state, or another mechanism not represented in the tested lanes might alter Q2. None is selected while the PV1-B checker remains technically unresolved."""
          new_hyp = """4. **Hypothesis only:** replacement mechanisms not represented in the tested lanes might alter Q2. The passing PV1-B checker closes the perturbation-control validity chain but does not select, rank, or validate any replacement mechanism. Mechanism selection remains blocked until the project owner responds at the mandatory intuition gate."""
          report = replace_once(report, old_hyp, new_hyp, "section7 hypothesis")

          old_next_table = """| Next consequential step | rerun the complete `40 / 40` supported regression gate on the exact branch-reachable repaired checker/test blobs and, only if green, execute one fresh independent 28-case PV1-B checker from the beginning; retain any result before selecting a replacement mechanism |"""
          new_next_table = """| Next consequential step | mandatory owner-intuition gate opened by the independently verified PV1-B negative; no replacement mechanism is selected, ranked, tuned, or executed before the owner's response |"""
          report = replace_once(report, old_next_table, new_next_table, "section7 table next")

          new_subsection = r"""### 8.23.7 Fresh repaired independent checker — verified bounded negative

          The fresh repaired checker executed only after the exact branch-reachable repaired identities from Section 8.23.6 were frozen. It used the repository-supported runtime and reran the complete six-file regression gate before invoking the 28-case checker once from the beginning.

          ```text
          workflow source commit = 5427a73ffb7741a98895a3d9ac5cc39314a2be8f
          workflow run / job = 31332207459 / 93292140542
          retention commit = 650bc9ba2fbe3049fce21cfb82dd0faf1cc4067c
          Python = 3.11.15
