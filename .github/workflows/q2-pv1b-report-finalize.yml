          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"

      - name: Apply documentation-only finalization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-report-finalize
          cat > .scratch/q2-pv1b-report-finalize/finalize.py <<'PY'
