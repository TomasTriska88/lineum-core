          old_item50 = """50. commit `79862f0651494f5c7090b078651cad34e40c0f31` made the deterministic repaired checker blob `0b9ecc9f56aa943cf37f2c84409446608888b4a6`, corrected residual fixture blob `06ed2da5f7d3173111a1dfab51c4f4766dc2224d`, and plain reconstruction receipt blob `c850d9a440fdecbb0ca9b7b734273434666cb04f` branch-reachable while removing the failed repair workflow; the exact branch files have not yet run the fresh supported-runtime gate or 28-case checker."""
          new_item50 = """50. commit `79862f0651494f5c7090b078651cad34e40c0f31` made the deterministic repaired checker blob `0b9ecc9f56aa943cf37f2c84409446608888b4a6`, corrected residual fixture blob `06ed2da5f7d3173111a1dfab51c4f4766dc2224d`, and plain reconstruction receipt blob `c850d9a440fdecbb0ca9b7b734273434666cb04f` branch-reachable while removing the failed repair workflow;
