name: Q2 PV1-B Report Finalization

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-report-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen documentation and evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object AGENTS.md)" = "5b32770a5a9368b9fbef0e4a6d36f7336fb05f60"
          test "$(git hash-object .agent/rules.md)" = "cb1bb75d1266eb403bf522086b9286113e88bc13"
          test "$(git hash-object .agent/rules.d/48-clickup-task-source.md)" = "d8fe49ac68d1f0875fed0416ff1457c5fa9d663c"
          test "$(git hash-object .agent/rules.d/48-third-party-model-and-research-intake.md)" = "1ba0cc1df10ba993c7fdf16ab900602a612e29cf"
          test "$(git hash-object .agent/rules.d/49-github-branch-safety.md)" = "9162ab155aa2134c685c95be9db9d974b5fcb2d5"
          test "$(git hash-object .agent/rules.d/50-codex-ultra-scientific-governance.md)" = "72671e66fe717d8ce4a070f3289089f83426b22e"
          test "$(git hash-object .agent/rules.d/51-clickup-cross-repository-routing.md)" = "00221490bebd9d52e0bfaac72740e57cd70a0ca3"
          test "$(git hash-object .agent/rules.d/52-owner-intuition-independence.md)" = "c794fc7bb5d6629b7d71c00e15817ad6c78ca62c"
          test "$(git hash-object .agent/rules.d/53-local-scientific-execution.md)" = "8ac00da9b259ac17d9916caa7f7310f54c30bdfb"
          test "$(git hash-object .agent/rules.d/54-single-report-readable-artifacts.md)" = "ea6478c22fc564cbcece03e5e8798bb1f3c349a5"
          test "$(git hash-object .agent/rules.d/55-formal-proof-assistant-verification.md)" = "f95a4352654a61d03f6ea39396d00bcdae9e5dc0"
          test "$(git hash-object .clinerules)" = "a192f3bc01d4c218ac440f399e1274788c9ecbc9"
          test "$(git hash-object .cursorrules)" = "a192f3bc01d4c218ac440f399e1274788c9ecbc9"
          test "$(git hash-object .windsurfrules)" = "a192f3bc01d4c218ac440f399e1274788c9ecbc9"
          test "$(git hash-object docs/repository-boundaries.md)" = "05b805c16c68b52c8618c564f9155e9cef913254"
          test "$(git hash-object docs/LINEUM_CODEX_v1.md)" = "b3dd4f12dfc82c53a3837f0b9232565e128a4688"
          test "$(git hash-object .agent/workflows/model-tool-routing.md)" = "892e9a90f61c336de1bba6083955eb6e182482a6"
          test "$(git hash-object .agent/continuous-research-reporting.md)" = "54c0f02068d30900291ac605aa9b29becffa6ae1"
          test "$(git hash-object .agent/workflows/scratch.md)" = "b4762c7ef6f63e29b9598dd18f78d9810f432d33"
          test ! -e research/AGENTS.md
          test ! -e research/lineum-public-tolog-b4/AGENTS.md
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "963fea5d93ae43ff5a59202b4b28177a30c79c38"
          test "$(git hash-object research/lineum-public-tolog-b4/artifact-manifest.json)" = "df2bf49528fb2db8cfad1ddadca0defdcc8539a5"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repaired.json)" = "07d46581f8cd9973ed82c40bbfea6af372a31dd5"
