          Every conclusion below separates implementation facts, reproduced observations, cautious interpretation, hypotheses, and real-physics claims. Internal numerical agreement is not evidence that nature uses the same ontology."""
          report = replace_once(report, continuity_anchor, continuity_new, "continuity")

          old_primary_only = """The preregistered ledger-neutral radial control has now been executed as `Q2-PV1-B`. A real control factor existed for `26 / 28` frozen states; the two `no_interaction_denominator, phi0=1` rows had `E_inner = E_annulus = 0` after prior resets and therefore remained explicitly `control_unavailable`. Every available balanced perturbation satisfied the frozen ledger-neutrality tolerance, with annular factors from approximately `0.821196` to `0.978049`. Under the unchanged recovery and cap/reset exclusions, the canonical branch had `0` Q2-positive cases and the balanced branch also had `0`; no classification changed and no case was rescued. This is a retained supported-runtime **primary** result only. A separately implemented checker must reproduce it before the perturbation-confound is considered closed and before any reciprocal or phase/interference replacement candidate is selected."""
          new_primary_only = """The preregistered ledger-neutral radial control has now been executed and independently reproduced as `Q2-PV1-B`. A real control factor existed for `26 / 28` frozen states; the two `no_interaction_denominator, phi0=1` rows had `E_inner = E_annulus = 0` after prior resets and therefore remained explicitly `control_unavailable`. Every available balanced perturbation satisfied the frozen ledger-neutrality tolerance, with annular factors from approximately `0.821196` to `0.978049`. Under the unchanged recovery and cap/reset exclusions, the canonical branch had `0` Q2-positive cases and the balanced branch also had `0`; no classification changed and no case was rescued. The fresh separately implemented checker passed the exact branch-reachable `40 / 40` regression gate and independently reproduced the complete 28-case decision surface with zero ordinary numeric mismatches, zero categorical mismatches, and zero ledger-residual failures. The bounded conclusion that the canonical perturbation-ledger mismatch does not explain the Q2 failure in the 26 eligible balanced-control cases is therefore `robust_within_tested_domain`. This does not make Q2 positive or select a replacement mechanism."""
