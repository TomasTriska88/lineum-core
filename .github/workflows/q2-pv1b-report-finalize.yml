          canonical_q2_positive_count = 0
          balanced_q2_positive_count = 0
          balanced_rescue_count = 0
          q2_classification_changed_count = 0
          outcome = ledger_neutral_control_does_not_rescue_q2_classification
          ```

          The two raw `delta_ledger` values that motivated the repair remain retained diagnostically rather than being erased or averaged away. The repaired comparison does not require those cancellation residuals to be bitwise or generically numerically equal across operation orderings. Instead, each implementation must independently satisfy its own unchanged frozen `ledger_tolerance`, while the neutrality category must agree exactly. Every other frozen ordinary numeric field still uses `COMPARE_ATOL = 1e-8` and `COMPARE_RTOL = 1e-12`; all other categories, summaries, cases, factors, equations, observers, and recovery thresholds remain unchanged. The fresh checker reports zero residual-tolerance failures.

          **Implementation fact:** no production or research equation, balanced-factor formula, case set, observer, scientific threshold, Q1 surface, Q3 state, or whitepaper changed in order to obtain this result.

          **Reproduced observation:** the independently implemented fresh checker reproduces the primary 28-case decision surface after a clean `40 / 40` supported-runtime regression gate. In the 26 mathematically available balanced controls, making the radial perturbation neutral under the declared implementation ledger rescues zero cases and changes zero Q2 classifications; the same two reset-degenerate cases remain explicitly unavailable.

