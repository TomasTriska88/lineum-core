name: Q2 PV1-B Independent Checker

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-checker.yml"

permissions:
  contents: write

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "d02a860cb1fde5ac39ce03aa2168a4b6896b13e0"
          test "$(git hash-object research/lineum-public-tolog-b4/artifact-manifest.json)" = "0bbd687f2bd00cea57cd7bdab138bcb19f464309"
          test "$(git hash-object research/runners/lineum_b4_saturation_localized_l1.py)" = "1598faf0f39e056c1684f767c2554edc63283ca4"
          test "$(git hash-object tests/research/test_lineum_b4_saturation_localized_l1.py)" = "e4a4b450e52ad3f8fa15d69dfbdb00505be67dab"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger.py)" = "e3657119b855965b4fd622b3e94f08443a7c9107"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger.py)" = "403c1cb8747cebf3280009b3b2ffcd814c72e060"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control.py)" = "cffa0cc87a070d6915606ab064ec3eee2d89a061"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control.py)" = "240867abf29db6c248ff9515fa1770482fe8d9ac"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_json_safe.py)" = "165db68a201fbd8db0e8b998b6c085d83dd54c0f"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_json_safe.py)" = "c15d0678d05bdb3ee20812709339a2258764fc0c"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-protocol.json)" = "54e381428d49ba8e8aa944f8072fa281bf15d43a"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install repository dependencies and freeze runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==9.1.1"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python - <<'PY'
          import numpy, pytest
          assert numpy.__version__ == "1.26.4"
          assert pytest.__version__ == "9.1.1"
          print("numpy", numpy.__version__)
          print("pytest", pytest.__version__)
          PY

      - name: Run complete frozen pre-checker test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-check
          set +e
          PYTHONPATH=. pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_json_safe.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py \
            | tee .scratch/q2-pv1b-check/test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > .scratch/q2-pv1b-check/test-exit.txt
          exit 0

      - name: Execute frozen independent checker when test gate passes
        shell: bash
        run: |
          set -euo pipefail
          test_status="$(cat .scratch/q2-pv1b-check/test-exit.txt)"
          if [ "$test_status" -ne 0 ]; then
            printf '%s\n' "not_run" > .scratch/q2-pv1b-check/checker-exit.txt
            exit 0
          fi
          set +e
          PYTHONPATH=. python research/runners/lineum_b4_q2_ledger_neutral_control_check.py \
            --primary research/lineum-public-tolog-b4/q2-ledger-neutral-control.json \
            --output .scratch/q2-pv1b-check/checker.json \
            | tee .scratch/q2-pv1b-check/checker-stdout.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > .scratch/q2-pv1b-check/checker-exit.txt
          test -f .scratch/q2-pv1b-check/checker.json

      - name: Retain checker outcome and clean one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          test_status="$(cat .scratch/q2-pv1b-check/test-exit.txt)"
          checker_status="$(cat .scratch/q2-pv1b-check/checker-exit.txt)"
          result_path="research/lineum-public-tolog-b4/q2-ledger-neutral-control-check.json"
          receipt_path="research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-execution.json"
          attempt_path="research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-attempt-1.json"

          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          payload = {
              "schema": "lineum-b4-q2-ledger-neutral-control-check-attempt/1",
              "stage": "Q2-PV1-B-CHECK",
              "classification": "technical_pre_execution_test_failure",
              "scientific_command_invoked": False,
              "retained_scientific_result": False,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_source_commit": os.environ["GITHUB_SHA"],
              "test_exit_code": int(Path(".scratch/q2-pv1b-check/test-exit.txt").read_text().strip()),
              "test_output_sha256": sha256(".scratch/q2-pv1b-check/test-output.txt"),
              "scientific_interpretation": "none",
              "workflow_artifact_uploaded": False,
          }
          Path("research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-attempt-1.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          else
            cp .scratch/q2-pv1b-check/checker.json "$result_path"
            python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          import numpy
          import pytest

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          result_path = "research/lineum-public-tolog-b4/q2-ledger-neutral-control-check.json"
          data = json.loads(Path(result_path).read_text(encoding="utf-8"))
          payload = {
              "schema": "lineum-b4-q2-ledger-neutral-control-check-execution/1",
              "stage": "Q2-PV1-B-CHECK",
              "status": "supported_runtime_checker_completed",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_source_commit": os.environ["GITHUB_SHA"],
              "checker_exit_code": int(Path(".scratch/q2-pv1b-check/checker-exit.txt").read_text().strip()),
              "environment": {
                  "python": platform.python_version(),
                  "numpy": numpy.__version__,
                  "pytest": pytest.__version__,
                  "runner_os": os.environ.get("RUNNER_OS"),
              },
              "source_blobs": {
                  "report": "d02a860cb1fde5ac39ce03aa2168a4b6896b13e0",
                  "manifest": "0bbd687f2bd00cea57cd7bdab138bcb19f464309",
                  "canonical_runner": "1598faf0f39e056c1684f767c2554edc63283ca4",
                  "pv1b_primary": "50d3f15d881e0665a450982053a9216f9cf5739c",
                  "checker": "50a26bcfc7ef16af33f192b97eb99690e8a13fea",
                  "checker_test": "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5",
                  "checker_protocol": "54e381428d49ba8e8aa944f8072fa281bf15d43a",
              },
              "result_sha256": sha256(result_path),
              "test_output_sha256": sha256(".scratch/q2-pv1b-check/test-output.txt"),
              "checker_stdout_sha256": sha256(".scratch/q2-pv1b-check/checker-stdout.txt"),
              "passed": data["passed"],
              "protocol_pass": data["protocol_pass"],
              "key_set_pass": data["key_set_pass"],
              "numeric_mismatch_count": data["numeric_mismatch_count"],
              "categorical_mismatch_count": data["categorical_mismatch_count"],
              "independent_summary": data["independent_summary"],
              "workflow_artifact_uploaded": False,
          }
          Path("research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-execution.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          fi

          rm .github/workflows/q2-pv1b-checker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/q2-pv1b-checker.yml
          if [ "$test_status" -ne 0 ]; then
            git add "$attempt_path"
          else
            git add "$result_path" "$receipt_path"
          fi
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: retain Q2 PV1-B independent checker and cleanup"
          git push origin HEAD:develop

      - name: Fail workflow after durable retention when verification did not pass
        shell: bash
        run: |
          set -euo pipefail
          test_status="$(cat .scratch/q2-pv1b-check/test-exit.txt)"
          checker_status="$(cat .scratch/q2-pv1b-check/checker-exit.txt)"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if [ "$checker_status" = "not_run" ]; then
            exit 1
          fi
          exit "$checker_status"
