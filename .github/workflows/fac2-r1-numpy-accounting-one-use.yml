name: FAC2-R1 NumPy accounting one-use

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/fac2-r1-numpy-accounting-one-use.yml"

permissions:
  contents: read

jobs:
  fac2-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository-supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt "numpy==1.26.4" "pytest==8.4.2"

      - name: Verify frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lineum_core/math.py)" = "bb877021810691223a0eb960a45493a2e351112a"
          test "$(git hash-object research/runners/lineum_fac2_numpy_componentwise_accounting.py)" = "9f8e107a1ca80fe2089bca220b5feeec45307368"
          test "$(git hash-object tests/research/test_lineum_fac2_numpy_componentwise_accounting.py)" = "bea7a86d7c80f75ec87843ad0821cf53c5408cca"
          test "$(git hash-object research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md)" = "982eb983ce2341ee13931720eacecd7dcf680ab1"
          grep -Fq "## 31. FAC2-R1 current-NumPy componentwise software-accounting preregistration" research/foundations/lineum-ancient-texts-dynamic-boundary-protocol-and-reconstruction-hypotheses.md
          python - <<'PY'
          import platform
          import numpy as np
          import pytest
          assert platform.python_version().startswith("3.11.")
          assert np.__version__ == "1.26.4"
          assert pytest.__version__ == "8.4.2"
          print(f"Python={platform.python_version()} NumPy={np.__version__} pytest={pytest.__version__}")
          PY

      - name: Compile frozen FAC2-R1 sources
        run: |
          python -m py_compile research/runners/lineum_fac2_numpy_componentwise_accounting.py tests/research/test_lineum_fac2_numpy_componentwise_accounting.py

      - name: Run frozen FAC2-R1 regression gate
        env:
          PYTHONPATH: .
          LINEUM_DEVICE: numpy
        run: python -m pytest -q tests/research/test_lineum_fac2_numpy_componentwise_accounting.py

      - name: Execute frozen FAC2-R1 primary
        env:
          PYTHONPATH: .
          LINEUM_DEVICE: numpy
        shell: bash
        run: |
          set -euo pipefail
          python research/runners/lineum_fac2_numpy_componentwise_accounting.py > /tmp/fac2-r1.json
          echo "FAC2_R1_JSON_BEGIN"
          cat /tmp/fac2-r1.json
          echo "FAC2_R1_JSON_END"
          sha256sum /tmp/fac2-r1.json
