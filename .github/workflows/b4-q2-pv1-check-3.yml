name: B4 Q2 PV1 Repaired Checker Attempt 3

'on':
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-pv1-check-3.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Commit pre-execution report checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "a6efe160a9a4ebf1c60ef0af983ecd89445cdd1d"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check-attempt-2.json)" = "7b4cfffe072a554c9ffed4f02bb1ee29fcacbefc"
          export CHECKPOINT_PARENT="$(git rev-parse HEAD)"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")
          if "**Version:** 0.22.1  " not in text:
              raise SystemExit("expected report version 0.22.1 not found")

          status_old = next(line for line in text.splitlines() if line.startswith("**Status:**"))
          status_new = status_old + "; repaired-checker attempt 2 was stopped before tests by incorrectly transcribed workflow Git-blob constants; attempt 3 is frozen to change only those two execution identity constants"
          text = text.replace(status_old, status_new, 1)
          text = text.replace("**Version:** 0.22.1  ", "**Version:** 0.22.2  ", 1)
          text, n = re.subn(
              r"\*\*Checkpoint parent:\*\* `[0-9a-f]{40}`",
              f"**Checkpoint parent:** `{os.environ['CHECKPOINT_PARENT']}`",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("checkpoint parent replacement failed")

          history_anchor = "Version `0.22.1` records the first independent retained-statistics checker attempt as a technical comparison-method failure, preserves its exact eight residual mismatches and otherwise matching 28-case categories and aggregate summary, records the connector publication defects for the checker source/test, and freezes a narrow test-first repair before any second checker execution."
          history_add = " Version `0.22.2` records repaired-checker attempt 2 as a pre-execution source-identity failure: the supported environment and report checks passed, but two workflow constants were not the actual branch-reachable Git blob identities of the repaired checker and its test, so neither the test gate nor checker executed; the only permitted attempt-3 correction is those two workflow identity constants."
          if history_anchor not in text:
              raise SystemExit("version-history anchor not found")
          text = text.replace(history_anchor, history_anchor + history_add, 1)

          gate_anchor = "A second repaired checker is required before the already-preregistered ledger-neutral radial control may execute."
          gate_add = "\n\nRepaired-checker attempt 2 (workflow run `31190134541`, job `92904557629`, source commit `7f1557d9c5534c010a2aeb1a2bde983f5a317969`) was stopped by the fail-closed frozen-input check before tests or checker execution. Python `3.11.15`, NumPy `1.26.4`, pytest `9.1.1`, report version `0.22.1`, and the report blob all passed. The workflow then expected checker/test Git blobs `1dccd70d...` / `c6a2eef...`, while the actual branch-reachable repaired blobs are `67b5982a832aa483f25d6ba0ce4066e9a26b71de` / `3596fef3836c9bec078d7d3a6c4605e92c160957`. Therefore attempt 2 is a technical non-result with no admissible scientific comparison. Its one-use workflows were removed by cleanup commit `c1dc181439def613e2ff3fc04ed05622bdecee33`, and the exact receipt is retained as ordinary JSON. Attempt 3 may change only those two execution identity constants; checker equations, comparison logic, tests, primary data, case set, and thresholds remain frozen.\n\nA third repaired checker is required before the already-preregistered ledger-neutral radial control may execute."
          if gate_anchor not in text:
              raise SystemExit("checker gate anchor not found")
          text = text.replace(gate_anchor, gate_anchor + gate_add, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lineum-public-tolog-galactic-shape-b4.md
          git commit -m "research: record B4 Q2 PV1 checker attempt 2"
          git push origin HEAD:develop
          echo "PRECHECK_REPORT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WORKFLOW_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Verify supported environment and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          python - <<'PY'
          import numpy as np
          import platform
          import pytest
          print("python=" + platform.python_version())
          print("numpy=" + np.__version__)
          print("pytest=" + pytest.__version__)
          if int(np.__version__.split(".")[0]) >= 2:
              raise SystemExit("NumPy 2.x is outside the frozen supported range")
          PY
          grep -F '**Version:** 0.22.2' research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json)" = "7a7ce23471d51d9b2244256387934658b12e1f52"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check-attempt-2.json)" = "7b4cfffe072a554c9ffed4f02bb1ee29fcacbefc"
          test "$(git hash-object research/runners/lineum_b4_saturation_localized_l1.py)" = "1598faf0f39e056c1684f767c2554edc63283ca4"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger.py)" = "e3657119b855965b4fd622b3e94f08443a7c9107"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger.py)" = "403c1cb8747cebf3280009b3b2ffcd814c72e060"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger_check.py)" = "67b5982a832aa483f25d6ba0ce4066e9a26b71de"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger_check.py)" = "3596fef3836c9bec078d7d3a6c4605e92c160957"

      - name: Run frozen checker test gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger_check.py | tee "$RUNNER_TEMP/q2-pv1-check-tests.txt"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          text = (Path(os.environ["RUNNER_TEMP"]) / "q2-pv1-check-tests.txt").read_text(encoding="utf-8")
          matches = re.findall(r"(\d+) passed", text)
          if not matches:
              raise SystemExit("pytest pass count not found")
          print("tests_passed=" + matches[-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("CHECKER_TESTS_PASSED=" + matches[-1] + "\n")
          PY

      - name: Run repaired independent retained-statistics checker exactly once
        id: checker
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/q2-pv1-check.json"
          stdout="$RUNNER_TEMP/q2-pv1-check.stdout"
          set +e
          python research/runners/lineum_b4_q2_perturbation_ledger_check.py \
            --primary research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json \
            --output "$output" >"$stdout" 2>&1
          status=$?
          set -e
          cat "$stdout"
          if [ ! -f "$output" ]; then
            echo "checker output missing"
            exit 2
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "q2-pv1-check.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          print("Q2_PV1_CHECK_RESULT_BEGIN")
          print(json.dumps(payload, sort_keys=True, separators=(",", ":"), allow_nan=False))
          print("Q2_PV1_CHECK_RESULT_END")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print("file_sha256=" + digest)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("CHECKER_FILE_SHA256=" + digest + "\n")
              handle.write("CHECKER_PASSED=" + ("true" if payload.get("passed") is True else "false") + "\n")
          PY
          echo "CHECKER_EXIT_CODE=$status" >> "$GITHUB_ENV"

      - name: Retain checker result and update report
        if: always() && steps.checker.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/q2-pv1-check.json"
          test -f "$output"
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          if [ "${CHECKER_EXIT_CODE}" = "0" ] && [ "${CHECKER_PASSED}" = "true" ]; then
            cp "$output" research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check.json
            export FINAL_CHECK_PARENT="$(git rev-parse HEAD)"
            python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          result = Path("research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check.json")
          text = report.read_text(encoding="utf-8")
          payload = json.loads(result.read_text(encoding="utf-8"))
          if payload.get("passed") is not True:
              raise SystemExit("checker payload is not passed=true")
          summary = payload["independent_summary"]
          if summary["case_count"] != 28 or summary["ledger_non_neutral_applicable_count"] != 24 or summary["ledger_neutral_applicable_count"] != 4:
              raise SystemExit("unexpected independent summary")
          if payload.get("numeric_mismatch_count") != 0 or payload.get("categorical_mismatch_count") != 0:
              raise SystemExit("unexpected mismatch count")

          status_old = next(line for line in text.splitlines() if line.startswith("**Status:**"))
          status_new = "**Status:** active authoritative report; localized-L1 negative independently verified; `Q2-O1` observer-frame test completed; `Q2-SA1-A` independently reproduced in a repository-supported runtime; all eight Stage A cases are `unpaired_source_dominated`; no Stage B candidate survives; `Q2-PV1-A` is now independently reproduced and shows that the canonical radial perturbation is non-neutral in `24 / 28` active frozen states under the declared implementation ledger; the preregistered ledger-neutral radial control is unlocked; Q1 and Q3 remain unchanged"
          text = text.replace(status_old, status_new, 1)
          text = text.replace("**Version:** 0.22.2  ", "**Version:** 0.23.0  ", 1)
          text, n = re.subn(
              r"\*\*Checkpoint parent:\*\* `[0-9a-f]{40}`",
              f"**Checkpoint parent:** `{os.environ['FINAL_CHECK_PARENT']}`",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("final checkpoint parent replacement failed")

          history_anchor = "Version `0.22.2` records repaired-checker attempt 2 as a pre-execution source-identity failure: the supported environment and report checks passed, but two workflow constants were not the actual branch-reachable Git blob identities of the repaired checker and its test, so neither the test gate nor checker executed; the only permitted attempt-3 correction is those two workflow identity constants."
          history_add = " Version `0.23.0` records repaired-checker attempt 3 as the first successful independent `Q2-PV1-A` verification after the exact workflow-identity correction, retains the checker JSON, confirms zero numeric and categorical mismatches under the frozen comparison rules, removes the one-use workflow, and unlocks the preregistered ledger-neutral radial control without changing Q1 or Q3."
          if history_anchor not in text:
              raise SystemExit("final version-history anchor not found")
          text = text.replace(history_anchor, history_anchor + history_add, 1)

          final_anchor = "A third repaired checker is required before the already-preregistered ledger-neutral radial control may execute."
          final_block = f"\n\nRepaired-checker attempt 3 completed successfully in the repository-supported environment after the frozen test gate passed `{os.environ['CHECKER_TESTS_PASSED']} / {os.environ['CHECKER_TESTS_PASSED']}`. The independent retained-statistics implementation returned `passed = true`, `key_set_pass = true`, `protocol_pass = true`, `numeric_mismatch_count = 0`, `categorical_mismatch_count = 0`, `case_count = 28`, `ledger_non_neutral_applicable_count = 24`, and `ledger_neutral_applicable_count = 4`. Its retained output file SHA-256 is `{os.environ['CHECKER_FILE_SHA256']}` and the workflow run is `{os.environ['GITHUB_RUN_ID']}` from source commit `{os.environ['WORKFLOW_SOURCE_COMMIT']}`. The bounded methodological conclusion is therefore `robust_within_tested_domain`: for the exact frozen 28-state screen and declared implementation ledger, the canonical radial perturbation is not universally ledger-neutral. This does not weaken the earlier Q2 negative, make Q2 positive, identify a physical energy, or establish the replacement mechanism. It removes a confound before testing a conservative repair.\n\nThe next Q2 step remains the preregistered ledger-neutral radial control: preserve the same central `1.5` multiplier and solve the annular multiplier from the frozen pre-perturbation sufficient statistics so that the declared `sum(|psi|^2) + sum(phi)` ledger is unchanged whenever a real non-negative solution exists; zero or infeasible cases must remain explicit rather than tuned away. Only after that control is independently checked may a reciprocal `psi <-> phi` repair or a phase/interference candidate be compared."
          if final_anchor not in text:
              raise SystemExit("final checker anchor not found")
          text = text.replace(final_anchor, final_anchor + final_block, 1)

          q2_pattern = re.compile(r"(2\. Does Lineum possess a finite mathematical attractor.*?\n   \*\*Current answer:\*\* )(.*?)(\n3\. Can the exact `256 x 256` grid)", re.S)
          q2_answer = "no within the tested domain. The independently verified localized screen found no full-state recovery; the homogeneous audit found no reciprocal reservoir return; `Q2-O1` rescued none of the 28 classifications; and independently reproduced `Q2-SA1-A` shows that apparent simplified-lane `psi` recovery is dominated by unpaired gain rather than reciprocal incoming spatial return. No Stage B candidate survives. `Q2-PV1-A` is now independently reproduced and additionally establishes that the canonical radial perturbation changes the declared implementation ledger in `24 / 28` active frozen states, so the preregistered ledger-neutral control must be used before judging a strictly conservative repair."
          text, n = q2_pattern.subn(r"\1" + q2_answer + r"\3", text, count=1)
          if n != 1:
              raise SystemExit("Q2 current-answer replacement failed")
          report.write_text(text, encoding="utf-8")
          PY
            git rm .github/workflows/b4-q2-pv1-check-3.yml
            git add research/lineum-public-tolog-galactic-shape-b4.md research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check.json
            git commit -m "research: verify B4 Q2 PV1 perturbation ledger"
            git push origin HEAD:develop
          else
            cp "$output" research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check-attempt-3.json
            export FINAL_CHECK_PARENT="$(git rev-parse HEAD)"
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          report = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = report.read_text(encoding="utf-8")
          text = text.replace("**Version:** 0.22.2  ", "**Version:** 0.22.3  ", 1)
          text, n = re.subn(r"\*\*Checkpoint parent:\*\* `[0-9a-f]{40}`", f"**Checkpoint parent:** `{os.environ['FINAL_CHECK_PARENT']}`", text, count=1)
          if n != 1:
              raise SystemExit("failed-check checkpoint parent replacement failed")
          anchor = "A third repaired checker is required before the already-preregistered ledger-neutral radial control may execute."
          addition = f"\n\nAttempt 3 executed the checker but did not pass its frozen comparison (`exit_code = {os.environ['CHECKER_EXIT_CODE']}`, `passed = {os.environ['CHECKER_PASSED']}`). The exact checker JSON is retained as `q2-perturbation-ledger-stage-a-check-attempt-3.json`. This is not converted into a positive or negative mechanism claim here; the first divergence must be resolved before the ledger-neutral control may run."
          if anchor not in text:
              raise SystemExit("failed-check anchor not found")
          text = text.replace(anchor, anchor + addition, 1)
          report.write_text(text, encoding="utf-8")
          PY
            git rm .github/workflows/b4-q2-pv1-check-3.yml
            git add research/lineum-public-tolog-galactic-shape-b4.md research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check-attempt-3.json
            git commit -m "research: retain B4 Q2 PV1 checker attempt 3"
            git push origin HEAD:develop
            exit 1
          fi
