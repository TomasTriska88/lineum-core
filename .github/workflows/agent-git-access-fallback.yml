name: Git access fallback policy regression

on:
  push:
    branches: [develop]
    paths:
      - '.agent/rules.md'
      - 'scripts/agent_git_access_fallback.py'
      - 'tests/test_agent_git_access_fallback.py'
      - '.github/workflows/agent-git-access-fallback.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '.agent/rules.md'
      - 'scripts/agent_git_access_fallback.py'
      - 'tests/test_agent_git_access_fallback.py'
      - '.github/workflows/agent-git-access-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Git access fallback routing and binding instructions
        run: python -m unittest discover -s tests -p 'test_agent_git_access_fallback.py' -v
