name: Q2 PV1-B Report Checkpoint

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-report-checkpoint.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact checkpoint commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact evidence and patcher inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .github/scripts/q2_pv1b_report_checkpoint.py)" = "97e1d8b949a73d525e96f9e72354409a8159c43c"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "4f4759d629c2c0e9d1b57ff98cdff398340e9302"
          test "$(git hash-object research/lineum-public-tolog-b4/artifact-manifest.json)" = "d29693ade9a1d9352793171eb7c8a5e02577aa99"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json)" = "7a7ce23471d51d9b2244256387934658b12e1f52"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check.json)" = "c459e4a1f947aba55d01f8f30bc1aa6bae88076f"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-protocol.json)" = "8968401cbbad4c972024318bb48c976cdf54854b"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-attempt-1.json)" = "56592eb0a09f58d232332004a64451cfc865c26e"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-execution.json)" = "e16a2b7b2679eaa9a126c8ebc8bd81ad383c9194"

      - name: Apply fail-closed report checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/q2_pv1b_report_checkpoint.py
          grep -q 'Q2-PV1-B' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q '`0 / 26` Q2 rescues' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q 'primary_pending_independent_check' research/lineum-public-tolog-galactic-shape-b4.md
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('research/lineum-public-tolog-b4/artifact-manifest.json').read_text())
          assert m['schema'] == 'lineum-public-tolog-b4-readable-artifacts/4'
          q = m['q2_ledger_neutral_control']
          assert q['control_available_count'] == 26
          assert q['control_unavailable_count'] == 2
          assert q['balanced_rescue_count'] == 0
          assert q['q2_classification_changed_count'] == 0
          assert q['scientific_status'] == 'primary_pending_independent_check'
          PY

      - name: Publish bounded checkpoint and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/q2-pv1b-report-checkpoint.yml
          rm .github/scripts/q2_pv1b_report_checkpoint.py
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/scripts/q2_pv1b_report_checkpoint.py' '.github/workflows/q2-pv1b-report-checkpoint.yml' 'research/lineum-public-tolog-b4/artifact-manifest.json' 'research/lineum-public-tolog-galactic-shape-b4.md' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/q2_pv1b_report_checkpoint.py .github/workflows/q2-pv1b-report-checkpoint.yml research/lineum-public-tolog-b4/artifact-manifest.json research/lineum-public-tolog-galactic-shape-b4.md
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: record Q2 PV1-B primary checkpoint"
          git push origin HEAD:develop
