name: Q2 PV1-B Residual Repair Test-First Gate

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-checker-repair-test-first.yml"

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen pre-repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py)" = "f6b384c895d9022e4619d2e51eeea824d1185d54"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json)" = "592eaad84f14eeb4375f80e7cb4056eef786c4d9"

      - name: Set up supported test runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install frozen test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==9.1.1"

      - name: Prove old checker fails exactly the two new regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b-repair-tdd
          set +e
          PYTHONPATH=. pytest -q \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control_check_residual_repair.py \
            > .scratch/q2-pv1b-repair-tdd/output.txt 2>&1
          status=$?
          set -e
          cat .scratch/q2-pv1b-repair-tdd/output.txt
          test "$status" -ne 0
          grep -q '2 failed, 12 passed' .scratch/q2-pv1b-repair-tdd/output.txt

      - name: Retain expected test-first failure and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('.scratch/q2-pv1b-repair-tdd/output.txt')
          receipt = {
              'schema': 'lineum-b4-q2-ledger-neutral-control-check-repair-test-first/1',
              'stage': 'Q2-PV1-B-CHECK-REPAIR',
              'classification': 'expected_test_first_failure',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_source_commit': os.environ['GITHUB_SHA'],
              'old_checker_git_blob': '50a26bcfc7ef16af33f192b97eb99690e8a13fea',
              'original_test_git_blob': '937e0c1e36c1bdad4a84749aec11ef19ffecb4d5',
              'new_regression_test_git_blob': 'f6b384c895d9022e4619d2e51eeea824d1185d54',
              'repair_protocol_git_blob': '592eaad84f14eeb4375f80e7cb4056eef786c4d9',
              'expected_result': '2 failed, 12 passed',
              'output_sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              'scientific_command_invoked': False,
              'scientific_interpretation': 'none; this receipt only proves that the frozen pre-repair checker does not satisfy the two preregistered residual-comparison regressions',
              'workflow_artifact_uploaded': False,
          }
          Path('research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-test-first.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          rm .github/workflows/q2-pv1b-checker-repair-test-first.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-test-first.json .github/workflows/q2-pv1b-checker-repair-test-first.yml
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "test: retain Q2 PV1-B repair test-first failure"
          git push origin HEAD:develop
