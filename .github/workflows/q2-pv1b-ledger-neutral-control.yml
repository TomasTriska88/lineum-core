name: Q2 PV1-B Ledger-Neutral Control

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-ledger-neutral-control.yml"

permissions:
  contents: write

jobs:
  q2-pv1b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen repository inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "4f4759d629c2c0e9d1b57ff98cdff398340e9302"
          test "$(git hash-object research/runners/lineum_b4_saturation_localized_l1.py)" = "1598faf0f39e056c1684f767c2554edc63283ca4"
          test "$(git hash-object tests/research/test_lineum_b4_saturation_localized_l1.py)" = "e4a4b450e52ad3f8fa15d69dfbdb00505be67dab"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger.py)" = "e3657119b855965b4fd622b3e94f08443a7c9107"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger.py)" = "403c1cb8747cebf3280009b3b2ffcd814c72e060"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json)" = "7a7ce23471d51d9b2244256387934658b12e1f52"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a-check.json)" = "c459e4a1f947aba55d01f8f30bc1aa6bae88076f"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control.py)" = "cffa0cc87a070d6915606ab064ec3eee2d89a061"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control.py)" = "240867abf29db6c248ff9515fa1770482fe8d9ac"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-protocol.json)" = "8968401cbbad4c972024318bb48c976cdf54854b"

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install frozen scientific dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==9.1.1"
          python --version
          python - <<'PY'
          import numpy, pytest
          assert numpy.__version__ == "1.26.4"
          assert pytest.__version__ == "9.1.1"
          print("numpy", numpy.__version__)
          print("pytest", pytest.__version__)
          PY

      - name: Run frozen pre-execution test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/q2-pv1b
          PYTHONPATH=. pytest -q \
            tests/research/test_lineum_b4_saturation_localized_l1.py \
            tests/research/test_lineum_b4_q2_perturbation_ledger.py \
            tests/research/test_lineum_b4_q2_ledger_neutral_control.py \
            | tee .scratch/q2-pv1b/test-output.txt

      - name: Execute frozen Q2 PV1-B primary once
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/runners/lineum_b4_q2_ledger_neutral_control.py \
            --output .scratch/q2-pv1b/result.json \
            | tee .scratch/q2-pv1b/runner-stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.scratch/q2-pv1b/result.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          summary = data['summary']
          checks = {
              'schema': data['schema'] == 'lineum-b4-q2-ledger-neutral-control/1',
              'stage': data['stage'] == 'Q2-PV1-B',
              'status': data['status'] == 'primary_pending_independent_check',
              'case_count': summary['case_count'] == 28,
              'partition': summary['control_available_count'] + summary['control_unavailable_count'] == 28,
              'neutrality': summary['neutral_perturbation_failure_count'] == 0,
              'nontechnical': summary['outcome'] != 'technical_or_methodological_failure',
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Q2 PV1-B frozen-output validation failed: {failed}')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Retain plain result and execution receipt, then remove one-use workflow
        shell: bash
        env:
          WORKFLOW_PATH: .github/workflows/q2-pv1b-ledger-neutral-control.yml
        run: |
          set -euo pipefail
          result_path="research/lineum-public-tolog-b4/q2-ledger-neutral-control.json"
          receipt_path="research/lineum-public-tolog-b4/q2-ledger-neutral-control-execution.json"
          cp .scratch/q2-pv1b/result.json "$result_path"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          import numpy
          import pytest

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          result_path = 'research/lineum-public-tolog-b4/q2-ledger-neutral-control.json'
          test_path = '.scratch/q2-pv1b/test-output.txt'
          stdout_path = '.scratch/q2-pv1b/runner-stdout.txt'
          result = json.loads(Path(result_path).read_text(encoding='utf-8'))
          receipt = {
              'schema': 'lineum-b4-q2-ledger-neutral-control-execution/1',
              'stage': 'Q2-PV1-B',
              'status': 'supported_runtime_primary_completed',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_job': 'q2-pv1b',
              'workflow_source_commit': os.environ['GITHUB_SHA'],
              'environment': {
                  'python': platform.python_version(),
                  'numpy': numpy.__version__,
                  'pytest': pytest.__version__,
                  'runner_os': os.environ.get('RUNNER_OS'),
              },
              'source_blobs': {
                  'canonical_runner': '1598faf0f39e056c1684f767c2554edc63283ca4',
                  'canonical_test': 'e4a4b450e52ad3f8fa15d69dfbdb00505be67dab',
                  'pv1_runner': 'e3657119b855965b4fd622b3e94f08443a7c9107',
                  'pv1_test': '403c1cb8747cebf3280009b3b2ffcd814c72e060',
                  'pv1_primary': '7a7ce23471d51d9b2244256387934658b12e1f52',
                  'pv1_checker': 'c459e4a1f947aba55d01f8f30bc1aa6bae88076f',
                  'pv1b_runner': 'cffa0cc87a070d6915606ab064ec3eee2d89a061',
                  'pv1b_test': '240867abf29db6c248ff9515fa1770482fe8d9ac',
                  'pv1b_protocol': '8968401cbbad4c972024318bb48c976cdf54854b',
                  'report': '4f4759d629c2c0e9d1b57ff98cdff398340e9302',
              },
              'result_sha256': sha256(result_path),
              'test_output_sha256': sha256(test_path),
              'runner_stdout_sha256': sha256(stdout_path),
              'summary': result['summary'],
              'workflow_artifact_uploaded': False,
          }
          Path('research/lineum-public-tolog-b4/q2-ledger-neutral-control-execution.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_path" "$receipt_path" "$WORKFLOW_PATH"
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: retain Q2 PV1-B primary and cleanup"
          git push origin HEAD:develop
