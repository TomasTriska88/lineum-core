name: B4 Q2 mu history divergence note

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-mu-history-divergence-note.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8655c7028afaf1c60b547bc962b7d04a0b7f89d5"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "dde879b445f9e55b793fa18c3bc54dd13bd73508"
          test "$(git hash-object research/lineum-current-engine-label-retention-test.md)" = "827d312e3826f26dbab4303da482b38bf337e41c"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Record historical prose-code divergence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")

          if text.count("**Version:** 0.25.1 \\") != 1:
              raise SystemExit("unexpected report version")
          text = text.replace("**Version:** 0.25.1 \\", "**Version:** 0.25.2 \\", 1)

          if text.count("**Checkpoint parent:** `1fee3399f78c8ca5064843571c68eb70e2929bbb` \\") != 1:
              raise SystemExit("unexpected checkpoint parent")
          text = text.replace(
              "**Checkpoint parent:** `1fee3399f78c8ca5064843571c68eb70e2929bbb` \\",
              "**Checkpoint parent:** `8655c7028afaf1c60b547bc962b7d04a0b7f89d5` \\",
              1,
          )

          status_old = (
              "version `0.25.1` completes the observer/noise/cap definitions before runner "
              "implementation; no new causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          status_new = (
              "version `0.25.1` completes the observer/noise/cap definitions and version `0.25.2` "
              "records the recovered historical prose/code ordering divergence before runner implementation; "
              "no new causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          )
          if text.count(status_old) != 1:
              raise SystemExit("unexpected status phrase")
          text = text.replace(status_old, status_new, 1)

          heading = "### Q2-M1 historical source-off / echo ordering divergence — version `0.25.2`"
          if heading in text:
              raise SystemExit("divergence note already present")

          addition = textwrap.dedent(r'''
          ### Q2-M1 historical source-off / echo ordering divergence — version `0.25.2`

          A pre-implementation audit recovered a material disagreement inside the older current-engine label-retention record. Its narrative protocol describes a source-removal interval before later causal reuse, but the embedded historical Python builds C0-C4 directly from the `imprint_states` arrays, replaces `psi` with the common state, and does **not** feed the 2000-step passive source-off states into those causal lanes.

          This is a historical documentation/reference-code divergence. It is preserved rather than silently reconciled. No retained full C0-C5 result was recovered on the current branch, so neither ordering has a retained causal outcome that can choose between them.

          `Q2-M1` does not change in response to this discovery. Versions `0.25.0` and `0.25.1` already froze the stricter sequence before any new outcome was inspected:

          ```text
          labelled imprint
          -> set psi = 0 and disable further mu deposition
          -> 2000 source-off updates
          -> inject the same psi_common into both histories
          -> causal echo lanes C0-C5
          ```

          The scientific reason is explicit: the owner-inspired candidate is a retained description/guide. Requiring the candidate history to survive removal of the original `psi` before it is asked to affect a later identical current state is a stronger and more direct discriminator of that hypothesis than immediately reusing the imprint state.

          Therefore the forthcoming Stage A runner is a **new preregistered source-off causal-reuse test using the active Core**, not a byte-for-byte or semantic reproduction of the older embedded C-lane implementation. The older embedded code remains historical evidence of a different ordering and is not rewritten.

          This clarification changes no Q2-M1 parameters, observers, thresholds, state equations, nuisance variants, or outcome map. It is frozen before runner implementation and before any causal-memory execution.
          ''').strip()

          text = text.rstrip() + "\n\n" + addition + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq '**Version:** 0.25.2 \' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq 'historical documentation/reference-code divergence' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit note and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b4-q2-mu-history-divergence-note.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/b4-q2-mu-history-divergence-note.yml research/lineum-public-tolog-galactic-shape-b4.md "
          git diff --cached --check
          git commit -m "research: record Q2 mu history ordering divergence"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
