      - name: Run frozen regression tests only
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/research/test_lineum_b4_q2_mu_causal_echo.py
          if grep -R --line-number --fixed-strings 'run_primary()' tests/research/test_lineum_b4_q2_mu_causal_echo.py; then
            echo 'Test module must not invoke run_primary()' >&2
            exit 1
          fi

      - name: Commit tested runner and test, then remove gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/q2-mu-causal-echo-test-before-commit.yml
          git add research/runners/lineum_b4_q2_mu_causal_echo.py tests/research/test_lineum_b4_q2_mu_causal_echo.py
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/q2-mu-causal-echo-test-before-commit.yml research/runners/lineum_b4_q2_mu_causal_echo.py tests/research/test_lineum_b4_q2_mu_causal_echo.py "
          git diff --cached --check
          git commit -m "research: add frozen Q2 mu causal runner"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
