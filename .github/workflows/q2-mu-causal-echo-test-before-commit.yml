name: Retain failed Q2 mu test gate

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/q2-mu-causal-echo-test-before-commit.yml

permissions:
  contents: write

jobs:
  retain-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify chronology base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6437b4cd3cd2b6a1f3957cd42d6eed167507787c"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "e30ad4204111d5c80021caf1fc0a8326965bb5f5"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Record technical non-result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("research/lineum-public-tolog-galactic-shape-b4.md")
          text = path.read_text(encoding="utf-8")
          if text.count("**Version:** 0.25.3 \\") != 1:
              raise SystemExit("unexpected report version")
          text = text.replace("**Version:** 0.25.3 \\", "**Version:** 0.25.4 \\", 1)
          if text.count("**Checkpoint parent:** `dd37c78b8e939b48901ca245cb047f68df18a9cb` \\") != 1:
              raise SystemExit("unexpected checkpoint parent")
          text = text.replace(
              "**Checkpoint parent:** `dd37c78b8e939b48901ca245cb047f68df18a9cb` \\",
              "**Checkpoint parent:** `6437b4cd3cd2b6a1f3957cd42d6eed167507787c` \\",
              1,
          )
          old = "no new causal-memory execution has yet been performed; Questions 1 and 3 remain unchanged"
          new = (
              "the first Q2-M1 test-before-commit attempt failed at the frozen candidate-byte identity gate "
              "before pytest or scientific execution, so no causal-memory result exists yet; Questions 1 and 3 remain unchanged"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected status phrase")
          text = text.replace(old, new, 1)

          addition = textwrap.dedent(r'''
          ### Q2-M1 test-before-commit attempt 1 — technical byte-identity failure (`0.25.4`)

          The first supported-runtime runner/test gate was triggered from commit `6437b4cd3cd2b6a1f3957cd42d6eed167507787c` as GitHub Actions run `31344052319`, job `93322557606`.

          The execution chronology is bounded and must not be interpreted as a scientific result:

          ```text
          checkout / frozen-parent gate: passed
          Python 3.11 setup: passed
          repository dependency installation: passed
          NumPy 1.26.4 exact-version assertion: passed
          candidate materialization: reached
          frozen Git-blob identity assertion: failed
          py_compile: not reached after the failed identity assertion
          pytest: not executed
          run_primary(): not executed
          runner/test commit: not created
          scientific JSON result: not created
          ```

          The failure is classified as `technical_candidate_byte_identity_failure`. The materialized workflow candidate did not match the predeclared Git blob identity of the locally syntax-checked candidate. The failed job did not print the alternate materialized SHA, so the exact byte divergence is not established from the retained log and must not be guessed into the scientific record.

          This failure changes no Q2-M1 scientific definition, threshold, parameter, observer, source equation, Q1 result, Q2 result, or Q3 result. It also does not validate or falsify the proposed `mu` causal-reuse path.

          The only permitted next step is to freeze an exact candidate byte identity through a transport path that can be independently read back, then rerun the same supported-runtime regression gate from the beginning. No official Stage A science may run until the exact tested runner and test are branch-reachable and their identities are recorded in this report.
          ''').strip()
          text = text.rstrip() + "\n\n" + addition + "\n"
          path.write_text(text, encoding="utf-8")
          PY
          grep -Fq '**Version:** 0.25.4 \' research/lineum-public-tolog-galactic-shape-b4.md
          grep -Fq 'technical_candidate_byte_identity_failure' research/lineum-public-tolog-galactic-shape-b4.md
          git diff --check
          test "$(git diff --name-only)" = "research/lineum-public-tolog-galactic-shape-b4.md"

      - name: Commit report and remove failed workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lineum Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/q2-mu-causal-echo-test-before-commit.yml
          git add research/lineum-public-tolog-galactic-shape-b4.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/q2-mu-causal-echo-test-before-commit.yml research/lineum-public-tolog-galactic-shape-b4.md "
          git diff --cached --check
          git commit -m "research: retain failed Q2 mu test gate"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git push origin HEAD:develop
