name: Q2 mu causal echo test before commit

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/q2-mu-causal-echo-test-before-commit.yml

permissions:
  contents: write

jobs:
  test-before-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen base and no existing Q2-M1 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eca842478ec3cffe851a5a1a3e3ae17575c9abfe"
          test ! -e research/runners/lineum_b4_q2_mu_causal_echo.py
          test ! -e tests/research/test_lineum_b4_q2_mu_causal_echo.py
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "$(git rev-parse HEAD^:research/lineum-public-tolog-galactic-shape-b4.md)"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python - <<'PY'
          import numpy as np
          print(np.__version__)
          assert np.__version__ == "1.26.4", np.__version__
          PY

      - name: Materialize frozen runner and test candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runners tests/research
          cat > research/runners/lineum_b4_q2_mu_causal_echo.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import math
          import os
          import platform
          import subprocess
          import sys
          import time
          from dataclasses import asdict, replace
          from pathlib import Path
          from typing import Any, Dict, Iterable, List, Sequence, Tuple

          import numpy as np

          from lineum_core.math import CoreConfig, ExecutionPolicy, step_core

          STAGE = "Q2-M1-A"
          SCHEMA = "lineum-b4-q2-mu-causal-echo/1"
          SEED = 20260804
          LABEL_A = 0
          LABEL_B = 1
          ENGINE_GIT_BLOB = "bb877021810691223a0eb960a45493a2e351112a"
          PREREGISTRATION_COMMIT = "eca842478ec3cffe851a5a1a3e3ae17575c9abfe"
          PREREGISTRATION_VERSION = "0.25.3"
          REQUIREMENTS_GIT_BLOB = "942f2b94b3d3f8c767451ae2d847a7b17c86d81e"
          REQUIREMENTS_DEV_GIT_BLOB = "7a0907e3e6c2d15400d19b536227a509910ae7e9"
          CHECKPOINTS = (0, 100, 500, 1000, 2000)
          SCHEDULE = tuple(
              (separation, width, shift_x, shift_y)
              for separation in (10.0, 12.0, 14.0)
              for width in (2.5, 3.5)
              for shift_x, shift_y in ((-3, -2), (-2, 3), (0, 0), (2, -3), (3, 2))
          )
          REPRESENTATIVE_INDICES = (12, 17)
          CHANNEL_IDS = {"psi": 0, "phi": 1, "mu": 2}
          PURPOSE_IDS = {
              "quadrupole_permutation": 10,
              "pooled_permutation": 11,
              "low_noise": 20,
              "high_noise": 21,
              "low_noise_quadrupole_permutation": 30,
              "low_noise_pooled_permutation": 31,
              "high_noise_quadrupole_permutation": 32,
              "high_noise_pooled_permutation": 33,
          }


          def supported_numpy_version(version: str) -> bool:
              major_minor = tuple(int(part) for part in version.split(".")[:2])
              return (1, 24) <= major_minor < (2, 0)


          def frozen_config(
              *,
              dt: float = 0.1,
              mu_eta: float = 0.005,
              mu_rho: float = 0.0001,
              mu_cap: float = 10.0,
          ) -> CoreConfig:
              return CoreConfig(
                  dt=dt,
                  psi_diffusion=0.05,
                  phi_diffusion=0.05,
                  dissipation_rate=0.005,
                  reaction_strength=0.0007,
                  noise_strength=0.005,
                  drift_strength=0.0,
                  stencil_type="LAP4",
                  physics_mode_psi="diffusion",
                  disable_quantum_noise=True,
                  phi_diffusion_scales_with_dt=True,
                  use_mode_coupling=False,
                  use_mu=True,
                  mu_eta=mu_eta,
                  mu_rho=mu_rho,
                  mu_cap=mu_cap,
                  mu_peak_cutoff_ratio=0.1,
                  psi_amp_cap=1e6,
                  grad_cap=1e6,
                  phi_cap=1e6,
                  disable_pml=True,
              )


          def clone_state(state: Dict[str, Any]) -> Dict[str, Any]:
              return {
                  key: (value.copy() if isinstance(value, np.ndarray) else value)
                  for key, value in state.items()
                  if key != "telemetry"
              }


          def array_coordinates(size: int) -> Tuple[np.ndarray, np.ndarray]:
              axis = np.arange(size, dtype=np.float64) - (size - 1) / 2.0
              row, col = np.meshgrid(axis, axis, indexing="ij")
              return row, col


          def normalize_energy(amplitude: np.ndarray) -> np.ndarray:
              energy = float(np.sum(np.abs(amplitude) ** 2))
              if energy <= 0.0 or not np.isfinite(energy):
                  raise ValueError("Amplitude must carry finite positive energy")
              return np.asarray(amplitude, dtype=np.complex128) / math.sqrt(energy)


          def gaussian(row_delta: np.ndarray, col_delta: np.ndarray, width: float) -> np.ndarray:
              return np.exp(
                  -(row_delta * row_delta + col_delta * col_delta) / (2.0 * width * width)
              )


          def make_orientation_pair(
              size: int,
              separation: float,
              width: float,
              shift_x: int,
              shift_y: int,
          ) -> Tuple[np.ndarray, np.ndarray]:
              row, col = array_coordinates(size)
              horizontal = gaussian(row, col - separation / 2.0, width) + gaussian(
                  row, col + separation / 2.0, width
              )
              vertical = gaussian(row - separation / 2.0, col, width) + gaussian(
                  row + separation / 2.0, col, width
              )
              horizontal = np.roll(horizontal, (shift_y, shift_x), axis=(0, 1))
              vertical = np.roll(vertical, (shift_y, shift_x), axis=(0, 1))
              return normalize_energy(horizontal), normalize_energy(vertical)


          def make_common_state(size: int, width: float = 5.0) -> np.ndarray:
              row, col = array_coordinates(size)
              return normalize_energy(gaussian(row, col, width))


          def make_state(psi: np.ndarray) -> Dict[str, np.ndarray]:
              size = psi.shape[0]
              zeros = np.zeros((size, size), dtype=np.float64)
              return {
                  "psi": np.asarray(psi, dtype=np.complex128).copy(),
                  "phi": zeros.copy(),
                  "mu": zeros.copy(),
                  "kappa": np.ones((size, size), dtype=np.float64),
              }


          def state_finite(state: Dict[str, Any]) -> bool:
              return all(np.all(np.isfinite(state[channel])) for channel in ("psi", "phi", "mu"))


          def evolve(
              state: Dict[str, Any], cfg: CoreConfig, steps: int
          ) -> Tuple[Dict[str, Any], Dict[str, Any]]:
              out = clone_state(state)
              possible_reset = False
              max_abs_psi = float(np.max(np.abs(out["psi"])))
              max_phi = float(np.max(out["phi"]))
              max_mu = float(np.max(out["mu"]))
              for _ in range(steps):
                  before_max = float(np.max(np.abs(out["psi"])))
                  out = step_core(out, cfg)
                  after_max = float(np.max(np.abs(out["psi"])))
                  if before_max > 1e-15 and after_max == 0.0:
                      possible_reset = True
                  max_abs_psi = max(max_abs_psi, after_max)
                  max_phi = max(max_phi, float(np.max(out["phi"])))
                  max_mu = max(max_mu, float(np.max(out["mu"])))
              return out, {
                  "finite": state_finite(out),
                  "possible_fail_safe_reset": possible_reset,
                  "max_abs_psi": max_abs_psi,
                  "max_phi": max_phi,
                  "max_mu": max_mu,
              }


          def field_weight(channel: str, value: np.ndarray) -> np.ndarray:
              if channel == "psi":
                  return np.abs(value) ** 2
              return np.maximum(np.asarray(value, dtype=np.float64), 0.0)


          def quadrupole_score(weight: np.ndarray) -> float:
              field = np.maximum(np.asarray(weight, dtype=np.float64), 0.0)
              total = float(np.sum(field))
              if total <= 0.0:
                  return 0.0
              row, col = array_coordinates(field.shape[0])
              x_center = float(np.sum(field * col) / total)
              y_center = float(np.sum(field * row) / total)
              dx = col - x_center
              dy = row - y_center
              denominator = float(np.sum(field * (dx * dx + dy * dy))) + 1e-30
              return float(np.sum(field * (dx * dx - dy * dy)) / denominator)


          def quadrupole_predictions(fields: np.ndarray) -> np.ndarray:
              scores = np.asarray([quadrupole_score(field) for field in fields])
              predictions = np.full(len(fields), -1, dtype=np.int64)
              predictions[scores > 1e-6] = LABEL_A
              predictions[scores < -1e-6] = LABEL_B
              return predictions


          def recenter_integer(weight: np.ndarray) -> np.ndarray:
              field = np.maximum(np.asarray(weight, dtype=np.float64), 0.0)
              total = float(np.sum(field))
              if total <= 0.0:
                  return field.copy()
              row, col = array_coordinates(field.shape[0])
              x_center = float(np.sum(field * col) / total)
              y_center = float(np.sum(field * row) / total)
              return np.roll(
                  field,
                  (-int(round(y_center)), -int(round(x_center))),
                  axis=(0, 1),
              )


          def pooled_feature(weight: np.ndarray, pooled_size: int = 8) -> np.ndarray:
              field = recenter_integer(weight)
              norm = float(np.linalg.norm(field))
              if norm <= 0.0:
                  return np.zeros(pooled_size * pooled_size, dtype=np.float64)
              field = field / norm
              size = field.shape[0]
              if size % pooled_size != 0:
                  raise ValueError("Grid size must be divisible by pooled size")
              block = size // pooled_size
              return field.reshape(pooled_size, block, pooled_size, block).mean(axis=(1, 3)).ravel()


          def nearest_centroid_predictions(
              train_features: np.ndarray,
              train_labels: np.ndarray,
              test_features: np.ndarray,
          ) -> np.ndarray:
              centroids = np.stack(
                  [np.mean(train_features[train_labels == label], axis=0) for label in (0, 1)]
              )
              distances = np.linalg.norm(
                  test_features[:, None, :] - centroids[None, :, :], axis=2
              )
              return np.argmin(distances, axis=1).astype(np.int64)


          def balanced_accuracy_details(
              labels: np.ndarray, predictions: np.ndarray
          ) -> Dict[str, float]:
              class_accuracy = {}
              for label, name in ((LABEL_A, "A"), (LABEL_B, "B")):
                  mask = labels == label
                  if not np.any(mask):
                      raise ValueError("Both labels are required")
                  class_accuracy[name] = float(np.mean(predictions[mask] == label))
              balanced = 0.5 * (class_accuracy["A"] + class_accuracy["B"])
              return {
                  "balanced_accuracy": balanced,
                  "accuracy_A": class_accuracy["A"],
                  "accuracy_B": class_accuracy["B"],
                  "class_imbalance": abs(class_accuracy["A"] - class_accuracy["B"]),
              }


          def keyed_rng(channel: str, checkpoint_code: int, purpose: str) -> np.random.Generator:
              return np.random.default_rng(
                  np.random.SeedSequence(
                      [SEED, CHANNEL_IDS[channel], checkpoint_code, PURPOSE_IDS[purpose]]
                  )
              )


          def permutation_p_value(
              labels: np.ndarray,
              predictions: np.ndarray,
              rng: np.random.Generator,
              permutations: int = 2000,
          ) -> float:
              observed = balanced_accuracy_details(labels, predictions)["balanced_accuracy"]
              exceed = 0
              for _ in range(permutations):
                  shuffled = rng.permutation(labels)
                  null_accuracy = balanced_accuracy_details(shuffled, predictions)["balanced_accuracy"]
                  if null_accuracy >= observed:
                      exceed += 1
              return (1.0 + exceed) / (permutations + 1.0)


          def normalized_pair_distance(a: np.ndarray, b: np.ndarray) -> float:
              numerator = float(np.linalg.norm(a - b))
              denominator = 0.5 * (float(np.linalg.norm(a)) + float(np.linalg.norm(b))) + 1e-30
              return numerator / denominator


          def train_test_masks(variant_ids: np.ndarray) -> Tuple[np.ndarray, np.ndarray]:
              train = variant_ids % 3 != 2
              return train, ~train


          def observer_metrics(
              fields: np.ndarray,
              labels: np.ndarray,
              variant_ids: np.ndarray,
              channel: str,
              checkpoint_code: int,
              imprint_rms: float,
          ) -> Dict[str, Any]:
              train_mask, test_mask = train_test_masks(variant_ids)
              test_labels = labels[test_mask]

              q_predictions_all = quadrupole_predictions(fields)
              q_predictions = q_predictions_all[test_mask]
              q_details = balanced_accuracy_details(test_labels, q_predictions)
              q_details["permutation_p"] = permutation_p_value(
                  test_labels,
                  q_predictions,
                  keyed_rng(channel, checkpoint_code, "quadrupole_permutation"),
              )

              features = np.stack([pooled_feature(field) for field in fields])
              pooled_predictions = nearest_centroid_predictions(
                  features[train_mask], labels[train_mask], features[test_mask]
              )
              pooled_details = balanced_accuracy_details(test_labels, pooled_predictions)
              pooled_details["permutation_p"] = permutation_p_value(
                  test_labels,
                  pooled_predictions,
                  keyed_rng(channel, checkpoint_code, "pooled_permutation"),
              )

              noise = {}
              for level, scale, noise_purpose, q_perm_purpose, pool_perm_purpose in (
                  (
                      "low",
                      1e-4,
                      "low_noise",
                      "low_noise_quadrupole_permutation",
                      "low_noise_pooled_permutation",
                  ),
                  (
                      "high",
                      1e-3,
                      "high_noise",
                      "high_noise_quadrupole_permutation",
                      "high_noise_pooled_permutation",
                  ),
              ):
                  noisy = np.maximum(
                      fields
                      + keyed_rng(channel, checkpoint_code, noise_purpose).normal(
                          0.0, scale * imprint_rms, size=fields.shape
                      ),
                      0.0,
                  )
                  noisy_q_predictions = quadrupole_predictions(noisy)[test_mask]
                  noisy_q = balanced_accuracy_details(test_labels, noisy_q_predictions)
                  noisy_q["permutation_p"] = permutation_p_value(
                      test_labels,
                      noisy_q_predictions,
                      keyed_rng(channel, checkpoint_code, q_perm_purpose),
                  )
                  noisy_features = np.stack([pooled_feature(field) for field in noisy])
                  noisy_pooled_predictions = nearest_centroid_predictions(
                      noisy_features[train_mask],
                      labels[train_mask],
                      noisy_features[test_mask],
                  )
                  noisy_pooled = balanced_accuracy_details(test_labels, noisy_pooled_predictions)
                  noisy_pooled["permutation_p"] = permutation_p_value(
                      test_labels,
                      noisy_pooled_predictions,
                      keyed_rng(channel, checkpoint_code, pool_perm_purpose),
                  )
                  noise[level] = {"quadrupole": noisy_q, "pooled": noisy_pooled}

              rms = float(np.median(np.sqrt(np.mean(fields * fields, axis=(1, 2)))))
              return {
                  "quadrupole": q_details,
                  "pooled": pooled_details,
                  "noise": noise,
                  "relative_signal_amplitude": rms / (imprint_rms + 1e-30),
                  "median_rms": rms,
              }


          def passive_retained(metrics: Dict[str, Any]) -> bool:
              signal_ok = metrics["relative_signal_amplitude"] >= 1e-6
              for observer in ("quadrupole", "pooled"):
                  exact = metrics[observer]
                  low = metrics["noise"]["low"][observer]
                  high = metrics["noise"]["high"][observer]
                  if exact["balanced_accuracy"] < 0.90 or exact["permutation_p"] > 0.01:
                      return False
                  if exact["class_imbalance"] > 0.10:
                      return False
                  if exact["balanced_accuracy"] - low["balanced_accuracy"] > 0.05:
                      return False
                  if low["permutation_p"] > 0.01:
                      return False
                  if high["balanced_accuracy"] < 0.80 or high["permutation_p"] > 0.01:
                      return False
              return signal_ok


          def causal_thresholds(d_null: float) -> Dict[str, float]:
              return {
                  "full": max(1e-4, 10.0 * d_null),
                  "single": max(5e-5, 5.0 * d_null),
              }


          def causal_signature(
              d_null: float, d_full: float, d_phi_only: float, d_mu_only: float
          ) -> Dict[str, bool]:
              thresholds = causal_thresholds(d_null)
              return {
                  "full_pass": d_full >= thresholds["full"],
                  "phi_only_pass": d_phi_only >= thresholds["single"],
                  "mu_only_pass": d_mu_only >= thresholds["single"],
                  "mu_zeroing_reduces_full_by_half": d_phi_only <= 0.5 * d_full,
                  "phi_zeroing_reduces_full_by_half": d_mu_only <= 0.5 * d_full,
              }


          def prepare_echo_state(
              source_off_state: Dict[str, Any], common_psi: np.ndarray, lane: str
          ) -> Dict[str, Any]:
              out = clone_state(source_off_state)
              out["psi"] = np.asarray(common_psi, dtype=np.complex128).copy()
              if lane == "C0":
                  out["phi"][:] = 0.0
                  out["mu"][:] = 0.0
              elif lane == "C2":
                  out["mu"][:] = 0.0
              elif lane == "C3":
                  out["phi"][:] = 0.0
              elif lane not in {"C1", "C4"}:
                  raise ValueError(f"Unknown causal lane: {lane}")
              return out


          def rotate_state(state: Dict[str, Any]) -> Dict[str, Any]:
              out = clone_state(state)
              for channel in ("psi", "phi", "mu", "kappa"):
                  out[channel] = np.rot90(out[channel]).copy()
              return out


          def lane_validity(stats: Iterable[Dict[str, Any]], cfg: CoreConfig) -> bool:
              return all(
                  stat["finite"]
                  and not stat["possible_fail_safe_reset"]
                  and stat["max_abs_psi"] < 0.1 * cfg.psi_amp_cap
                  and stat["max_phi"] < 0.1 * cfg.phi_cap
                  and stat["max_mu"] < 0.25 * cfg.mu_cap
                  for stat in stats
              )


          def build_histories(
              *,
              size: int,
              cfg: CoreConfig,
              source_off_cfg: CoreConfig,
              imprint_steps: int,
              source_off_steps: int,
              schedule: Sequence[Tuple[float, float, int, int]],
              geometry_scale: float = 1.0,
          ) -> Dict[str, Any]:
              labels: List[int] = []
              variant_ids: List[int] = []
              initial_fields: List[np.ndarray] = []
              imprint_states: List[Dict[str, Any]] = []
              source_off_states: List[Dict[str, Any]] = []
              imprint_stats: List[Dict[str, Any]] = []
              source_off_stats: List[Dict[str, Any]] = []
              energy_differences: List[float] = []
              transpose_errors: List[float] = []
              passive_checkpoints: Dict[str, Dict[int, List[np.ndarray]]] = {
                  channel: {checkpoint: [] for checkpoint in CHECKPOINTS}
                  for channel in ("phi", "mu")
              }
              source_off_psi_max = 0.0

              for variant_id, (separation, width, shift_x, shift_y) in enumerate(schedule):
                  psi_a, psi_b = make_orientation_pair(
                      size,
                      separation * geometry_scale,
                      width * geometry_scale,
                      int(round(shift_x * geometry_scale)),
                      int(round(shift_y * geometry_scale)),
                  )
                  e_a = float(np.sum(np.abs(psi_a) ** 2))
                  e_b = float(np.sum(np.abs(psi_b) ** 2))
                  energy_differences.append(abs(e_a - e_b) / max(e_a, e_b))
                  if shift_x == 0 and shift_y == 0:
                      transpose_errors.append(float(np.max(np.abs(psi_b - psi_a.T))))

                  for label, psi in ((LABEL_A, psi_a), (LABEL_B, psi_b)):
                      labels.append(label)
                      variant_ids.append(variant_id)
                      initial_fields.append(field_weight("psi", psi))
                      imprinted, imp_stats = evolve(make_state(psi), cfg, imprint_steps)
                      imprint_states.append(imprinted)
                      imprint_stats.append(imp_stats)

                      relaxed = clone_state(imprinted)
                      relaxed["psi"][:] = 0.0
                      previous = 0
                      cumulative_stats = {
                          "finite": True,
                          "possible_fail_safe_reset": False,
                          "max_abs_psi": 0.0,
                          "max_phi": float(np.max(relaxed["phi"])),
                          "max_mu": float(np.max(relaxed["mu"])),
                      }
                      for checkpoint in CHECKPOINTS:
                          target_steps = int(round(checkpoint * source_off_steps / 2000.0))
                          delta_steps = target_steps - previous
                          relaxed, stats = evolve(relaxed, source_off_cfg, delta_steps)
                          previous = target_steps
                          cumulative_stats["finite"] = cumulative_stats["finite"] and stats["finite"]
                          cumulative_stats["possible_fail_safe_reset"] = (
                              cumulative_stats["possible_fail_safe_reset"]
                              or stats["possible_fail_safe_reset"]
                          )
                          cumulative_stats["max_abs_psi"] = max(
                              cumulative_stats["max_abs_psi"], stats["max_abs_psi"]
                          )
                          cumulative_stats["max_phi"] = max(
                              cumulative_stats["max_phi"], stats["max_phi"]
                          )
                          cumulative_stats["max_mu"] = max(
                              cumulative_stats["max_mu"], stats["max_mu"]
                          )
                          source_off_psi_max = max(
                              source_off_psi_max, float(np.max(np.abs(relaxed["psi"])))
                          )
                          if source_off_steps == 2000:
                              for channel in ("phi", "mu"):
                                  passive_checkpoints[channel][checkpoint].append(
                                      field_weight(channel, relaxed[channel])
                                  )
                      source_off_states.append(relaxed)
                      source_off_stats.append(cumulative_stats)

              return {
                  "labels": np.asarray(labels, dtype=np.int64),
                  "variant_ids": np.asarray(variant_ids, dtype=np.int64),
                  "initial_fields": np.stack(initial_fields),
                  "imprint_states": imprint_states,
                  "source_off_states": source_off_states,
                  "imprint_stats": imprint_stats,
                  "source_off_stats": source_off_stats,
                  "passive_checkpoints": passive_checkpoints,
                  "max_relative_energy_difference": max(energy_differences),
                  "max_transpose_error": max(transpose_errors) if transpose_errors else 0.0,
                  "source_off_psi_max": source_off_psi_max,
              }


          def run_causal_lanes(
              histories: Dict[str, Any],
              cfg: CoreConfig,
              common: np.ndarray,
              echo_steps: int,
              lanes: Sequence[str] = ("C0", "C1", "C2", "C3"),
          ) -> Dict[str, Any]:
              lane_rows: Dict[str, List[Dict[str, Any]]] = {lane: [] for lane in lanes}
              lane_stats: Dict[str, List[Dict[str, Any]]] = {lane: [] for lane in lanes}
              outputs: Dict[str, Dict[int, Tuple[Dict[str, Any], Dict[str, Any]]]] = {
                  lane: {} for lane in lanes
              }

              states = histories["source_off_states"]
              variant_count = len(states) // 2
              for variant_id in range(variant_count):
                  a_source = states[2 * variant_id]
                  b_source = states[2 * variant_id + 1]
                  for lane in lanes:
                      a_start = prepare_echo_state(a_source, common, lane)
                      b_start = prepare_echo_state(b_source, common, lane)
                      if not np.array_equal(a_start["psi"], b_start["psi"]):
                          raise RuntimeError("Common-state equality gate failed")
                      a_final, a_stats = evolve(a_start, cfg, echo_steps)
                      b_final, b_stats = evolve(b_start, cfg, echo_steps)
                      lane_stats[lane].extend((a_stats, b_stats))
                      outputs[lane][variant_id] = (a_final, b_final)
                      lane_rows[lane].append(
                          {
                              "variant_id": variant_id,
                              **{
                                  f"D_{channel}": normalized_pair_distance(
                                      a_final[channel], b_final[channel]
                                  )
                                  for channel in ("psi", "phi", "mu")
                              },
                          }
                      )

              summary = {}
              for lane, rows in lane_rows.items():
                  summary[lane] = {
                      "median_D_psi": float(np.median([row["D_psi"] for row in rows])),
                      "median_D_phi": float(np.median([row["D_phi"] for row in rows])),
                      "median_D_mu": float(np.median([row["D_mu"] for row in rows])),
                      "valid": lane_validity(lane_stats[lane], cfg),
                  }
              return {"rows": lane_rows, "summary": summary, "outputs": outputs}


          def run_rotation_control(
              histories: Dict[str, Any],
              full_outputs: Dict[int, Tuple[Dict[str, Any], Dict[str, Any]]],
              cfg: CoreConfig,
              common: np.ndarray,
              echo_steps: int,
          ) -> Dict[str, Any]:
              rows = []
              for variant_id in REPRESENTATIVE_INDICES:
                  a_source = histories["source_off_states"][2 * variant_id]
                  b_source = histories["source_off_states"][2 * variant_id + 1]
                  transformed_a = rotate_state(b_source)
                  transformed_b = rotate_state(a_source)
                  transformed_common = np.rot90(common).copy()
                  transformed_a["psi"] = transformed_common.copy()
                  transformed_b["psi"] = transformed_common.copy()
                  a_final, a_stats = evolve(transformed_a, cfg, echo_steps)
                  b_final, b_stats = evolve(transformed_b, cfg, echo_steps)
                  normal_a, normal_b = full_outputs[variant_id]
                  channel_errors = {}
                  for channel in ("psi", "phi", "mu"):
                      error_a = normalized_pair_distance(a_final[channel], np.rot90(normal_b[channel]))
                      error_b = normalized_pair_distance(b_final[channel], np.rot90(normal_a[channel]))
                      channel_errors[channel] = max(error_a, error_b)
                  rows.append(
                      {
                          "variant_id": variant_id,
                          "channel_errors": channel_errors,
                          "valid": lane_validity((a_stats, b_stats), cfg),
                      }
                  )
              maximum_error = max(
                  row["channel_errors"][channel]
                  for row in rows
                  for channel in ("psi", "phi", "mu")
              )
              return {
                  "rows": rows,
                  "maximum_normalized_equivariance_error": maximum_error,
                  "passed": all(row["valid"] for row in rows) and maximum_error <= 1e-10,
              }


          def observer_summary(histories: Dict[str, Any]) -> Dict[str, Any]:
              labels = histories["labels"]
              variant_ids = histories["variant_ids"]
              train_mask, test_mask = train_test_masks(variant_ids)

              p0_fields = histories["initial_fields"]
              p0_q = quadrupole_predictions(p0_fields)[test_mask]
              p0_q_details = balanced_accuracy_details(labels[test_mask], p0_q)
              p0_q_details["permutation_p"] = permutation_p_value(
                  labels[test_mask],
                  p0_q,
                  keyed_rng("psi", 0, "quadrupole_permutation"),
              )
              p0_features = np.stack([pooled_feature(field) for field in p0_fields])
              p0_pooled = nearest_centroid_predictions(
                  p0_features[train_mask], labels[train_mask], p0_features[test_mask]
              )
              p0_pooled_details = balanced_accuracy_details(labels[test_mask], p0_pooled)
              p0_pooled_details["permutation_p"] = permutation_p_value(
                  labels[test_mask],
                  p0_pooled,
                  keyed_rng("psi", 0, "pooled_permutation"),
              )

              unshifted_errors = []
              for separation in (10.0, 12.0, 14.0):
                  for width in (2.5, 3.5):
                      a, b = make_orientation_pair(64, separation, width, 0, 0)
                      unshifted_errors.append(
                          abs(quadrupole_score(field_weight("psi", a)) + quadrupole_score(field_weight("psi", b)))
                      )
              p0_valid = (
                  p0_q_details["balanced_accuracy"] >= 0.95
                  and p0_pooled_details["balanced_accuracy"] >= 0.95
                  and p0_q_details["permutation_p"] <= 0.01
                  and p0_pooled_details["permutation_p"] <= 0.01
                  and max(unshifted_errors) <= 1e-12
                  and p0_q_details["class_imbalance"] <= 0.05
                  and p0_pooled_details["class_imbalance"] <= 0.05
              )

              imprint_rms = {}
              for channel in ("phi", "mu"):
                  imprint_rms[channel] = float(
                      np.median(
                          [
                              np.sqrt(np.mean(field_weight(channel, state[channel]) ** 2))
                              for state in histories["imprint_states"]
                          ]
                      )
                  )

              passive = {channel: {} for channel in ("phi", "mu")}
              for channel in ("phi", "mu"):
                  for checkpoint in CHECKPOINTS:
                      fields = np.stack(histories["passive_checkpoints"][channel][checkpoint])
                      metrics = observer_metrics(
                          fields,
                          labels,
                          variant_ids,
                          channel,
                          checkpoint + 1,
                          imprint_rms[channel],
                      )
                      metrics["retained"] = passive_retained(metrics)
                      passive[channel][str(checkpoint)] = metrics

              return {
                  "P0": {
                      "quadrupole": p0_q_details,
                      "pooled": p0_pooled_details,
                      "max_transpose_antisymmetry_error": max(unshifted_errors),
                      "valid": p0_valid,
                  },
                  "imprint_rms": imprint_rms,
                  "passive": passive,
              }


          def cap_independence(
              primary: Dict[str, Any], cap: Dict[str, Any], primary_observers: Dict[str, Any], cap_observers: Dict[str, Any]
          ) -> Dict[str, Any]:
              checkpoint_differences = {}
              for checkpoint in CHECKPOINTS:
                  differences = [
                      normalized_pair_distance(a, b)
                      for a, b in zip(
                          primary["passive_checkpoints"]["mu"][checkpoint],
                          cap["passive_checkpoints"]["mu"][checkpoint],
                      )
                  ]
                  checkpoint_differences[str(checkpoint)] = float(np.median(differences))

              final_primary = primary_observers["passive"]["mu"]["2000"]
              final_cap = cap_observers["passive"]["mu"]["2000"]
              ba_differences = {
                  observer: abs(
                      final_primary[observer]["balanced_accuracy"]
                      - final_cap[observer]["balanced_accuracy"]
                  )
                  for observer in ("quadrupole", "pooled")
              }
              primary_max_mu = max(stat["max_mu"] for stat in primary["source_off_stats"])
              cap_max_mu = max(stat["max_mu"] for stat in cap["source_off_stats"])
              neither_approaches_cap = primary_max_mu < 2.5 and cap_max_mu < 25.0
              passed = (
                  primary_max_mu < 2.5
                  and all(value <= 0.05 for value in ba_differences.values())
                  and (
                      not neither_approaches_cap
                      or all(value <= 1e-6 for value in checkpoint_differences.values())
                  )
              )
              return {
                  "primary_max_mu": primary_max_mu,
                  "cap_raised_max_mu": cap_max_mu,
                  "balanced_accuracy_differences": ba_differences,
                  "median_normalized_field_differences": checkpoint_differences,
                  "neither_lane_approaches_cap": neither_approaches_cap,
                  "passed": passed,
              }


          def subset_histories(histories: Dict[str, Any], variant_ids: Sequence[int]) -> Dict[str, Any]:
              indices = []
              for variant_id in variant_ids:
                  indices.extend((2 * variant_id, 2 * variant_id + 1))
              return {
                  "source_off_states": [histories["source_off_states"][index] for index in indices]
              }


          def representative_signature(causal: Dict[str, Any]) -> Dict[str, bool]:
              summary = causal["summary"]
              return causal_signature(
                  summary["C0"]["median_D_psi"],
                  summary["C1"]["median_D_psi"],
                  summary["C2"]["median_D_psi"],
                  summary["C3"]["median_D_psi"],
              )


          def run_representative_control(
              *, size: int, dt: float, geometry_scale: float, imprint_steps: int, source_off_steps: int, echo_steps: int
          ) -> Dict[str, Any]:
              schedule = [SCHEDULE[index] for index in REPRESENTATIVE_INDICES]
              cfg = frozen_config(dt=dt)
              source_cfg = replace(cfg, mu_eta=0.0)
              histories = build_histories(
                  size=size,
                  cfg=cfg,
                  source_off_cfg=source_cfg,
                  imprint_steps=imprint_steps,
                  source_off_steps=source_off_steps,
                  schedule=schedule,
                  geometry_scale=geometry_scale,
              )
              common = make_common_state(size, width=5.0 * geometry_scale)
              causal = run_causal_lanes(histories, cfg, common, echo_steps)
              return {
                  "summary": causal["summary"],
                  "signature": representative_signature(causal),
                  "valid": all(item["valid"] for item in causal["summary"].values()),
              }


          def ratio_in_range(reference: float, candidate: float, floor: float) -> bool:
              if reference <= floor or candidate <= floor:
                  return True
              ratio = candidate / reference
              return 0.5 <= ratio <= 2.0


          def classify_outcome(
              *,
              primary_observers: Dict[str, Any],
              causal: Dict[str, Any],
              cap_control: Dict[str, Any],
              cap_causal: Dict[str, Any],
              rotation_control: Dict[str, Any],
              timestep_control: Dict[str, Any],
              resolution_control: Dict[str, Any],
              primary_representative: Dict[str, Any],
              source_off_psi_max: float,
              numerical_valid: bool,
          ) -> Dict[str, Any]:
              if not primary_observers["P0"]["valid"]:
                  return {"classification": "inconclusive_observer_invalid", "direct_q2_stage_open": False}
              if not numerical_valid or source_off_psi_max > 1e-15:
                  return {"classification": "inconclusive_numerical_invalid", "direct_q2_stage_open": False}
              if not cap_control["passed"]:
                  return {"classification": "inconclusive_cap_confounded", "direct_q2_stage_open": False}
              if not rotation_control["passed"]:
                  return {"classification": "inconclusive_grid_orientation_confounded", "direct_q2_stage_open": False}

              summary = causal["summary"]
              if not all(summary[lane]["valid"] for lane in ("C0", "C1", "C2", "C3")):
                  return {"classification": "inconclusive_causal_lane_invalid", "direct_q2_stage_open": False}
              d_null = summary["C0"]["median_D_psi"]
              if any(summary["C0"][f"median_D_{channel}"] > 1e-12 for channel in ("psi", "phi", "mu")):
                  return {"classification": "inconclusive_null_failed", "direct_q2_stage_open": False}

              sig = causal_signature(
                  d_null,
                  summary["C1"]["median_D_psi"],
                  summary["C2"]["median_D_psi"],
                  summary["C3"]["median_D_psi"],
              )
              primary_sig = primary_representative["signature"]
              for control in (timestep_control, resolution_control):
                  if not control["valid"] or control["signature"] != primary_sig:
                      return {"classification": "inconclusive_scale_sensitive", "direct_q2_stage_open": False}
                  floor = causal_thresholds(primary_representative["summary"]["C0"]["median_D_psi"])["single"]
                  if not ratio_in_range(
                      primary_representative["summary"]["C3"]["median_D_psi"],
                      control["summary"]["C3"]["median_D_psi"],
                      floor,
                  ):
                      return {"classification": "inconclusive_scale_sensitive", "direct_q2_stage_open": False}

              cap_summary = cap_causal["summary"]
              cap_full_pass = cap_summary["C4"]["median_D_psi"] >= causal_thresholds(
                  cap_summary["C0"]["median_D_psi"]
              )["full"]
              if cap_full_pass != sig["full_pass"]:
                  return {"classification": "inconclusive_cap_causal_sensitive", "direct_q2_stage_open": False}
              if not ratio_in_range(
                  summary["C1"]["median_D_psi"],
                  cap_summary["C4"]["median_D_psi"],
                  causal_thresholds(d_null)["full"],
              ):
                  return {"classification": "inconclusive_cap_causal_sensitive", "direct_q2_stage_open": False}

              mu_retained = primary_observers["passive"]["mu"]["2000"]["retained"]
              phi_retained = primary_observers["passive"]["phi"]["2000"]["retained"]

              if mu_retained and sig["full_pass"] and sig["mu_only_pass"] and sig["mu_zeroing_reduces_full_by_half"]:
                  return {
                      "classification": "mu_causal_reuse_candidate_supported_primary_pending_independent_check",
                      "direct_q2_stage_open": False,
                      "independent_checker_required": True,
                  }
              if mu_retained and not sig["mu_only_pass"]:
                  return {
                      "classification": "mu_passive_archive_without_demonstrated_causal_reuse",
                      "direct_q2_stage_open": False,
                      "independent_checker_required": True,
                  }
              if sig["full_pass"] and sig["phi_only_pass"] and not sig["mu_only_pass"] and phi_retained:
                  return {
                      "classification": "phi_only_causal_candidate_mu_only_unsupported",
                      "direct_q2_stage_open": False,
                      "independent_checker_required": True,
                  }
              if sig["full_pass"] and not sig["phi_only_pass"] and not sig["mu_only_pass"]:
                  return {
                      "classification": "joint_or_distributed_history_candidate",
                      "direct_q2_stage_open": False,
                      "independent_checker_required": True,
                  }
              if not sig["full_pass"] and not sig["phi_only_pass"] and not sig["mu_only_pass"]:
                  return {
                      "classification": "current_phi_mu_causal_reuse_unsupported_under_tested_conditions",
                      "direct_q2_stage_open": False,
                      "independent_checker_required": True,
                  }
              return {
                  "classification": "mixed_causal_result_unresolved",
                  "direct_q2_stage_open": False,
                  "independent_checker_required": True,
              }


          def repository_commit() -> str:
              override = os.environ.get("LINEUM_REPOSITORY_COMMIT", "").strip()
              if override:
                  return override
              try:
                  return subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True, stderr=subprocess.DEVNULL
                  ).strip()
              except (OSError, subprocess.CalledProcessError):
                  return "unknown"


          def environment_receipt() -> Dict[str, Any]:
              return {
                  "python": sys.version,
                  "numpy": np.__version__,
                  "numpy_supported": supported_numpy_version(np.__version__),
                  "platform": platform.platform(),
                  "machine": platform.machine(),
                  "processor": platform.processor(),
                  "repository_commit": repository_commit(),
                  "engine_git_blob": ENGINE_GIT_BLOB,
                  "preregistration_commit": PREREGISTRATION_COMMIT,
                  "preregistration_version": PREREGISTRATION_VERSION,
              }


          def run_primary() -> Dict[str, Any]:
              if not supported_numpy_version(np.__version__):
                  raise RuntimeError(
                      f"Unsupported NumPy for official Q2-M1 Stage A: {np.__version__}; require >=1.24,<2.0"
                  )
              ExecutionPolicy.init_core_determinism(
                  enforce_canonical=True, seed=SEED, device_mode="numpy"
              )
              cfg = frozen_config()
              source_cfg = replace(cfg, mu_eta=0.0)
              cap_cfg = frozen_config(mu_cap=100.0)
              cap_source_cfg = replace(cap_cfg, mu_eta=0.0)
              high_decay_source_cfg = replace(cfg, mu_eta=0.0, mu_rho=0.01)

              primary = build_histories(
                  size=64,
                  cfg=cfg,
                  source_off_cfg=source_cfg,
                  imprint_steps=120,
                  source_off_steps=2000,
                  schedule=SCHEDULE,
              )
              cap = build_histories(
                  size=64,
                  cfg=cap_cfg,
                  source_off_cfg=cap_source_cfg,
                  imprint_steps=120,
                  source_off_steps=2000,
                  schedule=SCHEDULE,
              )

              high_decay_final_mu_rms = []
              for imprinted in primary["imprint_states"]:
                  relaxed = clone_state(imprinted)
                  relaxed["psi"][:] = 0.0
                  relaxed, _ = evolve(relaxed, high_decay_source_cfg, 2000)
                  high_decay_final_mu_rms.append(float(np.sqrt(np.mean(relaxed["mu"] ** 2))))

              primary_observers = observer_summary(primary)
              cap_observers = observer_summary(cap)
              cap_control = cap_independence(primary, cap, primary_observers, cap_observers)

              common = make_common_state(64)
              causal = run_causal_lanes(primary, cfg, common, 200)
              cap_c0 = run_causal_lanes(cap, cap_cfg, common, 200, lanes=("C0",))
              cap_c4 = run_causal_lanes(cap, cap_cfg, common, 200, lanes=("C4",))
              cap_causal = {
                  "summary": {**cap_c0["summary"], **cap_c4["summary"]},
                  "rows": {**cap_c0["rows"], **cap_c4["rows"]},
              }
              rotation = run_rotation_control(primary, causal["outputs"]["C1"], cfg, common, 200)

              primary_rep = run_causal_lanes(
                  subset_histories(primary, REPRESENTATIVE_INDICES), cfg, common, 200
              )
              primary_representative = {
                  "summary": primary_rep["summary"],
                  "signature": representative_signature(primary_rep),
                  "valid": all(item["valid"] for item in primary_rep["summary"].values()),
              }
              timestep_control = run_representative_control(
                  size=64,
                  dt=0.05,
                  geometry_scale=1.0,
                  imprint_steps=240,
                  source_off_steps=4000,
                  echo_steps=400,
              )
              resolution_control = run_representative_control(
                  size=96,
                  dt=0.1,
                  geometry_scale=96.0 / 64.0,
                  imprint_steps=120,
                  source_off_steps=2000,
                  echo_steps=200,
              )

              numerical_valid = (
                  primary["max_relative_energy_difference"] <= 1e-14
                  and primary["max_transpose_error"] <= 1e-14
                  and lane_validity(primary["imprint_stats"], cfg)
                  and lane_validity(primary["source_off_stats"], cfg)
              )
              outcome = classify_outcome(
                  primary_observers=primary_observers,
                  causal=causal,
                  cap_control=cap_control,
                  cap_causal=cap_causal,
                  rotation_control=rotation,
                  timestep_control=timestep_control,
                  resolution_control=resolution_control,
                  primary_representative=primary_representative,
                  source_off_psi_max=primary["source_off_psi_max"],
                  numerical_valid=numerical_valid,
              )

              return {
                  "schema": SCHEMA,
                  "stage": STAGE,
                  "environment": environment_receipt(),
                  "protocol": {
                      "config": asdict(cfg),
                      "source_off_config": asdict(source_cfg),
                      "schedule": [list(item) for item in SCHEDULE],
                      "representative_indices": list(REPRESENTATIVE_INDICES),
                      "checkpoints": list(CHECKPOINTS),
                      "imprint_steps": 120,
                      "source_off_steps": 2000,
                      "echo_steps": 200,
                  },
                  "validity": {
                      "max_relative_initial_energy_difference": primary["max_relative_energy_difference"],
                      "max_unshifted_transpose_error": primary["max_transpose_error"],
                      "source_off_psi_max": primary["source_off_psi_max"],
                      "primary_numerical_valid": numerical_valid,
                  },
                  "observers": primary_observers,
                  "cap_observers": cap_observers,
                  "cap_independence": cap_control,
                  "high_decay_mu_final_median_rms": float(np.median(high_decay_final_mu_rms)),
                  "causal": {"summary": causal["summary"], "rows": causal["rows"]},
                  "cap_causal": cap_causal,
                  "rotation_control": rotation,
                  "primary_representative": primary_representative,
                  "timestep_control": timestep_control,
                  "resolution_control": resolution_control,
                  "outcome": outcome,
                  "claim_boundary": {
                      "empirically_connected": False,
                      "direct_q2_stage_open": False,
                      "physical_memory_established": False,
                  },
              }


          def main(argv: Sequence[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description="Run frozen Q2-M1 Stage A causal-reuse test")
              parser.add_argument("--output", required=True, type=Path)
              args = parser.parse_args(argv)
              started = time.perf_counter()
              result = run_primary()
              result["wall_clock_seconds"] = time.perf_counter() - started
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(
                  json.dumps(result, sort_keys=True, indent=2, allow_nan=False) + "\n",
                  encoding="utf-8",
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
