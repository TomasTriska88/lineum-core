              assert int(np.count_nonzero(test)) == 20
              assert np.all(train[variant_ids % 3 != 2])
              assert np.all(test[variant_ids % 3 == 2])


          def test_source_off_mu_decay_matches_analytic_one_step():
              from lineum_core.math import ExecutionPolicy, step_core

              ExecutionPolicy.init_core_determinism(
                  enforce_canonical=True, seed=m1.SEED, device_mode="numpy"
              )
              cfg = m1.frozen_config(mu_eta=0.0)
              psi = np.zeros((8, 8), dtype=np.complex128)
              state = m1.make_state(psi)
              row, col = m1.array_coordinates(8)
              state["mu"] = 0.2 + 0.01 * (row - row.min()) + 0.02 * (col - col.min())
              before = state["mu"].copy()
              out = step_core(m1.clone_state(state), cfg)
              np.testing.assert_allclose(
                  out["mu"], before * (1.0 - cfg.mu_rho * cfg.dt), rtol=0, atol=1e-15
              )
              assert np.max(np.abs(out["psi"])) == 0.0
              assert np.max(np.abs(out["phi"])) == 0.0


          def test_causal_lane_erasure_semantics_and_common_state_equality():
              a, _ = m1.make_orientation_pair(32, 10.0, 2.5, 0, 0)
              source = m1.make_state(a)
              source["phi"][:] = 0.25
              source["mu"][:] = 0.5
              common = m1.make_common_state(32)
              c0 = m1.prepare_echo_state(source, common, "C0")
              c2 = m1.prepare_echo_state(source, common, "C2")
              c3 = m1.prepare_echo_state(source, common, "C3")
              assert np.array_equal(c0["psi"], common)
              assert np.max(c0["phi"]) == 0.0 and np.max(c0["mu"]) == 0.0
              assert np.max(c2["phi"]) == 0.25 and np.max(c2["mu"]) == 0.0
              assert np.max(c3["phi"]) == 0.0 and np.max(c3["mu"]) == 0.5


          def test_causal_thresholds_and_reduction_logic_are_fail_closed():
              sig = m1.causal_signature(
                  d_null=1e-8,
                  d_full=2e-4,
                  d_phi_only=8e-5,
                  d_mu_only=7e-5,
              )
              assert sig["full_pass"]
              assert sig["phi_only_pass"]
              assert sig["mu_only_pass"]
              assert sig["mu_zeroing_reduces_full_by_half"]
              assert sig["phi_zeroing_reduces_full_by_half"]
              assert not m1.causal_signature(1e-8, 9e-5, 4e-5, 4e-5)["full_pass"]


          def test_rotation_helper_and_equivariance_metric_known_answer():
              a, b = m1.make_orientation_pair(32, 10.0, 2.5, 0, 0)
              state_a = m1.make_state(a)
              state_b = m1.make_state(b)
              rotated_b = m1.rotate_state(state_b)
              np.testing.assert_allclose(rotated_b["psi"], np.rot90(state_b["psi"]), rtol=0, atol=0)
              assert m1.normalized_pair_distance(rotated_b["psi"], np.rot90(state_b["psi"])) == 0.0
              transformed_a = m1.rotate_state(state_b)
              transformed_b = m1.rotate_state(state_a)
              assert m1.quadrupole_score(m1.field_weight("psi", transformed_a["psi"])) > 0
              assert m1.quadrupole_score(m1.field_weight("psi", transformed_b["psi"])) < 0


          def test_supported_numpy_version_gate():
              assert m1.supported_numpy_version("1.24.0")
              assert m1.supported_numpy_version("1.26.4")
              assert not m1.supported_numpy_version("2.0.0")
              assert not m1.supported_numpy_version("2.3.5")


