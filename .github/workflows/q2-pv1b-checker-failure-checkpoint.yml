name: Q2 PV1-B Checker Failure Checkpoint

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/q2-pv1b-checker-failure-checkpoint.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact retained inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .github/scripts/q2_pv1b_checker_failure_checkpoint.py)" = "c21b259b49eb8414640f1715742ede8b403d3904"
          test "$(git hash-object research/lineum-public-tolog-galactic-shape-b4.md)" = "d02a860cb1fde5ac39ce03aa2168a4b6896b13e0"
          test "$(git hash-object research/lineum-public-tolog-b4/artifact-manifest.json)" = "0bbd687f2bd00cea57cd7bdab138bcb19f464309"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control.json)" = "50d3f15d881e0665a450982053a9216f9cf5739c"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check.json)" = "48e9a024b8988be6272526531efa476264ced791"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-execution.json)" = "fa235870fc1f40086f36db315543a2b861eb22f5"
          test "$(git hash-object research/runners/lineum_b4_q2_ledger_neutral_control_check.py)" = "50a26bcfc7ef16af33f192b97eb99690e8a13fea"
          test "$(git hash-object tests/research/test_lineum_b4_q2_ledger_neutral_control_check.py)" = "937e0c1e36c1bdad4a84749aec11ef19ffecb4d5"

      - name: Apply fail-closed technical-failure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/q2_pv1b_checker_failure_checkpoint.py
          grep -q '\*\*Version:\*\* 0.24.2' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q 'technical comparison-method failure' research/lineum-public-tolog-galactic-shape-b4.md
          grep -q '1.1133508601492564e-06' research/lineum-public-tolog-galactic-shape-b4.md
          test -f research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json
          python - <<'PY'
          import json
          from pathlib import Path
          repair = json.loads(Path('research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json').read_text())
          assert repair['status'] == 'repair_frozen_before_implementation'
          assert repair['failed_checker']['numeric_mismatch_count'] == 2
          assert repair['failed_checker']['categorical_mismatch_count'] == 0
          assert repair['allowed_change']['remove_from_cross_implementation_numeric_equality'] == ['perturbation_ledger.delta_ledger']
          manifest = json.loads(Path('research/lineum-public-tolog-b4/artifact-manifest.json').read_text())
          checker = manifest['q2_ledger_neutral_control_checker']
          assert checker['scientific_status'] == 'attempt_1_technical_comparison_method_failure'
          assert checker['repair_status'] == 'frozen_before_implementation'
          PY

      - name: Publish checkpoint and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/q2-pv1b-checker-failure-checkpoint.yml
          rm .github/scripts/q2_pv1b_checker_failure_checkpoint.py
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/scripts/q2_pv1b_checker_failure_checkpoint.py' '.github/workflows/q2-pv1b-checker-failure-checkpoint.yml' 'research/lineum-public-tolog-b4/artifact-manifest.json' 'research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json' 'research/lineum-public-tolog-galactic-shape-b4.md' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/q2_pv1b_checker_failure_checkpoint.py .github/workflows/q2-pv1b-checker-failure-checkpoint.yml research/lineum-public-tolog-b4/artifact-manifest.json research/lineum-public-tolog-b4/q2-ledger-neutral-control-check-repair-protocol.json research/lineum-public-tolog-galactic-shape-b4.md
          remote_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git commit -m "research: record Q2 PV1-B checker comparison failure"
          git push origin HEAD:develop
