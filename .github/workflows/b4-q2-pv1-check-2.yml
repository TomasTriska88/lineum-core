name: B4 Q2 PV1 Repaired Independent Checker

'on':
  push:
    branches:
      - develop
    paths:
      - .github/workflows/b4-q2-pv1-check-2.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify environment and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$(git rev-parse HEAD)"
          python - <<'PY'
          import numpy as np
          import platform
          import pytest
          print("python=" + platform.python_version())
          print("numpy=" + np.__version__)
          print("pytest=" + pytest.__version__)
          if int(np.__version__.split(".")[0]) >= 2:
              raise SystemExit("NumPy 2.x is outside the frozen supported range")
          PY
          report_path="research/lineum-public-tolog-galactic-shape-b4.md"
          report_blob="$(git hash-object "$report_path")"
          parent_report_blob="$(git rev-parse HEAD^:"$report_path")"
          test "$report_blob" = "$parent_report_blob"
          grep -F '**Version:** 0.22.1' "$report_path"
          echo "report_blob=$report_blob"
          test "$(git hash-object research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json)" = "7a7ce23471d51d9b2244256387934658b12e1f52"
          test "$(git hash-object research/runners/lineum_b4_saturation_localized_l1.py)" = "1598faf0f39e056c1684f767c2554edc63283ca4"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger.py)" = "e3657119b855965b4fd622b3e94f08443a7c9107"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger.py)" = "403c1cb8747cebf3280009b3b2ffcd814c72e060"
          test "$(git hash-object research/runners/lineum_b4_q2_perturbation_ledger_check.py)" = "1dccd70d3c3bb67d3922c33b58f7e18c85f40ee2"
          test "$(git hash-object tests/research/test_lineum_b4_q2_perturbation_ledger_check.py)" = "c6a2eef798d7078172446f0c04cf36af81378d97"
      - name: Run frozen repaired-checker test gate
        run: |
          python -m pytest -q tests/research/test_lineum_b4_saturation_localized_l1.py tests/research/test_lineum_b4_q2_perturbation_ledger.py tests/research/test_lineum_b4_q2_perturbation_ledger_check.py
      - name: Run repaired independent retained-statistics checker exactly once
        id: checker
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/q2-pv1-check.json"
          stdout="$RUNNER_TEMP/q2-pv1-check.stdout"
          set +e
          python research/runners/lineum_b4_q2_perturbation_ledger_check.py \
            --primary research/lineum-public-tolog-b4/q2-perturbation-ledger-stage-a.json \
            --output "$output" >"$stdout" 2>&1
          status=$?
          set -e
          cat "$stdout"
          if [ -f "$output" ]; then
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "q2-pv1-check.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          print("Q2_PV1_CHECK_RESULT_BEGIN")
          print(json.dumps(payload, sort_keys=True, separators=(",", ":"), allow_nan=False))
          print("Q2_PV1_CHECK_RESULT_END")
          print("file_sha256=" + hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Remove one-use Q2-PV1 checker workflows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/b4-q2-pv1-check.yml .github/workflows/b4-q2-pv1-check-2.yml
          if git diff --cached --quiet; then
            echo "No workflow cleanup change required"
          else
            git commit -m "research: remove one-use B4 Q2 PV1 checker workflows"
            git push origin HEAD:develop
          fi
      - name: Propagate checker failure
        if: always()
        shell: bash
        run: |
          test "${{ steps.checker.outputs.exit_code }}" = "0"
