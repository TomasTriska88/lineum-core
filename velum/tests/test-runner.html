<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velum Compiler — Test Suite Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030303;
      --panel-bg: #0d0d11;
      --accent-cyan: #00ffff;
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --color-green: #30d5c8;
      --color-red: #ff3b30;
      --border-color: rgba(255, 255, 255, 0.06);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0.5rem 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .summary-bar {
      display: flex;
      gap: 1.5rem;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .summary-card {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .summary-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: 'JetBrains+Mono', monospace;
      margin-top: 0.25rem;
    }

    .summary-value.pass { color: var(--color-green); }
    .summary-value.fail { color: var(--color-red); }

    .test-log-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: 'JetBrains+Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-x: auto;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .log-line {
      margin-bottom: 0.5rem;
      border-left: 3px solid transparent;
      padding-left: 0.75rem;
    }

    .log-line.title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-cyan);
      border-left: none;
      padding-left: 0;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .log-line.pass {
      color: var(--color-green);
      border-left-color: var(--color-green);
    }

    .log-line.fail {
      color: var(--color-red);
      border-left-color: var(--color-red);
      background-color: rgba(255, 59, 48, 0.05);
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      border-radius: 0 4px 4px 0;
    }

    .log-line.summary {
      font-weight: 700;
      border-left: none;
      padding-left: 0;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Velum Compiler Test Suite</h1>
      <div class="subtitle">Platform-Independent Verification</div>
    </header>

    <div class="summary-bar">
      <div class="summary-card">
        <span class="summary-label">Total Runs</span>
        <span id="sum-total" class="summary-value">—</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Passed</span>
        <span id="sum-passed" class="summary-value pass">—</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Failed</span>
        <span id="sum-failed" class="summary-value fail">—</span>
      </div>
    </div>

    <div class="test-log-panel" id="log-container">
      <div class="log-line title">Initializing browser-native execution runner...</div>
    </div>
  </div>

  <script type="module">
    const container = document.getElementById('log-container');
    const totalEl = document.getElementById('sum-total');
    const passedEl = document.getElementById('sum-passed');
    const failedEl = document.getElementById('sum-failed');

    // Intercept standard console outputs to show in DOM
    const logs = [];
    const originalLog = console.log;
    const originalError = console.error;

    console.log = (...args) => {
      originalLog(...args);
      const msg = args.join(' ');
      addLogLine(msg, 'info');
    };

    console.error = (...args) => {
      originalError(...args);
      const msg = args.join(' ');
      addLogLine(msg, 'error');
    };

    function addLogLine(text, type) {
      const line = document.createElement('div');
      line.className = 'log-line';
      
      if (text.startsWith('✔')) {
        line.classList.add('pass');
      } else if (text.startsWith('✖') || type === 'error') {
        line.classList.add('fail');
      } else if (text.startsWith('---')) {
        line.classList.add('title');
      } else if (text.startsWith('Results:')) {
        line.classList.add('summary');
      }

      line.textContent = text;
      container.appendChild(line);
    }

    // Load and run the ES module test suite
    try {
      const { runVelumTests } = await import('./velum-compiler.test.js');
      
      // Clear the initializing line
      container.innerHTML = '';
      
      runVelumTests();

      // Parse counts from output to fill summary dashboard
      const logLines = Array.from(container.querySelectorAll('.log-line'));
      const passCount = logLines.filter(l => l.classList.contains('pass')).length;
      const failCount = logLines.filter(l => l.classList.contains('fail')).length;

      totalEl.textContent = passCount + failCount;
      passedEl.textContent = passCount;
      failedEl.textContent = failCount;

    } catch (err) {
      console.error('Test suite failed to load:', err);
      failedEl.textContent = 'ERROR';
    }
  </script>
</body>
</html>
